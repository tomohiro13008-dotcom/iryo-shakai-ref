<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>医療と社会のレファレンス</title>
<style>
/* 医療と社会のレファレンス v0
   色は統合アプリの変数、決まりはデジタル庁デザインシステム（DESIGN.md）。ライトのみ。
   文字に使わない色：#7d8890・#2f9e6b・#e0a423。#d5dde1 は飾りの罫線だけ（ボタンや入力欄の枠に使わない） */
:root {
  color-scheme: light;
  --ink: #14181d; --ink-soft: #4a555e; --ink-faint: #7d8890;
  --paper: #ffffff; --panel: #f4f7f8; --line: #d5dde1;
  --teal: #0e7c86; --teal-d: #0a5b63; --teal-wash: #e3f1f2;
  --side: #10333a; --side-ink: #dfe9ea; --side-soft: #a9c4c8;
  --link: #0017c1; --visited: #5c10be;
  --ok-ink: #1e6b3f; --ok-wash: #e6f4ec; --ok-line: #2f9e6b;
  --draft-ink: #5f4708; --draft-wash: #fbf1d8; --draft-line: #8a6a12;
  --warn-ink: #8f2c1c; --warn-wash: #f8e2dc; --warn-line: #b8452f;
  --focus-y: #ffd43d; --focus-k: #000000;
  --sans: system-ui, -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
  --side-w: 232px;
}
* { box-sizing: border-box; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--panel); color: var(--ink); font-family: var(--sans); font-size: 1rem; line-height: 1.7; overflow-wrap: anywhere; line-break: strict; }
h1, h2, h3 { line-height: 1.4; margin: 0; text-wrap: balance; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--link); text-underline-offset: 3px; }
a:visited { color: var(--visited); }
a:hover { text-decoration-thickness: 2px; }
[hidden] { display: none !important; }
/* フォーカス：黄色と黒の二重の枠（デジタル庁デザインシステム）。どの部品でも変えない */
:focus-visible { outline: 3px solid var(--focus-k); outline-offset: 2px; box-shadow: 0 0 0 2px var(--focus-y); }
.side :focus-visible { outline-color: var(--focus-y); box-shadow: 0 0 0 2px var(--focus-k); }
main:focus, [tabindex="-1"]:not(a):not(button):focus { outline: none; box-shadow: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.skip { position: absolute; left: 8px; top: -60px; z-index: 100; background: var(--paper); color: var(--link); padding: 8px 14px; border: 2px solid var(--ink); }
.skip:focus { top: 8px; }

/* ===== 骨組み：左メニュー（統合アプリと同じ）＋本文 ===== */
.shell { display: flex; min-height: 100vh; }
.side { width: var(--side-w); flex: none; background: var(--side); color: var(--side-ink); position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.side-brand { padding: 16px 16px 12px; border-bottom: 1px solid rgba(255,255,255,.16); }
.side-title { color: #ffffff; font-weight: 700; font-size: 1rem; line-height: 1.4; text-decoration: none; display: block; }
.side-title:visited { color: #ffffff; }
.side-sub { font-size: .875rem; color: var(--side-soft); margin-top: 2px; }
.side-nav { padding: 6px 8px 24px; }
.side-nav .grp { font-size: .875rem; color: var(--side-soft); font-weight: 700; margin: 14px 8px 2px; letter-spacing: .04em; }
.side-nav .band { font-size: .875rem; color: var(--side-soft); margin: 6px 10px 0; }
.side-nav a { display: flex; gap: 8px; align-items: baseline; padding: 7px 10px; border-radius: 6px; color: var(--side-ink); text-decoration: none; font-size: 1rem; line-height: 1.4; }
.side-nav a:visited { color: var(--side-ink); }
.side-nav a:hover { background: rgba(255,255,255,.1); }
.side-nav a[aria-current="page"] { background: var(--teal); color: #ffffff; font-weight: 700; }
.side-nav .no { min-width: 1.4em; font-variant-numeric: tabular-nums; }
.side-nav .cnt { margin-left: auto; font-size: .875rem; }
.main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 20px; background: var(--paper); border-bottom: 1px solid var(--line); }
.menu-btn { display: none; min-height: 44px; padding: 6px 14px; background: var(--paper); border: 1px solid var(--ink-faint); border-radius: 6px; cursor: pointer; }
.crumb { flex: 1 1 200px; min-width: 0; font-weight: 700; color: var(--teal-d); }
.crumb a { color: var(--teal-d); }
.search { flex: 0 1 420px; min-width: 220px; display: flex; }
.search input { width: 100%; min-height: 44px; padding: 8px 12px; background: var(--paper); border: 1px solid var(--ink-faint); border-radius: 6px; }
.search input::placeholder { color: var(--ink-soft); }
main { flex: 1; width: 100%; max-width: 1200px; padding: 20px 24px 56px; display: grid; gap: 28px; align-content: start; }
main > * { min-width: 0; }
.foot { max-width: 1200px; padding: 16px 24px 32px; font-size: .875rem; color: var(--ink-soft); border-top: 1px solid var(--line); }
@media (max-width: 860px) {
  .menu-btn { display: inline-block; }
  .side { position: fixed; z-index: 40; left: 0; top: 0; transform: translateX(-100%); transition: transform .15s ease; box-shadow: 2px 0 14px rgba(0,0,0,.25); }
  .side:not(.open) { visibility: hidden; }
  .side.open { transform: none; }
  .top { padding: 8px 16px; }
  .search { flex: 1 1 100%; min-width: 0; }
  main { padding: 16px 16px 48px; }
  .foot { padding: 16px; }
}
@media (prefers-reduced-motion: reduce) { .side { transition: none; } }

/* ===== 共通の部品 ===== */
.eyebrow { font-size: .875rem; color: var(--ink-soft); font-weight: 700; letter-spacing: .04em; }
.lead { font-size: 1.125rem; max-width: 46em; }
.muted { color: var(--ink-soft); }
.small { font-size: .875rem; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; }
.sec { display: grid; gap: 12px; scroll-margin-top: 76px; }
.sec-h { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 1.25rem; color: var(--teal-d); padding-top: 14px; border-top: 1px solid var(--line); }
.sec-h .marks { margin-left: auto; }
h3.sub-h { font-size: 1.0625rem; color: var(--ink); }
.para { max-width: 46em; }
.bul { display: grid; gap: 6px; max-width: 48em; padding-left: 1.4em; }
ol.bul { list-style: decimal; }
ul.bul { list-style: disc; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 6px 16px; background: var(--paper); border: 1px solid var(--ink); border-radius: 6px; color: var(--ink); text-decoration: none; cursor: pointer; line-height: 1.4; }
.btn:visited { color: var(--ink); }
.btn:hover { background: var(--panel); }
.btn.solid { background: var(--teal); border-color: var(--teal); color: #ffffff; }
.btn.solid:visited { color: #ffffff; }
.btn.solid:hover { background: var(--teal-d); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px; padding: 10px 18px; background: var(--ink); color: #ffffff; border-radius: 6px; z-index: 60; }

/* 札（状態は必ず文字で出す。色は補助） */
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border: 1px solid var(--ink-faint); border-radius: 4px; font-size: .875rem; line-height: 1.6; white-space: nowrap; background: var(--paper); color: var(--ink-soft); font-weight: 700; }
.tag.st-verified { background: var(--teal-wash); border-color: var(--teal); color: var(--teal-d); }
.tag.st-confirmed { background: var(--ok-wash); border-color: var(--ok-line); color: var(--ok-ink); }
.tag.st-draft { background: var(--draft-wash); border-color: var(--draft-line); color: var(--draft-ink); }
.tag.st-none { border-style: dashed; color: var(--ink-soft); }
.tag.todo { background: var(--draft-wash); border-color: var(--draft-line); color: var(--draft-ink); }
.tag.need { background: var(--warn-wash); border-color: var(--warn-line); color: var(--warn-ink); }
.tag.now { background: var(--ink); border-color: var(--ink); color: #ffffff; }
.tag.basis { font-weight: 400; color: var(--ink-soft); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

/* 表 */
.tbl-wrap { position: relative; overflow-x: auto; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-size: 1rem; line-height: 1.6; }
th, td { padding: 8px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
thead th { font-size: .875rem; font-weight: 700; color: var(--ink-soft); background: var(--panel); white-space: nowrap; }
tbody th { font-weight: 700; }
tr:last-child > td, tr:last-child > th { border-bottom: 0; }
tr.is-now > * { background: #fff8db; }
td.when { white-space: nowrap; }
td.src, th.src { font-size: .875rem; }

/* 学習の印（統合アプリのマイノートと同じ4種） */
.marks { display: flex; flex-wrap: wrap; gap: 4px; }
.mk { min-height: 32px; padding: 2px 10px; font-size: .875rem; line-height: 1.5; background: var(--paper); border: 1px solid var(--ink-faint); border-radius: 999px; color: var(--ink-soft); cursor: pointer; }
.mk:hover { border-color: var(--ink); }
.mk[aria-pressed="true"] { font-weight: 700; color: var(--ink); }
.mk.imp[aria-pressed="true"] { background: #fff3cd; border-color: #8a6a12; color: #5c4400; }
.mk.save[aria-pressed="true"] { background: #e3f0ff; border-color: #2f6db5; color: #183f6e; }
.mk.weak[aria-pressed="true"] { background: #fde8e8; border-color: #b8452f; color: #8a1f1f; }
.mk.done[aria-pressed="true"] { background: var(--ok-wash); border-color: var(--ok-line); color: var(--ok-ink); }

/* ===== 表紙 ===== */
.cover-head { display: grid; gap: 10px; }
.cover-head h1 { font-size: 1.75rem; }
.now-box { display: grid; gap: 6px; padding: 12px 16px; background: var(--paper); border: 1px solid var(--line); border-left: 4px solid var(--teal); border-radius: 6px; }
.now-box p { max-width: none; }
.map { display: grid; gap: 14px; }
.band { display: grid; gap: 8px; }
.band-h { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.band-h b { font-size: 1.0625rem; }
.band-h span { color: var(--ink-soft); font-size: .875rem; }
.tiles { display: grid; gap: 10px; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); }
@media (max-width: 720px) { .tiles { grid-template-columns: minmax(0, 1fr); } }
.tile { display: grid; gap: 6px; align-content: start; padding: 14px 16px; background: var(--paper); border: 1px solid var(--ink-faint); border-top: 5px solid var(--teal); border-radius: 8px; color: var(--ink); text-decoration: none; }
.tile:visited { color: var(--ink); }
.tile:hover { border-color: var(--ink); border-top-color: var(--teal-d); }
.band.dodai .tile { border-top-color: var(--teal-d); }
.band.korekara .tile { border-top-color: #5b7fb5; }
.tile .t-no { font-size: .875rem; font-weight: 700; color: var(--ink-soft); }
.tile .t-name { font-size: 1.125rem; font-weight: 700; color: var(--teal-d); line-height: 1.4; }
.tile .t-sum { font-size: 1rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.tile .t-seen { font-size: .875rem; color: var(--ink-soft); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: .875rem; color: var(--ink-soft); }
.legend > span { display: inline-flex; gap: 6px; align-items: center; }

/* ===== 棚ページ ===== */
.shelf-head { display: grid; gap: 6px; }
.shelf-head h1 { font-size: 1.625rem; color: var(--ink); display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.shelf-head h1 .eyebrow { font-size: .9375rem; }
.shelf-head .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.top-half { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 12px 24px; align-items: start; }
.top-half > .wide { grid-column: 1 / -1; }
@media (max-width: 900px) { .top-half { grid-template-columns: minmax(0, 1fr); } }
.top-half .sec-h { border-top: 0; padding-top: 0; font-size: 1.125rem; }
.summary { font-size: 1.0625rem; line-height: 1.7; background: var(--teal-wash); border-radius: 6px; padding: 10px 14px; }
.fig-none { display: grid; gap: 4px; padding: 10px 14px; border: 2px dashed var(--ink-faint); border-radius: 6px; background: var(--paper); }
.fig-none .plan { font-size: .875rem; color: var(--ink-soft); }
.num-tbl td, .num-tbl th { padding: 6px 10px; }
.num-tbl th:nth-child(1), .num-tbl td:nth-child(1) { width: 11em; }
.num-tbl th.src, .num-tbl td.src { width: 15em; }
.num-tbl td { font-size: .9375rem; }
.num-tbl td.src { font-size: .875rem; }
.num-in { width: 9em; max-width: 100%; min-height: 34px; margin: 1px 2px; vertical-align: middle; padding: 4px 8px; background: var(--paper); border: 1px solid var(--ink-faint); border-radius: 4px; font-size: .9375rem; }
.num-in:placeholder-shown { background: #fffdf5; border-style: dashed; }
.num-in::placeholder { color: var(--draft-ink); }
.status-note { font-size: .875rem; color: var(--ink-soft); }
details.more > summary { cursor: pointer; color: var(--link); }
details.more[open] { flex-basis: 100%; }
.myth { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; list-style: none; }
.myth li { display: grid; gap: 2px; padding: 10px 14px; background: var(--paper); }
.myth .m { color: var(--ink-soft); }
.myth .f::before { content: "→ "; }

/* 自分の現場（3欄） */
.checks { display: grid; gap: 12px; }
.check { display: grid; gap: 8px; padding: 12px 14px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; }
.check .what { font-weight: 700; }
.check .where { font-size: .875rem; color: var(--ink-soft); }
.sites { display: grid; gap: 10px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 900px) { .sites { grid-template-columns: minmax(0, 1fr); } }
.site { display: grid; gap: 4px; }
.site label { font-size: .875rem; font-weight: 700; }
.site textarea { width: 100%; min-height: 64px; padding: 8px 10px; background: var(--paper); border: 1px solid var(--ink-faint); border-radius: 4px; line-height: 1.6; resize: vertical; }
.site .saved { font-size: .875rem; color: var(--ink-soft); min-height: 1.5em; }

/* 降り先 */
.downs { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.down { display: grid; gap: 2px; align-content: start; padding: 10px 14px; background: var(--paper); border: 1px solid var(--ink-faint); border-radius: 6px; text-decoration: none; color: var(--ink); }
.down:visited { color: var(--ink); }
a.down:hover { border-color: var(--ink); }
.down .k { font-size: .875rem; color: var(--ink-soft); }
.down b { color: var(--link); }
a.down:visited b { color: var(--visited); }
.down.none { border-style: dashed; }
.down.none b { color: var(--ink-soft); }
.pager { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; padding-top: 18px; border-top: 1px solid var(--line); }

/* ===== 単元（共通学習ツールWeb版の表示を再利用） ===== */
.unit { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 1000px) { .unit { grid-template-columns: minmax(0, 1fr); gap: 12px; } }
.index { position: sticky; top: 76px; display: grid; gap: 1px; font-size: .875rem; line-height: 1.45; }
.index a { display: block; padding: 6px 8px; color: var(--ink-soft); text-decoration: none; border-left: 3px solid var(--line); }
.index a:visited { color: var(--ink-soft); }
.index a:hover { color: var(--ink); border-left-color: var(--ink); }
@media (max-width: 1000px) {
  .index { position: static; display: flex; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
  .index a { flex: none; border: 1px solid var(--ink-faint); border-radius: 4px; background: var(--paper); white-space: nowrap; }
}
.unit-head { display: grid; gap: 8px; margin-bottom: 4px; }
.unit-head h1 { font-size: 1.625rem; }
.sheet { display: grid; }
.item { padding-block: 18px; border-top: 1px solid var(--line); display: grid; gap: 12px; scroll-margin-top: 76px; }
.item > * { min-width: 0; }
.item-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; font-size: 1.125rem; }
.item-h .no { font-weight: 400; color: var(--ink-soft); font-variant-numeric: tabular-nums; min-width: 1.4em; }
.item-h .marks { margin-left: auto; }
.u-summary { font-size: 1.0625rem; line-height: 1.75; max-width: 40em; }
.flows { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.flow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr) minmax(0, 1fr); gap: 8px; align-items: center; padding: 10px 12px; background: var(--paper); }
.node { font-weight: 700; line-height: 1.4; }
.edge { position: relative; display: grid; justify-items: center; padding-bottom: 8px; color: var(--teal-d); line-height: 1.4; text-align: center; }
.edge::after { content: ""; position: absolute; left: 0; right: 6px; bottom: 2px; height: 2px; background: var(--teal); }
.edge::before { content: ""; position: absolute; right: 0; bottom: -2px; border-left: 8px solid var(--teal); border-block: 5px solid transparent; }
.flow .note { grid-column: 1 / -1; font-size: .875rem; color: var(--ink-soft); line-height: 1.6; }
.state { display: flex; align-items: center; gap: 8px; font-size: .9375rem; background: var(--draft-wash); color: var(--draft-ink); padding: 8px 12px; border-radius: 4px; border: 1px solid var(--draft-line); }
.state.done { background: var(--ok-wash); color: var(--ok-ink); border-color: var(--ok-line); }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
@media (max-width: 760px) { .three { grid-template-columns: minmax(0, 1fr); } }
.three > div { padding: 12px 14px; background: var(--paper); display: grid; gap: 4px; align-content: start; }
.u-checks { display: grid; gap: 10px; }
.u-check { display: grid; gap: 6px; padding: 12px 14px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; }
.u-check label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.u-check input[type="checkbox"] { width: 1.25em; height: 1.25em; margin-top: .25em; flex: none; accent-color: var(--teal); }
.u-check .where { font-size: .875rem; color: var(--ink-soft); padding-left: 2.1em; }
.u-check textarea { width: 100%; min-height: 44px; padding: 8px 10px; background: var(--paper); border: 1px solid var(--ink-faint); border-radius: 4px; }
details.qa { background: var(--paper); border: 1px solid var(--ink-faint); }
details.qa + details.qa { border-top: 0; }
details.qa > summary { padding: 10px 14px; cursor: pointer; min-height: 44px; }
details.qa > div { padding: 0 14px 14px; display: grid; gap: 10px; }

/* 一覧・検索 */
.hits { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.hit { display: grid; gap: 2px; padding: 10px 14px; background: var(--paper); text-decoration: none; color: var(--ink); }
.hit:visited { color: var(--ink); }
.hit:hover { background: var(--panel); }
.hit b { color: var(--link); }
.hit small { font-size: .875rem; color: var(--ink-soft); }
mark { background: #fff0a8; color: inherit; padding-inline: 1px; }
/* 検索で飛んだ行：当たった言葉に印、行を2秒ほど光らせる（動きを減らす設定では光らせず淡い地だけ） */
mark.found { outline: 2px solid var(--draft-line); outline-offset: 0; border-radius: 2px; }
.flash { animation: flash 2.4s ease-out; }
tr.flash > * { animation: flash 2.4s ease-out; }
@keyframes flash { from { background-color: #fff0a8; } to { background-color: transparent; } }
@media (prefers-reduced-motion: reduce) { .flash, tr.flash > * { animation: none; background-color: #fff8db; } }
.cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.cardlink { display: grid; gap: 4px; padding: 14px; background: var(--paper); border: 1px solid var(--ink-faint); border-radius: 6px; text-decoration: none; color: var(--ink); }
.cardlink:visited { color: var(--ink); }
.cardlink:hover { border-color: var(--ink); }

例や規則の公開集）に載らないことがあり、担当課に聞くまで見えない場合があります。","小さな町では1人が複数の事業を持ち、議会前は答弁準備で手が止まりがちです。","専決処分は議会に理由を問われるので多用しにくいです。","組合の事務は町の担当が薄く、町の議会の議論も届きにくいです。"]},"perspectives":{"status":{"state":"仮"},"medical":"急ぐ話ほど、誰に言えば決まるのか見えないと感じます。課長の了解後も、予算と議会で数か月待つことに戸惑います。","admin":"所管と根拠が決まらないと、予算も議会説明も作れません。説明できる前例と公平性がなければ進めにくいと考えます。","welfare":"介護、障害、生活困窮で担当が分かれ、一人の相談が複数の課にまたがります。県や組合が絡むと、町の窓口では答えが出ないと感じます。"},"misconceptions":[{"myth":"「町長が決めれば何でも通る」","fact":"予算や条例には議決が要ります。専決処分には法の要件があります。"},{"myth":"「県は町の上の組織だ」","fact":"県と町は別の団体です。県の関与には法律か政令の根拠が要ります。"},{"myth":"「要綱に書いてあるから変えられない」","fact":"町の要綱は内部の基準で議決なしに改められます。国や県の補助要綱は町では変えられません。"}],"terms":[{"medical":"担当課","admin":"所管課、主管課","meaning":"その事務を受け持つ課"},{"medical":"町のきまり","admin":"条例","meaning":"議会が議決する。義務を課せる"},{"medical":"町長のきまり","admin":"規則","meaning":"首長が定める。議決は不要"},{"medical":"内規","admin":"要綱","meaning":"役所内部の基準"},{"medical":"町長の一存","admin":"専決処分","meaning":"議会に代わり首長が処分すること"},{"medical":"組合、広域","admin":"一部事務組合、広域連合","meaning":"市町村が共同で作る別の団体"}],"sources":[{"text":"法令：地方自治法第14条、第102条、第102条の2、第158条、第179条、第180条、第245条の2、第284条、地方公営企業法第8条"},{"text":"e-Gov法令検索「地方自治法」","url":"https://laws.e-gov.go.jp/law/322AC0000000067"},{"text":"総務省「地方議会の運営の実態」","url":"https://www.soumu.go.jp/main_content/001096741.pdf"},{"text":"総務省「地方議会の会期のあり方の見直し」","url":"https://www.soumu.go.jp/main_content/000989201.pdf"},{"text":"総務省「事務の共同処理の状況調」","url":"https://www.soumu.go.jp/main_content/000934369.pdf"},{"text":"総務省「地方自治法の一部を改正する法律の概要」","url":"https://www.soumu.go.jp/main_content/000955133.pdf"}],"local_checks":[{"what":"課の一覧と分担","where":"組織図と例規集の事務分掌"},{"what":"病院の所管課と管理者の有無","where":"病院の設置条例と組織図、事務長"},{"what":"定例会の月と回数、通年の会期か","where":"議会事務局と回数を定める条例"}],"self_check":[{"question":"定例会の回数はどこで決まりますか？","answer":"各自治体の条例です。"},{"question":"住民に義務を課す決まりを要綱で作れますか？","answer":"作れません。原則として条例が要ります。"},{"question":"定例会を待てない案件の手段は？","answer":"臨時会か、要件を満たせば専決処分です。"}]},"record":{"version":"v0","baseline":"2026年11月3日","generated":"設計書のP1で下書き（一次資料を確認）","reviewed":"独立レビュー1回を反映（2026年11月3日）。現場の確認は未了","unverified":"定例会が3・6・9・12月に開かれる全国の割合、要綱の公開状況の全国の実態、地方自治月報の第61号より新しい号の団体数"},"md":"# 単元1 自治体の構造\n\n## 1 一言で\n\n住民が別々に選ぶ首長（市町村長）と議会がけん制し合い、予算と条例は議決で決まり、実務は課ごとに条例・規則・要綱で動きます。県とは上下でなく役割分担で、一部の事務は組合が担います（2026年11月時点）。\n\n## 2 仕組みの図\n\n| 誰が | 誰へ | 何を | 補足 |\n| --- | --- | --- | --- |\n| 住民 | 首長・議員 | 別々に選ぶ | 二元代表制。任期4年 |\n| 首長 | 議会 | 議案を出す | 予算案は首長だけ |\n| 議会 | 首長 | 議決・検査 | 条例、予算、決算など（地方自治法第96条） |\n| 首長 | 各課 | 事務を分ける | 直下の組織は条例で定める |\n| 首長 | 住民 | 規則を定める | 議決は不要 |\n| 各課 | 関係者 | 要綱で基準を示す | 内部の基準で法的拘束力なし |\n| 首長 | 直営の病院 | 予算・議案・決算を担う | 管理者がいても同じ（地方公営企業法第8条） |\n| 市町村 | 組合・広域連合 | 事務を共同で処理 | 別の団体で議会も別 |\n| 県 | 市町村 | 広域の事務と連絡調整 | 関与には法律か政令の根拠が要る |\n\n福祉事務所は市が必置で町村は任意、保健所は県や中核市などが置き町村は置きません（単元4、5で扱う）。\n\n一部事務組合は1,392件、広域連合は117件で、うち47件が後期高齢者医療です（総務省、2023年7月1日現在）。\n\n## 3 時間軸\n\n| 時期 | 起きること | 区分 |\n| --- | --- | --- |\n| 毎年 | 定例会を首長が招集 | 制度上は回数を条例で定める |\n| 3・6・9・12月 | 定例会 | 多くの自治体では年4回 |\n| 開会の3日前（町村）、7日前（県・市）まで | 招集の告示 | 制度上は緊急時を除く |\n| 年度開始前 | 当初予算の議決。提出は20日前（町村・一般の市）、30日前（県・指定都市）まで | 制度上は |\n| 随時 | 議長か定数の4分の1以上の議員の請求で、首長は20日以内に臨時会を招集 | 制度上は |\n| 緊急時 | 専決処分（議決すべきことを首長が処分）。次の会議で報告し承認を求める | 制度上は招集の時間がないときなど。軽易な事項は議会の指定で可 |\n\n定例会の回数は2004年の法改正で上限がなくなりました。通年の会期（第102条の2）は1県14市29町村、定例会年1回は2県41市区36町村です（2023年4月1日現在）。臨時会の平均は町村2.8回、5万人未満の市1.9回で、年間の会期は43.6日と85.9日です（総務省資料、2025年の調査）。\n\n最近の改正：非常時に国が補充的に指示できる特例が2024年9月26日に始まりました。第34次地方制度調査会が議会の在り方を審議中です（2026年5月の資料）。\n\n## 4 現場の実情と限界\n\n状態：仮（現場の確認前）\n\n- 課を越える案件は主担当を決める協議で止まりやすいです。法は一体の行政を求めますが（第138条の3）、首長まで上げるのは手間です。\n- 要綱は例規集（条例や規則の公開集）に載らないことがあり、担当課に聞くまで見えない場合があります。\n- 小さな町では1人が複数の事業を持ち、議会前は答弁準備で手が止まりがちです。\n- 専決処分は議会に理由を問われるので多用しにくいです。\n- 組合の事務は町の担当が薄く、町の議会の議論も届きにくいです。\n\n## 5 立場で見え方が違うところ\n\n状態：仮（現場の確認前）\n\n- **医療側**：急ぐ話ほど、誰に言えば決まるのか見えないと感じます。課長の了解後も、予算と議会で数か月待つことに戸惑います。\n- **行政側**：所管と根拠が決まらないと、予算も議会説明も作れません。説明できる前例と公平性がなければ進めにくいと考えます。\n- **福祉側**：介護、障害、生活困窮で担当が分かれ、一人の相談が複数の課にまたがります。県や組合が絡むと、町の窓口では答えが出ないと感じます。\n\n## 6 よくある誤解\n\n1. 「町長が決めれば何でも通る」→予算や条例には議決が要ります。専決処分には法の要件があります。\n2. 「県は町の上の組織だ」→県と町は別の団体です。県の関与には法律か政令の根拠が要ります。\n3. 「要綱に書いてあるから変えられない」→町の要綱は内部の基準で議決なしに改められます。国や県の補助要綱は町では変えられません。\n\n## 7 用語\n\n| 医療側の言い方 | 行政側の言い方 | 意味 |\n| --- | --- | --- |\n| 担当課 | 所管課、主管課 | その事務を受け持つ課 |\n| 町のきまり | 条例 | 議会が議決する。義務を課せる |\n| 町長のきまり | 規則 | 首長が定める。議決は不要 |\n| 内規 | 要綱 | 役所内部の基準 |\n| 町長の一存 | 専決処分 | 議会に代わり首長が処分すること |\n| 組合、広域 | 一部事務組合、広域連合 | 市町村が共同で作る別の団体 |\n\n## 8 深掘りの一次資料\n\n- 法令：地方自治法第14条、第102条、第102条の2、第158条、第179条、第180条、第245条の2、第284条、地方公営企業法第8条\n- [e-Gov法令検索「地方自治法」](https://laws.e-gov.go.jp/law/322AC0000000067)\n- [総務省「地方議会の運営の実態」](https://www.soumu.go.jp/main_content/001096741.pdf)\n- [総務省「地方議会の会期のあり方の見直し」](https://www.soumu.go.jp/main_content/000989201.pdf)\n- [総務省「事務の共同処理の状況調」](https://www.soumu.go.jp/main_content/000934369.pdf)\n- [総務省「地方自治法の一部を改正する法律の概要」](https://www.soumu.go.jp/main_content/000955133.pdf)\n\n## 9 自分の町で確認すること\n\n1. 課の一覧と分担：組織図と例規集の事務分掌\n2. 病院の所管課と管理者の有無：病院の設置条例と組織図、事務長\n3. 定例会の月と回数、通年の会期か：議会事務局と回数を定める条例\n\n## 10 自己チェック\n\n1. 定例会の回数はどこで決まりますか？　→各自治体の条例です。\n2. 住民に義務を課す決まりを要綱で作れますか？　→作れません。原則として条例が要ります。\n3. 定例会を待てない案件の手段は？　→臨時会か、要件を満たせば専決処分です。\n\n## 版と生成の記録\n\n- 版：v0\n- 基準日：2026年11月3日\n- 生成：設計書のP1で下書き（一次資料を確認）\n- 点検：独立レビュー1回を反映（2026年11月3日）。現場の確認は未了\n- 未照合：定例会が3・6・9・12月に開かれる全国の割合、要綱の公開状況の全国の実態、地方自治月報の第61号より新しい号の団体数\n"},{"unit":2,"title":"お金の流れ","char_count":1920,"items":{"summary":{"text":"公立病院の収入の柱は診療報酬で、採算の取れない公的な役割の分を町の一般会計が「繰出」で負担します。国は繰出の一部を交付税の算定に入れて町を支えますが、交付税は使い道が自由で、病院に直接は届きません（2026年11月時点）。"},"mechanism":{"figure":"公立病院のお金の流れ · 制度上の骨格","flows":[{"who":"保険者・患者","to":"病院事業会計","what":"診療報酬","note":"収入の柱。単価は国が決める"},{"who":"国・県","to":"病院事業会計","what":"補助金","note":"使い道が決まっている"},{"who":"国","to":"町の一般会計","what":"交付税","note":"使途は自由"},{"who":"住民・事業所","to":"町の一般会計","what":"町税","note":"町全体の共通の財布に入る"},{"who":"住民","to":"国保・介護保険の会計","what":"保険料","note":"国・県・町の公費も入る。40〜64歳の介護分は医療保険を通る"},{"who":"町の一般会計","to":"病院事業会計","what":"繰出","note":"基準あり、額は予算で決まる"},{"who":"町の一般会計","to":"診療所の会計","what":"繰出","note":"多くの町で病院と別会計"}],"notes":["全国の公立病院の総収入（2025年度決算）は5兆9,159億円で、診療収入78.6%、一般会計繰入金12.7%、国庫補助金1.9%です（[総務省](https://www.soumu.go.jp/main_content/001097376.pdf)）。","制度上は、特別交付税の主な項目は、算定額の合算と繰出見込み額の合算×0.8の少ないほうで決まります（普通交付税分は別）。建物の借金は通常、元利償還金の1/2を町が繰り出し、その半分（全体の25%）が普通交付税の算定に入ります。特別分は2/3を繰り出し40%が算定に入り、過疎債は率が異なります（要確認）。図と表は主な流れだけで、診療所にも診療報酬が入り、企業債は病院会計の借入です。"]},"timeline":{"rows":[{"when":"6・9・12・3月","event":"補正予算で額が動く","basis":"多くの自治体では"},{"when":"8月末まで","event":"普通交付税の額が決まる","basis":"制度上は"},{"when":"9月頃","event":"前年度の決算を議会が認定する","basis":"多くの自治体では"},{"when":"秋","event":"各課が来年度の予算を要求する","basis":"多くの自治体では"},{"when":"12月・3月","event":"特別交付税が交付される","basis":"制度上は"},{"when":"冬","event":"財政担当の査定と町長の判断","basis":"多くの自治体では"},{"when":"3月","event":"議会が当初予算を議決する","basis":"制度上は年度開始前"}],"notes":["診療報酬の改定は慣例で2年ごと、介護報酬は通常3年ごと（2026年6月は期中改定）で、介護保険事業計画は法で3年ごとです。"]},"field_limits":{"status":{"state":"仮"},"points":["法は一定の経費を一般会計の負担とし、総務省の通知が基準を示します。額は町が予算に組み、議会が議決します。多くの自治体では、財政事情で基準どおりに出せるかが変わります。","秋の要求に間に合わない新規事業は、補正か翌年度を待ちます。","補助金は申請と報告の手間が大きく、少人数の事務では取りに行けないことがあります。","赤字の議論は決算や補正の時期に集中し、普段の現場には見えにくくなります。"]},"perspectives":{"status":{"state":"仮"},"medical":"繰出は救急やへき地を担う対価だと考えます。赤字の主因は報酬と人件費で、努力だけでは届かないと感じます。","admin":"交付税は町全体の財源で、病院に回せば他の事業が減ります。基準を超える分は議会と住民への説明が要ります。","welfare":"介護保険は別会計で、保険料と給付の均衡が先に立ちます。病院への繰出に比べ、地域の支え手に回るお金は見えにくいと感じます。"},"misconceptions":[{"myth":"「交付税は病院のために来る」","fact":"算定の根拠に入るだけで、使い道は町が決めます。"},{"myth":"「赤字は全額を町が埋める」","fact":"独立採算が原則です。基準を超える負担は、町の予算と議会の議決で決まります。"},{"myth":"「経常黒字なら健全」","fact":"経常収支には収益的収支への繰入が含まれます。他会計負担金を除く医業収益÷医業費用（修正医業収支比率）も併せて見ます。"}],"terms":[{"medical":"町からの補填","admin":"繰出金（病院側は繰入金。決算では他会計負担金・補助金）","meaning":"一般会計から病院の会計へ移すお金"},{"medical":"ルール分","admin":"繰出基準","meaning":"総務省が毎年度示す、一般会計が負担する経費の考え方"},{"medical":"国からのお金","admin":"普通交付税・特別交付税","meaning":"使い道が自由な町の財源"},{"medical":"補助金","admin":"国庫支出金・県支出金","meaning":"使い道が決まったお金"},{"medical":"建替えの借金","admin":"企業債","meaning":"病院の会計が返す長期の借入"},{"medical":"運営費／設備費","admin":"収益的収支／資本的収支","meaning":"毎年の運営と、建物・機器・返済の区分"}],"sources":[{"text":"法令：地方公営企業法第17条の2・第17条の3、同施行令第8条の5、地方交付税法"},{"text":"総務省「公立病院等に対する地方財政措置等について」（2026年10月16日）","url":"https://www.soumu.go.jp/main_content/001097376.pdf"},{"text":"総務副大臣通知「令和8年度の地方公営企業繰出金について」（総財公第18号、2026年4月1日）","url":"https://www.soumu.go.jp/main_content/001066445.pdf"},{"text":"自分の町の予算書、決算書、経営比較分析表"}],"local_checks":[{"what":"今年度の繰出額と区分","where":"病院事業会計の予算書と補正予算の「他会計負担金・補助金・出資金」"},{"what":"予算要求の締切","where":"財政担当か事務長に聞く"},{"what":"使える基金と残高","where":"決算書か財政状況資料集"}],"self_check":[{"question":"交付税の算定に病床数が入っていれば、その額は病院に渡りますか？","answer":"いいえ。使い道は町が決めます。"},{"question":"特別交付税の主な項目で、町が繰り出さないとどうなりますか？","answer":"措置は算定額の合算と繰出見込み額の合算×0.8の少ないほうなので、小さくなりえます。"},{"question":"経常収支比率が100%でも安心できないのはなぜですか？","answer":"収益的収支への繰入を含むからです。"}]},"record":{"version":"v0","baseline":"2026年11月3日","generated":"設計書のP1の旧版で下書きし、2026年11月3日に現行の型へ揃えた","reviewed":"独立点検1回と独立レビュー1回を反映（2026年11月3日）。現場の確認は未了","unverified":"過疎対策事業債の元利償還金の交付税算入率"},"md":"# 単元2 お金の流れ\n\n## 1 一言で\n\n公立病院の収入の柱は診療報酬で、採算の取れない公的な役割の分を町の一般会計が「繰出」で負担します。国は繰出の一部を交付税の算定に入れて町を支えますが、交付税は使い道が自由で、病院に直接は届きません（2026年11月時点）。\n\n## 2 仕組みの図\n\n&#91;embedded content: 公立病院のお金の流れ · 制度上の骨格\\]\n\n| 誰が | 誰へ | 何を | 補足 |\n| --- | --- | --- | --- |\n| 保険者・患者 | 病院事業会計 | 診療報酬 | 収入の柱。単価は国が決める |\n| 国・県 | 病院事業会計 | 補助金 | 使い道が決まっている |\n| 国 | 町の一般会計 | 交付税 | 使途は自由 |\n| 住民・事業所 | 町の一般会計 | 町税 | 町全体の共通の財布に入る |\n| 住民 | 国保・介護保険の会計 | 保険料 | 国・県・町の公費も入る。40〜64歳の介護分は医療保険を通る |\n| 町の一般会計 | 病院事業会計 | 繰出 | 基準あり、額は予算で決まる |\n| 町の一般会計 | 診療所の会計 | 繰出 | 多くの町で病院と別会計 |\n\n全国の公立病院の総収入（2025年度決算）は5兆9,159億円で、診療収入78.6%、一般会計繰入金12.7%、国庫補助金1.9%です（[総務省](https://www.soumu.go.jp/main_content/001097376.pdf)）。\n\n制度上は、特別交付税の主な項目は、算定額の合算と繰出見込み額の合算×0.8の少ないほうで決まります（普通交付税分は別）。建物の借金は通常、元利償還金の1/2を町が繰り出し、その半分（全体の25%）が普通交付税の算定に入ります。特別分は2/3を繰り出し40%が算定に入り、過疎債は率が異なります（要確認）。図と表は主な流れだけで、診療所にも診療報酬が入り、企業債は病院会計の借入です。\n\n## 3 時間軸\n\n| 時期 | 起きること | 区分 |\n| --- | --- | --- |\n| 6・9・12・3月 | 補正予算で額が動く | 多くの自治体では |\n| 8月末まで | 普通交付税の額が決まる | 制度上は |\n| 9月頃 | 前年度の決算を議会が認定する | 多くの自治体では |\n| 秋 | 各課が来年度の予算を要求する | 多くの自治体では |\n| 12月・3月 | 特別交付税が交付される | 制度上は |\n| 冬 | 財政担当の査定と町長の判断 | 多くの自治体では |\n| 3月 | 議会が当初予算を議決する | 制度上は年度開始前 |\n\n診療報酬の改定は慣例で2年ごと、介護報酬は通常3年ごと（2026年6月は期中改定）で、介護保険事業計画は法で3年ごとです。\n\n## 4 現場の実情と限界\n\n状態：仮（現場の確認前）\n\n- 法は一定の経費を一般会計の負担とし、総務省の通知が基準を示します。額は町が予算に組み、議会が議決します。多くの自治体では、財政事情で基準どおりに出せるかが変わります。\n- 秋の要求に間に合わない新規事業は、補正か翌年度を待ちます。\n- 補助金は申請と報告の手間が大きく、少人数の事務では取りに行けないことがあります。\n- 赤字の議論は決算や補正の時期に集中し、普段の現場には見えにくくなります。\n\n## 5 立場で見え方が違うところ\n\n状態：仮（現場の確認前）\n\n- **医療側**：繰出は救急やへき地を担う対価だと考えます。赤字の主因は報酬と人件費で、努力だけでは届かないと感じます。\n- **行政側**：交付税は町全体の財源で、病院に回せば他の事業が減ります。基準を超える分は議会と住民への説明が要ります。\n- **福祉側**：介護保険は別会計で、保険料と給付の均衡が先に立ちます。病院への繰出に比べ、地域の支え手に回るお金は見えにくいと感じます。\n\n## 6 よくある誤解\n\n1. 「交付税は病院のために来る」→算定の根拠に入るだけで、使い道は町が決めます。\n2. 「赤字は全額を町が埋める」→独立採算が原則です。基準を超える負担は、町の予算と議会の議決で決まります。\n3. 「経常黒字なら健全」→経常収支には収益的収支への繰入が含まれます。他会計負担金を除く医業収益÷医業費用（修正医業収支比率）も併せて見ます。\n\n## 7 用語\n\n| 医療側の言い方 | 行政側の言い方 | 意味 |\n| --- | --- | --- |\n| 町からの補填 | 繰出金（病院側は繰入金。決算では他会計負担金・補助金） | 一般会計から病院の会計へ移すお金 |\n| ルール分 | 繰出基準 | 総務省が毎年度示す、一般会計が負担する経費の考え方 |\n| 国からのお金 | 普通交付税・特別交付税 | 使い道が自由な町の財源 |\n| 補助金 | 国庫支出金・県支出金 | 使い道が決まったお金 |\n| 建替えの借金 | 企業債 | 病院の会計が返す長期の借入 |\n| 運営費／設備費 | 収益的収支／資本的収支 | 毎年の運営と、建物・機器・返済の区分 |\n\n## 8 深掘りの一次資料\n\n- 法令：地方公営企業法第17条の2・第17条の3、同施行令第8条の5、地方交付税法\n- [総務省「公立病院等に対する地方財政措置等について」（2026年10月16日）](https://www.soumu.go.jp/main_content/001097376.pdf)\n- [総務副大臣通知「令和8年度の地方公営企業繰出金について」（総財公第18号、2026年4月1日）](https://www.soumu.go.jp/main_content/001066445.pdf)\n- 自分の町の予算書、決算書、経営比較分析表\n\n## 9 自分の町で確認すること\n\n1. 今年度の繰出額と区分：病院事業会計の予算書と補正予算の「他会計負担金・補助金・出資金」\n2. 予算要求の締切：財政担当か事務長に聞く\n3. 使える基金と残高：決算書か財政状況資料集\n\n## 10 自己チェック\n\n1. 交付税の算定に病床数が入っていれば、その額は病院に渡りますか？　→いいえ。使い道は町が決めます。\n2. 特別交付税の主な項目で、町が繰り出さないとどうなりますか？　→措置は算定額の合算と繰出見込み額の合算×0.8の少ないほうなので、小さくなりえます。\n3. 経常収支比率が100%でも安心できないのはなぜですか？　→収益的収支への繰入を含むからです。\n\n## 版と生成の記録\n\n- 版：v0\n- 基準日：2026年11月3日\n- 生成：設計書のP1の旧版で下書きし、2026年11月3日に現行の型へ揃えた\n- 点検：独立点検1回と独立レビュー1回を反映（2026年11月3日）。現場の確認は未了\n- 未照合：過疎対策事業債の元利償還金の交付税算入率\n"},{"unit":3,"title":"医療の制度","char_count":1998,"items":{"summary":{"text":"国が診療報酬（医療の公定価格）を決め、県が医療計画を作り、市町村が国民健康保険（国保）の実務を担い、一部の市町村は公立病院も持ちます。決める人と周期が別なので、三者の時間軸がずれます（2026年11月時点）。"},"mechanism":{"figure":null,"flows":[{"who":"国","to":"医療機関","what":"診療報酬を定める","note":"中央社会保険医療協議会に諮問。財源は保険料・公費・患者負担"},{"who":"県","to":"医療機関・市町村","what":"医療計画、地域医療構想（将来の体制の構想）、医師確保計画を作る","note":"市町村の意見を聴く。事業費の一部は基金（国2/3、県1/3）"},{"who":"県","to":"医療関係者・保険者","what":"調整会議（区域ごとの協議の場）を設ける","note":"2025年3月末の市町村参加は330区域中、医療担当259、介護担当139。単元11で扱う"},{"who":"県","to":"病院を開く者","what":"病床の増加を抑える","note":"基準病床数を超える地域で公立病院は不許可、民間へは勧告（2027年4月に規定追加）"},{"who":"県","to":"市町村","what":"国保の納付金（県へ納めるお金）を決める","note":"2018年度から財政運営の責任主体"},{"who":"市町村","to":"住民","what":"国保の資格管理、保険料の決定と徴収","note":"保険税の町もある"},{"who":"病院を持つ市町村","to":"病院・住民","what":"経営強化プランを作り点検する","note":"指針は総務省。経常収支比率と修正医業収支比率に必ず目標。繰出は単元2"},{"who":"国・県","to":"へき地の病院・診療所","what":"補助、医師派遣の調整","note":"2024年4月で拠点病院358、診療所1,120"}],"notes":["公立病院は全国841で、271は人口3万人未満の市町村にあり、経常赤字は683（81.2%）です（2025年度決算）。"]},"timeline":{"rows":[{"when":"2024〜2029年度","event":"第8次医療計画。次は2030年度からの見込み","basis":"制度上は"},{"when":"2026年6月","event":"診療報酬改定を施行。本体は2年度平均+3.09%（2026年度+2.41%、2027年度+3.77%）","basis":"制度上は"},{"when":"2026年度","event":"県が医師確保計画の後期（2027〜29年度）を作る","basis":"制度上は"},{"when":"2027年4月","event":"新たな地域医療構想の規定を施行","basis":"制度上は"},{"when":"2027年度まで","event":"経営強化プランの標準の期間。次は総務省で検討中","basis":"制度上は標準"},{"when":"2028年度まで","event":"県が新たな構想を作り、各病院は担う機能を決める","basis":"制度上は"},{"when":"毎年度","event":"県が納付金、市町村が保険料率を決める","basis":"制度上は（月は要確認）"}],"notes":["周期は、報酬が通常2年（次は2028年度）、医療計画が6年（一部3年）、町の予算は1年です。"]},"field_limits":{"status":{"state":"仮"},"points":["2026年度の報酬改定は2月答申、6月施行でした。多くの自治体では予算要求が前年の秋で、当初予算に入れにくくなります。","多くの自治体では、調整会議の議題は県が用意し、報告で終わることがあります。町の出席者が定まらないこともあります。","被保険者3,000人未満の国保は3割強で、担当が少人数の町もあります（厚労省、2025年11月）。","議会は病院を毎年の予算で問うので、県の6年計画は議題に上りにくいことがあります。"]},"perspectives":{"status":{"state":"仮"},"medical":"報酬の単価も病床の枠も外で決まり、自院では変えられないと感じます。医師確保は県や大学の動き次第に見えます。","admin":"病院は町の財政と議会の問題で、医療計画は県の仕事に見えます。国保の保険料の説明と徴収は町に残ると感じます。","welfare":"構想は病床の話に見え、退院後の受け皿の議論に呼ばれにくいと感じます。新たな構想には介護連携が入るので、出席者を気にします。"},"misconceptions":[{"myth":"「県の計画は町に関係ない」","fact":"県は市町村の意見を聴いて作ります。2027年4月から協議の場の関係者にも加わります。"},{"myth":"「国保は県に移った」","fact":"県は財政運営を担い、資格管理と保険料の決定・徴収は市町村です。"},{"myth":"「地域医療構想は病床の話だけ」","fact":"2025年の法改正で、外来・在宅と介護連携も含む構想に変わります。"}],"terms":[{"medical":"点数","admin":"診療報酬","meaning":"国が定める医療の価格"},{"medical":"医療圏","admin":"二次医療圏（法律では「区域」）","meaning":"入院医療をまとめて考える単位"},{"medical":"調整会議","admin":"協議の場","meaning":"県が区域ごとに設ける話し合い"},{"medical":"プラン","admin":"公立病院経営強化プラン","meaning":"公立病院の経営計画"},{"medical":"医師の少ない地域","admin":"医師少数区域・医師少数スポット","meaning":"県が定める地域。スポットは原則市区町村"}],"sources":[{"text":"法令：医療法第30条の4・第30条の11・第30条の14、国民健康保険法第4条・第82条の2、健康保険法第76条"},{"text":"厚労省「医療計画について」（2026年9月改正）","url":"https://www.mhlw.go.jp/content/001751758.pdf"},{"text":"厚労省「新たな地域医療構想に関するとりまとめ」（2026年3月）","url":"https://www.mhlw.go.jp/content/10800000/001676424.pdf"},{"text":"厚労省 改正医療法の公布通知（2025年12月）","url":"https://www.mhlw.go.jp/content/10800000/001613646.pdf"},{"text":"厚労省 医師確保計画策定ガイドライン（第8次後期）","url":"https://www.mhlw.go.jp/content/001718579.pdf"},{"text":"厚労省 令和8年度診療報酬改定","url":"https://www.mhlw.go.jp/stf/newpage_67729.html"},{"text":"総務省 公立病院経営強化ガイドライン","url":"https://www.soumu.go.jp/main_content/000803322.pdf"},{"text":"総務省 公立病院経営強化の検討会（2026年）","url":"https://www.soumu.go.jp/main_sosiki/kenkyu/jizoku_iryo_r08/index.html"}],"local_checks":[{"what":"町が入る二次医療圏と構想区域","where":"県の医療計画"},{"what":"調整会議の構成と町の出席者","where":"県の担当課か保健所、公表名簿"},{"what":"自院のプランの期間と数値目標","where":"プラン本文と毎年の点検結果"}],"self_check":[{"question":"調整会議を設けるのは誰ですか？","answer":"県です。市町村は2027年4月から法律上の関係者です。"},{"question":"国保の保険料率を決めるのは誰ですか？","answer":"市町村です。県は納付金を決めます。"},{"question":"プランで必ず目標を置く指標は何ですか？","answer":"経常収支比率と修正医業収支比率です。"}]},"record":{"version":"v0","baseline":"2026年11月3日","generated":"設計書のP1で下書き（一次資料を確認）","reviewed":"独立レビュー1回を反映（2026年11月3日）。現場の確認は未了","unverified":"診療報酬の改定が「通常2年」であること（2026・2027年度の平均と2028年度改定への言及までは確認）、納付金と保険料率を決める月、2026年7月の地域医療構想策定ガイドライン本文、2027年4月施行の増床の規定（基準病床数未満でも必要量を超える増床を不許可にできる。規制の事前評価書で確認）の本文への影響"},"md":"# 単元3 医療の制度\n\n## 1 一言で\n\n国が診療報酬（医療の公定価格）を決め、県が医療計画を作り、市町村が国民健康保険（国保）の実務を担い、一部の市町村は公立病院も持ちます。決める人と周期が別なので、三者の時間軸がずれます（2026年11月時点）。\n\n## 2 仕組みの図\n\n| 誰が | 誰へ | 何を | 補足 |\n| --- | --- | --- | --- |\n| 国 | 医療機関 | 診療報酬を定める | 中央社会保険医療協議会に諮問。財源は保険料・公費・患者負担 |\n| 県 | 医療機関・市町村 | 医療計画、地域医療構想（将来の体制の構想）、医師確保計画を作る | 市町村の意見を聴く。事業費の一部は基金（国2/3、県1/3） |\n| 県 | 医療関係者・保険者 | 調整会議（区域ごとの協議の場）を設ける | 2025年3月末の市町村参加は330区域中、医療担当259、介護担当139。単元11で扱う |\n| 県 | 病院を開く者 | 病床の増加を抑える | 基準病床数を超える地域で公立病院は不許可、民間へは勧告（2027年4月に規定追加） |\n| 県 | 市町村 | 国保の納付金（県へ納めるお金）を決める | 2018年度から財政運営の責任主体 |\n| 市町村 | 住民 | 国保の資格管理、保険料の決定と徴収 | 保険税の町もある |\n| 病院を持つ市町村 | 病院・住民 | 経営強化プランを作り点検する | 指針は総務省。経常収支比率と修正医業収支比率に必ず目標。繰出は単元2 |\n| 国・県 | へき地の病院・診療所 | 補助、医師派遣の調整 | 2024年4月で拠点病院358、診療所1,120 |\n\n公立病院は全国841で、271は人口3万人未満の市町村にあり、経常赤字は683（81.2%）です（2025年度決算）。\n\n## 3 時間軸\n\n| 時期 | 起きること | 区分 |\n| --- | --- | --- |\n| 2024〜2029年度 | 第8次医療計画。次は2030年度からの見込み | 制度上は |\n| 2026年6月 | 診療報酬改定を施行。本体は2年度平均+3.09%（2026年度+2.41%、2027年度+3.77%） | 制度上は |\n| 2026年度 | 県が医師確保計画の後期（2027〜29年度）を作る | 制度上は |\n| 2027年4月 | 新たな地域医療構想の規定を施行 | 制度上は |\n| 2027年度まで | 経営強化プランの標準の期間。次は総務省で検討中 | 制度上は標準 |\n| 2028年度まで | 県が新たな構想を作り、各病院は担う機能を決める | 制度上は |\n| 毎年度 | 県が納付金、市町村が保険料率を決める | 制度上は（月は要確認） |\n\n周期は、報酬が通常2年（次は2028年度）、医療計画が6年（一部3年）、町の予算は1年です。\n\n## 4 現場の実情と限界\n\n状態：仮（現場の確認前）\n\n- 2026年度の報酬改定は2月答申、6月施行でした。多くの自治体では予算要求が前年の秋で、当初予算に入れにくくなります。\n- 多くの自治体では、調整会議の議題は県が用意し、報告で終わることがあります。町の出席者が定まらないこともあります。\n- 被保険者3,000人未満の国保は3割強で、担当が少人数の町もあります（厚労省、2025年11月）。\n- 議会は病院を毎年の予算で問うので、県の6年計画は議題に上りにくいことがあります。\n\n## 5 立場で見え方が違うところ\n\n状態：仮（現場の確認前）\n\n- **医療側**：報酬の単価も病床の枠も外で決まり、自院では変えられないと感じます。医師確保は県や大学の動き次第に見えます。\n- **行政側**：病院は町の財政と議会の問題で、医療計画は県の仕事に見えます。国保の保険料の説明と徴収は町に残ると感じます。\n- **福祉側**：構想は病床の話に見え、退院後の受け皿の議論に呼ばれにくいと感じます。新たな構想には介護連携が入るので、出席者を気にします。\n\n## 6 よくある誤解\n\n1. 「県の計画は町に関係ない」→県は市町村の意見を聴いて作ります。2027年4月から協議の場の関係者にも加わります。\n2. 「国保は県に移った」→県は財政運営を担い、資格管理と保険料の決定・徴収は市町村です。\n3. 「地域医療構想は病床の話だけ」→2025年の法改正で、外来・在宅と介護連携も含む構想に変わります。\n\n## 7 用語\n\n| 医療側の言い方 | 行政側の言い方 | 意味 |\n| --- | --- | --- |\n| 点数 | 診療報酬 | 国が定める医療の価格 |\n| 医療圏 | 二次医療圏（法律では「区域」） | 入院医療をまとめて考える単位 |\n| 調整会議 | 協議の場 | 県が区域ごとに設ける話し合い |\n| プラン | 公立病院経営強化プラン | 公立病院の経営計画 |\n| 医師の少ない地域 | 医師少数区域・医師少数スポット | 県が定める地域。スポットは原則市区町村 |\n\n## 8 深掘りの一次資料\n\n- 法令：医療法第30条の4・第30条の11・第30条の14、国民健康保険法第4条・第82条の2、健康保険法第76条\n- [厚労省「医療計画について」（2026年9月改正）](https://www.mhlw.go.jp/content/001751758.pdf)\n- [厚労省「新たな地域医療構想に関するとりまとめ」（2026年3月）](https://www.mhlw.go.jp/content/10800000/001676424.pdf)\n- [厚労省 改正医療法の公布通知（2025年12月）](https://www.mhlw.go.jp/content/10800000/001613646.pdf)\n- [厚労省 医師確保計画策定ガイドライン（第8次後期）](https://www.mhlw.go.jp/content/001718579.pdf)\n- [厚労省 令和8年度診療報酬改定](https://www.mhlw.go.jp/stf/newpage_67729.html)\n- [総務省 公立病院経営強化ガイドライン](https://www.soumu.go.jp/main_content/000803322.pdf)\n- [総務省 公立病院経営強化の検討会（2026年）](https://www.soumu.go.jp/main_sosiki/kenkyu/jizoku_iryo_r08/index.html)\n\n## 9 自分の町で確認すること\n\n1. 町が入る二次医療圏と構想区域：県の医療計画\n2. 調整会議の構成と町の出席者：県の担当課か保健所、公表名簿\n3. 自院のプランの期間と数値目標：プラン本文と毎年の点検結果\n\n## 10 自己チェック\n\n1. 調整会議を設けるのは誰ですか？　→県です。市町村は2027年4月から法律上の関係者です。\n2. 国保の保険料率を決めるのは誰ですか？　→市町村です。県は納付金を決めます。\n3. プランで必ず目標を置く指標は何ですか？　→経常収支比率と修正医業収支比率です。\n\n## 版と生成の記録\n\n- 版：v0\n- 基準日：2026年11月3日\n- 生成：設計書のP1で下書き（一次資料を確認）\n- 点検：独立レビュー1回を反映（2026年11月3日）。現場の確認は未了\n- 未照合：診療報酬の改定が「通常2年」であること（2026・2027年度の平均と2028年度改定への言及までは確認）、納付金と保険料率を決める月、2026年7月の地域医療構想策定ガイドライン本文、2027年4月施行の増床の規定（基準病床数未満でも必要量を超える増床を不許可にできる。規制の事前評価書で確認）の本文への影響\n"},{"unit":4,"title":"介護・福祉","char_count":1985,"items":{"summary":{"text":"介護保険は市町村が保険者で、3年ごとの計画と地域包括ケア（医療・介護・住まいなどを地域で一体に支える）で動きます。事業所の多くは民間で、指定権限は県と市町村に分かれ、障害福祉と生活保護は財源も窓口も別です（2026年11月時点）。"},"mechanism":{"figure":null,"flows":[{"who":"市町村（保険者）","to":"65歳以上の住民","what":"保険料","note":"条例で定め、3年で収支を合わせる"},{"who":"市町村","to":"申請した住民","what":"要介護認定と給付","note":"公費50%、保険料50%"},{"who":"県（指定都市・中核市は市）","to":"事業所","what":"居宅サービス（訪問・通所など）と施設の指定・許可","note":"関係市町村長は意見を出せる"},{"who":"市町村","to":"事業所","what":"地域密着型（小規模な通いなど）と居宅介護支援（ケアマネの事業所）の指定","note":"一部は計画の見込量で制限できる"},{"who":"市町村","to":"地域包括支援センター","what":"直営か委託で設置","note":"全国5,487か所、委託81%（2025年4月末）"}, のは実施機関。医療費は医療扶助で負担"}],"sources":[{"text":"法令：介護保険法第115条の45〜48・第117条、社会福祉法第14条、生活保護法第19条、障害者総合支援法第88条"},{"text":"厚労省「第10期介護保険事業（支援）計画の作成準備について」","url":"https://www.mhlw.go.jp/content/12301000/001526855.pdf"},{"text":"厚労省「第9期保険料の集計結果」","url":"https://www.mhlw.go.jp/content/12303500/001253798.pdf"},{"text":"厚労省「地域包括支援センターについて」","url":"https://www.mhlw.go.jp/content/12300000/001671185.pdf"},{"text":"厚労省「福祉事務所」","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/hukushi_kaigo/seikatsuhogo/fukusijimusyo/index.html"},{"text":"厚労省「第8期障害福祉計画について」","url":"https://www.mhlw.go.jp/stf/newpage_72187.html"},{"text":"厚労省「社会福祉法等の一部を改正する法律等の成立について」","url":"https://www.mhlw.go.jp/content/12201000/001720534.pdf"}],"local_checks":[{"what":"事業計画の期と策定年、保険者が町単独か共同か","where":"介護保険担当課か計画書"},{"what":"地域ケア会議の頻度と医療側の参加","where":"地域包括の開催記録"},{"what":"福祉事務所の有無と、町内事業所の指定権者","where":"福祉と介護保険の担当課"}],"self_check":[{"question":"第10期の計画はいつ始まりますか？","answer":"2027年4月です。"},{"question":"福祉事務所のない町村の生活保護は誰が決めますか？","answer":"県の福祉事務所です。町村長は通報や申請の送付、急迫時の応急保護を担います。"},{"question":"地域ケア会議の設置は市町村の義務ですか？","answer":"努力義務です。"}]},"record":{"version":"v0","baseline":"2026年11月3日","generated":"設計書のP1で下書き（一次資料を確認）","reviewed":"独立レビュー1回を反映（2026年11月3日）。現場の確認は未了","unverified":"第10期介護保険と第8期障害福祉の基本指針の告示日。地域ケア会議の開催頻度と医療側の参加の全国データ"},"md":"# 単元4 介護・福祉\n\n## 1 一言で\n\n介護保険は市町村が保険者で、3年ごとの計画と地域包括ケア（医療・介護・住まいなどを地域で一体に支える）で動きます。事業所の多くは民間で、指定権限は県と市町村に分かれ、障害福祉と生活保護は財源も窓口も別です（2026年11月時点）。\n\n## 2 仕組みの図\n\n| 誰が | 誰へ | 何を | 補足 |\n| --- | --- | --- | --- |\n| 市町村（保険者） | 65歳以上の住民 | 保険料 | 条例で定め、3年で収支を合わせる |\n| 市町村 | 申請した住民 | 要介護認定と給付 | 公費50%、保険料50% |\n| 県（指定都市・中核市は市） | 事業所 | 居宅サービス（訪問・通所など）と施設の指定・許可 | 関係市町村長は意見を出せる |\n| 市町村 | 事業所 | 地域密着型（小規模な通いなど）と居宅介護支援（ケアマネの事業所）の指定 | 一部は計画の見込量で制限できる |\n| 市町村 | 地域包括支援センター | 直営か委託で設置 | 全国5,487か所、委託81%（2025年4月末） |\n| 市町村 | 高齢者 | 総合事業（介護予防と生活支援） | 財源構成は給付と同じ |\n| 市町村・地域包括 | 関係者 | 地域ケア会議 | 努力義務。事例と地域課題を扱う |\n| 市町村 | 障害のある人 | 障害福祉の支給決定 | 事業所の指定は県など。国が50%負担 |\n| 福祉事務所 | 生活に困る人 | 生活保護 | 市は必置、町村は任意。国が3/4負担 |\n\n第9期の保険料基準額は全国平均で月6,225円、1,573保険者（広域連合なども含む）の中で3,374〜9,249円です。訪問介護の開設主体は会社73.2%、自治体0.3%です（2024年10月）。福祉事務所を置く町村は44です（2026年4月）。\n\n## 3 時間軸\n\n| 時期 | 起きること | 区分 |\n| --- | --- | --- |\n| 2024〜2026年度 | 第9期介護保険事業計画、第7期障害福祉計画 | 制度上は3年1期（障害福祉は原則） |\n| 2026年6月 | 介護と障害福祉の報酬を期中改定（賃上げ中心） | 制度上は |\n| 2026年度 | 調査と推計の後、年度末に保険料の条例改正を議会へ | 多くの自治体では |\n| 2027年4月 | 第10期と第8期が開始（2029年度まで）、改正法が原則施行 | 制度上は |\n| 2027年度 | 介護と障害福祉の報酬改定 | 制度上は（予定） |\n\n改正法（令和8年法律第51号）は、中山間・人口減少地域の特例サービスと、事業者が少ない地域で市町村がサービスを行える事業を設けます。計画の重なりは単元6、会議は単元11で扱います。\n\n## 4 現場の実情と限界\n\n状態：仮（現場の確認前）\n\n- 多くの自治体では、担当者が少なく、給付と保険料の推計に時間を取られます。\n- 保険料の改定は議決が要り、負担を抑える議論が新サービスの議論より先に立ちがちです。\n- 民間事業所の開設や撤退を町は命じられません。小さな町では、一つ撤退すると代わりがないことがあります。\n- 地域ケア会議は平日日中が多く、医師が出にくいことがあります。報告で終わることもあります。\n- 福祉事務所のない町村では、生活保護の情報が町に入りにくいことがあります。\n\n## 5 立場で見え方が違うところ\n\n状態：仮（現場の確認前）\n\n- **医療側**：退院先や在宅の支援が足りないと、町が増やせばよいと考えがちです。平日日中の会議には出にくいと感じます。\n- **行政側**：給付が増えれば保険料に跳ね返るので、3年間の均衡と議会への説明を先に考えます。民間の事業所には頼むことしかできない場面があります。\n- **福祉側**：介護、障害、生活保護で制度も窓口も分かれ、一人の暮らしを分けて扱いがちです。人手不足の中で、調整と書類の負担を重く感じます。\n\n## 6 よくある誤解\n\n1. 「介護の事業所は町が指定する」→居宅サービスと施設は県（指定都市・中核市は市）、地域密着型と居宅介護支援は市町村です。\n2. 「福祉事務所はどの町にもある」→市は必置、町村は任意です。置かない町村の生活保護は県の事務所が決めます。\n3. 「保険料は全国同じ」→保険者ごとに条例で決めます。\n\n## 7 用語\n\n| 医療側の言い方 | 行政側の言い方 | 意味 |\n| --- | --- | --- |\n| ケアマネ | 介護支援専門員 | 介護の計画を作り調整する専門職 |\n| 包括 | 地域包括支援センター | 高齢者の総合相談の拠点 |\n| 介護度 | 要介護状態区分（要支援1〜要介護5） | 市町村の認定で決まる介護の必要度 |\n| 町の介護計画（ケアプランとは別） | 介護保険事業計画 | 3年分の給付見込みと保険料の根拠 |\n| 生保 | 生活保護（医療扶助） | 保護を決めるのは実施機関。医療費は医療扶助で負担 |\n\n## 8 深掘りの一次資料\n\n- 法令：介護保険法第115条の45〜48・第117条、社会福祉法第14条、生活保護法第19条、障害者総合支援法第88条\n- [厚労省「第10期介護保険事業（支援）計画の作成準備について」](https://www.mhlw.go.jp/content/12301000/001526855.pdf)\n- [厚労省「第9期保険料の集計結果」](https://www.mhlw.go.jp/content/12303500/001253798.pdf)\n- [厚労省「地域包括支援センターについて」](https://www.mhlw.go.jp/content/12300000/001671185.pdf)\n- [厚労省「福祉事務所」](https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/hukushi_kaigo/seikatsuhogo/fukusijimusyo/index.html)\n- [厚労省「第8期障害福祉計画について」](https://www.mhlw.go.jp/stf/newpage_72187.html)\n- [厚労省「社会福祉法等の一部を改正する法律等の成立について」](https://www.mhlw.go.jp/content/12201000/001720534.pdf)\n\n## 9 自分の町で確認すること\n\n1. 事業計画の期と策定年、保険者が町単独か共同か：介護保険担当課か計画書\n2. 地域ケア会議の頻度と医療側の参加：地域包括の開催記録\n3. 福祉事務所の有無と、町内事業所の指定権者：福祉と介護保険の担当課\n\n## 10 自己チェック\n\n1. 第10期の計画はいつ始まりますか？　→2027年4月です。\n2. 福祉事務所のない町村の生活保護は誰が決めますか？　→県の福祉事務所です。町村長は通報や申請の送付、急迫時の応急保護を担います。\n3. 地域ケア会議の設置は市町村の義務ですか？　→努力義務です。\n\n## 版と生成の記録\n\n- 版：v0\n- 基準日：2026年11月3日\n- 生成：設計書のP1で下書き（一次資料を確認）\n- 点検：独立レビュー1回を反映（2026年11月3日）。現場の確認は未了\n- 未照合：第10期介護保険と第8期障害福祉の基本指針の告示日。地域ケア会議の開催頻度と医療側の参加の全国データ\n"},{"unit":5,"title":"保健・予防","char_count":1968,"items":{"summary":{"text":"保健所は主に都道府県が、身近な保健は市町村が担います。健診は、特定健診が保険者（健康保険の運営者）、がん検診が市町村、職場の健診が事業者と、実施者も財源も分かれます（2026年11月時点）。"},"mechanism":{"figure":null,"flows":[{"who":"都道府県・保健所設置市・特別区","to":"区域の住民・医療機関","what":"保健所（感染症、精神保健など）","note":"町村は置けない"},{"who":"市町村","to":"住民","what":"保健センター等の相談・保健指導","note":"設置は任意"},{"who":"保険者（国保は市町村が実施）","to":"40〜74歳の加入者","what":"特定健診","note":"義務。国保は国と県が各1/3負担"},{"who":"事業者","to":"労働者","what":"定期健診","note":"義務。事業者負担。特定健診より優先"},{"who":"後期高齢者医療広域連合","to":"75歳以上","what":"健診","note":"努力義務"},{"who":"市町村","to":"住民","what":"がん検診","note":"努力義務。国は交付税で手当（単元2）"},{"who":"市町村","to":"1歳6か月児・3歳児","what":"乳幼児健診","note":"義務。財源は同上"},{"who":"市町村","to":"妊産婦・子育て世帯","what":"こども家庭センター","note":"設置は努力義務"},{"who":"市町村","to":"住民","what":"定期予防接種","note":"市町村負担（B類は実費徴収も）。A類9割、B類3割程度を交付税で手当"},{"who":"医師","to":"最寄りの保健所","what":"感染症の届出","note":"直ちに、または7日以内"}],"notes":["保健所は全国462か所で、都道府県352、指定都市20、中核市62、その他の市5、特別区23、保健センターは2,346か所です（2026年4月1日）。","特定健診の実施率は全国61.5%、市町村国保38.8%、対象者5千人未満の国保44.7%で（2024年度）、市町村国保の目標は2029年度に60%です。市町村のがん検診の受診率は乳16.1%など（2024年度）で、職場なども含む国の調査（過去2年の受診）では乳51.0%です（2025年）。","こども家庭センターの設置率は一般市97.5%、町79.4%、村59.6%です（2026年4月1日）。常勤保健師は、保健所設置市と特別区を除く市町村で21,713人です（2025年5月1日）。国も小規模市町村の人材配置の難しさを挙げます（2025年8月）。"]},"timeline":{"rows":[{"when":"2024〜2035年度","event":"健康日本21（第三次、国の健康づくり方針）。市町村の計画は努力義務（単元6）","basis":"制度上は"},{"when":"2024〜2029年度","event":"特定健診の第4期","basis":"制度上は"},{"when":"2024年4月から","event":"保健所設置市・特別区にも感染症の予防計画（一部の事項）を義務化。こども家庭センターは努力義務に","basis":"制度上は"},{"when":"2027年4月から","event":"がん検診の国の指針の改正を適用","basis":"制度上は"},{"when":"春〜夏","event":"健診の案内を送り、集団健診を始める","basis":"多くの自治体では"}],"notes":[]},"field_limits":{"status":{"state":"仮"},"points":["少人数の町では、保健師が健診、母子、介護予防を兼ね、急な対応で他が止まることがあります。","多くの自治体で保健師が医療・福祉・行政の間を訳しますが、異動で途切れることがあります。","健診の日程や委託先は前年どおりになりやすく、変更には調整の時間が要ります。","受診者が増えると町の負担も増え、議会への説明が要ります。","職場で受けた検診は町に届きにくく、全体をつかみにくいです。"]},"perspectives":{"status":{"state":"仮"},"medical":"健診の後のつなぎ先が分かりにくいと感じます。感染症は保健所、生活の相談は町の保健師と相手が分かれます。","admin":"検診や接種は町の財源で行うので、受診率と予算を一緒に説明します。保健師の定数は町全体の人事で決まります。","welfare":"保健師は介護予防やこどもの支援の頼れる相手です。ただ計画と会議が分かれ、同じ世帯を別々に見がちです。"},"misconceptions":[{"myth":"「保健所は町の機関だ」","fact":"町村と多くの市の保健所は都道府県の機関です。町にあるのは保健センターなどです。"},{"myth":"「健診は全部保険者の仕事だ」","fact":"保険者の義務は40〜74歳の特定健診です。ほかは実施者が別です。"},{"myth":"「感染症で町に役割はない」","fact":"定期予防接種は市町村が実施し、費用も負担します。"}],"terms":[{"medical":"メタボ健診","admin":"特定健康診査","meaning":"40〜74歳に保険者が行う健診"},{"medical":"住民検診","admin":"がん検診（健康増進事業）","meaning":"市町村が住民に行う検査"},{"medical":"保健師のまとめ役","admin":"統括保健師","meaning":"組織を越えて調整する保健師"},{"medical":"予防接種","admin":"定期接種（A類・B類）","meaning":"法律に基づき市町村が行う接種"},{"medical":"母子の窓口","admin":"こども家庭センター","meaning":"母子保健と児童福祉を一体で担う機関"}],"sources":[{"text":"法令：地域保健法、健康増進法、高齢者医療確保法、母子保健法、児童福祉法、感染症法、予防接種法"},{"text":"厚労省「設置主体別保健所数」","url":"https://www.mhlw.go.jp/content/10900000/001232824.pdf"},{"text":"厚労省「2024年度 特定健診・特定保健指導の実施状況」","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/newpage_00082.html"},{"text":"厚労省「日本の健診（検診）制度の概要」","url":"https://www.mhlw.go.jp/content/11201250/001596457.pdf"},{"text":"こども家庭庁「こども家庭センターの設置状況」","url":"https://www.cfa.go.jp/policies/jidougyakutai/setchijokyochosa"}],"local_checks":[{"what":"保健師の人数と担当の分け方","where":"保健担当課か統括保健師に聞く"},{"what":"特定健診とがん検診の受診率","where":"国保の実施計画と保健担当課の実績"},{"what":"管轄の保健所と普段の接点","where":"厚労省の所管区域案内と保健所"}],"self_check":[{"question":"人口数千人の町は保健所を置けますか？","answer":"いいえ。町村は設置主体ではありません。"},{"question":"国保に入る50歳の住民の特定健診とがん検診は誰が行いますか？","answer":"どちらも市町村です。ただし根拠の法律と財源が別です。"},{"question":"町のがん検診の受診率が低くても、未受診とは限らないのはなぜですか？","answer":"職場や人間ドックの受診が入らないからです。"}]},"record":{"version":"v0","baseline":"2026年11月3日","generated":"設計書のP1で下書き（一次資料を確認）","reviewed":"独立レビュー1回を反映（2026年11月3日）。現場の確認は未了","unverified":"事業者健診の負担、がん検診と乳幼児健診の交付税措置は作成日不明の厚労省資料（2019年調査を引用）で確認し、現行年度は要確認。未施行の改正：令和7年法律第87号（医療法等改正）に感染症法の予防計画（2027年4月施行）と、母子保健法・児童福祉法・健康増進法・予防接種法の改正（政令で定める日）が含まれる。本文の記述への影響は要確認"},"md":"# 単元5 保健・予防\n\n## 1 一言で\n\n保健所は主に都道府県が、身近な保健は市町村が担います。健診は、特定健診が保険者（健康保険の運営者）、がん検診が市町村、職場の健診が事業者と、実施者も財源も分かれます（2026年11月時点）。\n\n## 2 仕組みの図\n\n| 誰が | 誰へ | 何を | 補足 |\n| --- | --- | --- | --- |\n| 都道府県・保健所設置市・特別区 | 区域の住民・医療機関 | 保健所（感染症、精神保健など） | 町村は置けない |\n| 市町村 | 住民 | 保健センター等の相談・保健指導 | 設置は任意 |\n| 保険者（国保は市町村が実施） | 40〜74歳の加入者 | 特定健診 | 義務。国保は国と県が各1/3負担 |\n| 事業者 | 労働者 | 定期健診 | 義務。事業者負担。特定健診より優先 |\n| 後期高齢者医療広域連合 | 75歳以上 | 健診 | 努力義務 |\n| 市町村 | 住民 | がん検診 | 努力義務。国は交付税で手当（単元2） |\n| 市町村 | 1歳6か月児・3歳児 | 乳幼児健診 | 義務。財源は同上 |\n| 市町村 | 妊産婦・子育て世帯 | こども家庭センター | 設置は努力義務 |\n| 市町村 | 住民 | 定期予防接種 | 市町村負担（B類は実費徴収も）。A類9割、B類3割程度を交付税で手当 |\n| 医師 | 最寄りの保健所 | 感染症の届出 | 直ちに、または7日以内 |\n\n保健所は全国462か所で、都道府県352、指定都市20、中核市62、その他の市5、特別区23、保健センターは2,346か所です（2026年4月1日）。\n\n特定健診の実施率は全国61.5%、市町村国保38.8%、対象者5千人未満の国保44.7%で（2024年度）、市町村国保の目標は2029年度に60%です。市町村のがん検診の受診率は乳16.1%など（2024年度）で、職場なども含む国の調査（過去2年の受診）では乳51.0%です（2025年）。\n\nこども家庭センターの設置率は一般市97.5%、町79.4%、村59.6%です（2026年4月1日）。常勤保健師は、保健所設置市と特別区を除く市町村で21,713人です（2025年5月1日）。国も小規模市町村の人材配置の難しさを挙げます（2025年8月）。\n\n## 3 時間軸\n\n| 時期 | 起きること | 区分 |\n| --- | --- | --- |\n| 2024〜2035年度 | 健康日本21（第三次、国の健康づくり方針）。市町村の計画は努力義務（単元6） | 制度上は |\n| 2024〜2029年度 | 特定健診の第4期 | 制度上は |\n| 2024年4月から | 保健所設置市・特別区にも感染症の予防計画（一部の事項）を義務化。こども家庭センターは努力義務に | 制度上は |\n| 2027年4月から | がん検診の国の指針の改正を適用 | 制度上は |\n| 春〜夏 | 健診の案内を送り、集団健診を始める | 多くの自治体では |\n\n## 4 現場の実情と限界\n\n状態：仮（現場の確認前）\n\n- 少人数の町では、保健師が健診、母子、介護予防を兼ね、急な対応で他が止まることがあります。\n- 多くの自治体で保健師が医療・福祉・行政の間を訳しますが、異動で途切れることがあります。\n- 健診の日程や委託先は前年どおりになりやすく、変更には調整の時間が要ります。\n- 受診者が増えると町の負担も増え、議会への説明が要ります。\n- 職場で受けた検診は町に届きにくく、全体をつかみにくいです。\n\n## 5 立場で見え方が違うところ\n\n状態：仮（現場の確認前）\n\n- **医療側**：健診の後のつなぎ先が分かりにくいと感じます。感染症は保健所、生活の相談は町の保健師と相手が分かれます。\n- **行政側**：検診や接種は町の財源で行うので、受診率と予算を一緒に説明します。保健師の定数は町全体の人事で決まります。\n- **福祉側**：保健師は介護予防やこどもの支援の頼れる相手です。ただ計画と会議が分かれ、同じ世帯を別々に見がちです。\n\n## 6 よくある誤解\n\n1. 「保健所は町の機関だ」→町村と多くの市の保健所は都道府県の機関です。町にあるのは保健センターなどです。\n2. 「健診は全部保険者の仕事だ」→保険者の義務は40〜74歳の特定健診です。ほかは実施者が別です。\n3. 「感染症で町に役割はない」→定期予防接種は市町村が実施し、費用も負担します。\n\n## 7 用語\n\n| 医療側の言い方 | 行政側の言い方 | 意味 |\n| --- | --- | --- |\n| メタボ健診 | 特定健康診査 | 40〜74歳に保険者が行う健診 |\n| 住民検診 | がん検診（健康増進事業） | 市町村が住民に行う検査 |\n| 保健師のまとめ役 | 統括保健師 | 組織を越えて調整する保健師 |\n| 予防接種 | 定期接種（A類・B類） | 法律に基づき市町村が行う接種 |\n| 母子の窓口 | こども家庭センター | 母子保健と児童福祉を一体で担う機関 |\n\n## 8 深掘りの一次資料\n\n- 法令：地域保健法、健康増進法、高齢者医療確保法、母子保健法、児童福祉法、感染症法、予防接種法\n- [厚労省「設置主体別保健所数」](https://www.mhlw.go.jp/content/10900000/001232824.pdf)\n- [厚労省「2024年度 特定健診・特定保健指導の実施状況」](https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/newpage_00082.html)\n- [厚労省「日本の健診（検診）制度の概要」](https://www.mhlw.go.jp/content/11201250/001596457.pdf)\n- [こども家庭庁「こども家庭センターの設置状況」](https://www.cfa.go.jp/policies/jidougyakutai/setchijokyochosa)\n\n## 9 自分の町で確認すること\n\n1. 保健師の人数と担当の分け方：保健担当課か統括保健師に聞く\n2. 特定健診とがん検診の受診率：国保の実施計画と保健担当課の実績\n3. 管轄の保健所と普段の接点：厚労省の所管区域案内と保健所\n\n## 10 自己チェック\n\n1. 人口数千人の町は保健所を置けますか？　→いいえ。町村は設置主体ではありません。\n2. 国保に入る50歳の住民の特定健診とがん検診は誰が行いますか？　→どちらも市町村です。ただし根拠の法律と財源が別です。\n3. 町のがん検診の受診率が低くても、未受診とは限らないのはなぜですか？　→職場や人間ドックの受診が入らないからです。\n\n## 版と生成の記録\n\n- 版：v0\n- 基準日：2026年11月3日\n- 生成：設計書のP1で下書き（一次資料を確認）\n- 点検：独立レビュー1回を反映（2026年11月3日）。現場の確認は未了\n- 未照合：事業者健診の負担、がん検診と乳幼児健診の交付税措置は作成日不明の厚労省資料（2019年調査を引用）で確認し、現行年度は要確認。未施行の改正：令和7年法律第87号（医療法等改正）に感染症法の予防計画（2027年4月施行）と、母子保健法・児童福祉法・健康増進法・予防接種法の改正（政令で定める日）が含まれる。本文の記述への影響は要確認\n"},{"unit":6,"title":"計画と財源の結び目","char_count":1980,"items":{"summary":{"text":"交付金や借入（起債）には計画への記載を条件にするものがありますが、予算そのものは計画になくても議決できます。計画は義務・努力義務・任意が重なるので、財源の条件と改定年から逆算して載せます（2026年11月時点）。"},"mechanism":{"figure":null,"flows":[{"who":"市町村","to":"議会・住民","what":"総合計画","note":"法の義務なし（2011年に規定削除）"},{"who":"市町村","to": {"medical":"事業の予定表","admin":"実施計画","meaning":"数年先までの事業一覧。毎年見直すことが多い"},{"medical":"地方創生の計画","admin":"地方版総合戦略","meaning":"国の戦略を勘案して作る町の戦略"},{"medical":"国の認定","admin":"地域再生計画","meaning":"地域未来交付金（推進型）を使う前提の計画"},{"medical":"できれば作る","admin":"努力義務","meaning":"作るよう努める定め。義務より弱い"}],"sources":[{"text":"法令：地方自治法第96条・第211条、介護保険法第117条・第129条、健康増進法第8条、社会福祉法第107条、まち・ひと・しごと創生法第10条、過疎法第14条"},{"text":"内閣府「地域再生制度」（2026年8月版）","url":"https://www.chisou.go.jp/tiiki/tiikisaisei/pdf/r8_chiiki_panf.pdf"},{"text":"総務省「公立病院等に対する地方財政措置等について」（2026年10月）","url":"https://www.soumu.go.jp/main_content/001097376.pdf"},{"text":"地域福祉（支援）計画策定状況等の調査結果概要","url":"https://www.mhlw.go.jp/content/001477388.pdf"},{"text":"閣議決定「計画策定等における地方分権改革の推進について」（2023年3月）","url":"https://www.cao.go.jp/bunken-suishin/doc/r05/k_tb_r5_honbun.pdf"}],"local_checks":[{"what":"各計画の改定年と担当課","where":"企画担当に一覧を聞く"},{"what":"点検・評価の時期と会議体","where":"各審議会の要綱と議事録"},{"what":"記載が条件の財源と、実施計画にない事業の扱い","where":"財政担当に聞く"}],"self_check":[{"question":"介護保険事業計画と地域福祉計画で法の強さはどう違いますか？","answer":"介護は義務、地域福祉は努力義務です。"},{"question":"地域未来交付金（推進型）を使うには何が要りますか？","answer":"地方版総合戦略の事業を載せた地域再生計画の認定です。"},{"question":"改定年を逃すと次まで必ず待ちますか？","answer":"いいえ。制度上は期中に変更できますが、実際には動きにくいことがあります。"}]},"record":{"version":"v0","baseline":"2026年11月3日","generated":"設計書のP1で下書き（一次資料を確認）","reviewed":"独立レビュー1回を反映（2026年11月3日）。現場の確認は未了","unverified":"次期経営強化プランの開始時期（総務省資料は2029年度〜と図示するが期限と期間は議論中で、2028年度の扱いは不明）。総合計画の三層は民間調査の説明で確認。実施計画を毎年見直す運用、改定前年度に中身が固まること、夏〜秋の流れは一次資料で未確認。2011年の総務大臣通知は総務省サイトの原本を確認できず、法案概要と市サイト掲載の写しで確認"},"md":"# 単元6 計画と財源の結び目\n\n## 1 一言で\n\n交付金や借入（起債）には計画への記載を条件にするものがありますが、予算そのものは計画になくても議決できます。計画は義務・努力義務・任意が重なるので、財源の条件と改定年から逆算して載せます（2026年11月時点）。\n\n## 2 仕組みの図\n\n| 誰が | 誰へ | 何を | 補足 |\n| --- | --- | --- | --- |\n| 市町村 | 議会・住民 | 総合計画 | 法の義務なし（2011年に規定削除） |\n| 市町村 | 国 | 地域再生計画 | 地方版総合戦略（努力義務）の事業を載せ、認定で地域未来交付金（推進型）へ。交付金は2026年度当初1,600億円 |\n| 市町村 | 県 | 介護保険事業計画 | 義務で3年一期。保険料率の基礎（単元4） |\n| 市町村 | 住民 | 健康増進計画 | 努力義務（単元5） |\n| 市町村 | 住民 | 地域福祉計画 | 努力義務。策定は市区96.6%、町村79.6%（2024年4月） |\n| 病院を持つ自治体 | 議会・住民 | 公立病院経営強化プラン | 総務省の指針。統合か機能見直しの整備に出る病院事業債（特別分）の前提 |\n| 過疎地域の市町村 | 議会 | 過疎計画 | 任意。計画に基づく診療施設などの整備に過疎対策事業債（過疎債）。元利償還の70%が交付税の算定に入る |\n\n計画策定等を定めた法律の条項は、2010年の345から2020年末の505に増えました（義務202、努力義務87、できる217。重複あり）。\n\n## 3 時間軸\n\n| 時期 | 起きること | 区分 |\n| --- | --- | --- |\n| 2026年度 | 第10期介護保険事業計画（2027〜2029年度）を作る | 制度上は3年一期 |\n| 2026〜2030年度 | 国の地域未来戦略。地方版の改訂は町が判断 | 制度上は努力義務 |\n| 2027年4月 | 地域福祉計画に保健医療などとの連携の記載を追加 | 制度上は改正法の施行 |\n| 2027年度 | 経営強化プランの標準の終期。次期は議論中（2026年10月時点） | 制度上は団体により異なる |\n| 改定の前年度 | 住民調査と審議会で中身が固まり始める | 多くの自治体では |\n| 毎年夏〜秋 | 点検・評価、実施計画の見直し、予算要求（単元2） | 多くの自治体では |\n\n待つ年数は計画で違います。介護は3年ごと、地域福祉計画は法に定めがなく72.1%が5年です（2024年4月）。点検は、介護が法定、地域福祉が努力義務、経営強化プランは指針で概ね年1回以上です。\n\n## 4 現場の実情と限界\n\n状態：仮（現場の確認前）\n\n- 計画ごとに担当課と審議会が別で、改定年の一覧がないことがあります。\n- 改定の年に申し出ても、中身は前年度に固まりつつあることがあります。期中の変更は制度上できても動きにくくなります。\n- 少人数で複数の計画を抱え、前の文言を引き継ぎがちです。\n- 地域福祉計画の策定済み市町村で定期点検は67.7%です（2024年4月）。点検も報告で終わりやすいかもしれません。\n- 総合計画を議決の対象にした町では、変更も議決が要ることがあります。\n\n## 5 立場で見え方が違うところ\n\n状態：仮（現場の確認前）\n\n- **医療側**：プランに書いたことは町も約束したと受け取りがちです。総合計画に病院の課題が載っているかは、見る機会が少ないと感じます。\n- **行政側**：計画は予算の約束ではなく、毎年の査定と議決で決まると考えます。交付金や起債の条件に合う計画を優先しがちです。\n- **福祉側**：介護の計画は3年周期で、保険料の算定に追われがちです。地域福祉計画は努力義務で、裏づける財源が見えにくいと感じます。\n\n## 6 よくある誤解\n\n1. 「計画に載らないと予算はつかない」→地方自治法の予算の条文に計画の要件はありません。記載が条件なのは過疎債や交付金など一部です。\n2. 「計画に載れば予算はつく」→計画は予算を約束しません。毎年の査定と議決を経ます。\n3. 「総合計画は法律で必須」→2011年の法改正で規定は削除されました。策定は町の判断です。\n\n## 7 用語\n\n| 医療側の言い方 | 行政側の言い方 | 意味 |\n| --- | --- | --- |\n| 町の計画 | 総合計画 | 全分野を束ねる計画。多くの自治体では基本構想・基本計画・実施計画の三層 |\n| 事業の予定表 | 実施計画 | 数年先までの事業一覧。毎年見直すことが多い |\n| 地方創生の計画 | 地方版総合戦略 | 国の戦略を勘案して作る町の戦略 |\n| 国の認定 | 地域再生計画 | 地域未来交付金（推進型）を使う前提の計画 |\n| できれば作る | 努力義務 | 作るよう努める定め。義務より弱い |\n\n## 8 深掘りの一次資料\n\n- 法令：地方自治法第96条・第211条、介護保険法第117条・第129条、健康増進法第8条、社会福祉法第107条、まち・ひと・しごと創生法第10条、過疎法第14条\n- [内閣府「地域再生制度」（2026年8月版）](https://www.chisou.go.jp/tiiki/tiikisaisei/pdf/r8_chiiki_panf.pdf)\n- [総務省「公立病院等に対する地方財政措置等について」（2026年10月）](https://www.soumu.go.jp/main_content/001097376.pdf)\n- [地域福祉（支援）計画策定状況等の調査結果概要](https://www.mhlw.go.jp/content/001477388.pdf)\n- [閣議決定「計画策定等における地方分権改革の推進について」（2023年3月）](https://www.cao.go.jp/bunken-suishin/doc/r05/k_tb_r5_honbun.pdf)\n\n## 9 自分の町で確認すること\n\n1. 各計画の改定年と担当課：企画担当に一覧を聞く\n2. 点検・評価の時期と会議体：各審議会の要綱と議事録\n3. 記載が条件の財源と、実施計画にない事業の扱い：財政担当に聞く\n\n## 10 自己チェック\n\n1. 介護保険事業計画と地域福祉計画で法の強さはどう違いますか？　→介護は義務、地域福祉は努力義務です。\n2. 地域未来交付金（推進型）を使うには何が要りますか？　→地方版総合戦略の事業を載せた地域再生計画の認定です。\n3. 改定年を逃すと次まで必ず待ちますか？　→いいえ。制度上は期中に変更できますが、実際には動きにくいことがあります。\n\n## 版と生成の記録\n\n- 版：v0\n- 基準日：2026年11月3日\n- 生成：設計書のP1で下書き（一次資料を確認）\n- 点検：独立レビュー1回を反映（2026年11月3日）。現場の確認は未了\n- 未照合：次期経営強化プランの開始時期（総務省資料は2029年度〜と図示するが期限と期間は議論中で、2028年度の扱いは不明）。総合計画の三層は民間調査の説明で確認。実施計画を毎年見直す運用、改定前年度に中身が固まること、夏〜秋の流れは一次資料で未確認。2011年の総務大臣通知は総務省サイトの原本を確認できず、法案概要と市サイト掲載の写しで確認\n"},{"unit":7,"title":"人と組織の実情","char_count":1960,"items":{"summary":{"text":"多くの自治体では担当者が数年で替わり、専門職は少なく、年度ごとに任用する職員も多く、前例と公平性を軸に動きます。医療側の「緊急」と行政側の「公平」はここでぶつかるので、急ぐ手段と説明の根拠を分けて話します（2026年11月時点）。"},"mechanism":{"figure":null,"flows":[{"who":"町長など（任命権者）","to":"職員","what":"異動","note":"法律に周期の定めなし。定数は条例で決める（非常勤は除く）"},{"who":"任命権者","to":"会計年度任用職員","what":"年度単位の任用","note":"任期は長くても年度末まで。続けるには再度の任用（改めて選考）"},{"who":"国の各省","to":"自治体","what":"通知（技術的助言）","note":"命令でなく助言。従わなくても不利益に扱えない"},{"who":"国・県","to":"自治体","what":"処理基準","note":"生活保護など法定受託事務（国や県の代わりに行う事務）の「よるべき基準」"},{"who":"議員","to":"町長・課長","what":"質問・審議","note":"町長らは議長の求めで議場で説明。単元1で扱う"},{"who":"町","to":"住民","what":"対応・サービス","note":"住民の「ひとしく受ける権利」が公平の根拠の一つ"}],"notes":["会計年度任用職員は全国68万6,636人、町村8万5,601人です（2025年4月。週19時間25分以上かつ任期6か月以上）。町村の常勤職員13万7,719人（別調査）の6割強にあたる数です。人口約千人の村の例は職員45人、保健師1人です（資料の数値は主に2015年、例の時点は要確認）。","2024年4月からパートにも勤勉手当を支給できます。2026年10月以降は、任期が相当長期の職員に扶養・住居手当の支給が必要と総務省が助言しています。公募なしの再度の任用を「連続2回まで」とする国の職員の扱いは2024年6月に廃止され、基準は自治体ごとです。","在任年数の全国調査は確認できません。参考：生活保護の担当職員（常勤、2016年10月）は経験3年未満が61.6%です（福祉事務所は市に設置義務、町村は任意）。"]},"timeline":{"rows":[{"when":"1〜3月","event":"会計年度任用職員の翌年度の選考","basis":"多くの自治体では"},{"when":"3月31日","event":"会計年度任用職員の任期の上限","basis":"制度上は"},{"when":"3月下旬〜4月1日","event":"内示と定期異動で担当が替わる","basis":"多くの自治体では 支出で確かめる手段は何ですか？","answer":"予備費と専決処分です。予備費は議会が否決した使途には使えません。"}]},"record":{"version":"v0","baseline":"2026年11月3日","generated":"設計書のP1で下書き（一次資料を確認）","reviewed":"独立レビュー1回を反映（2026年11月3日）。現場の確認は未了","unverified":"全国の在任年数（「2〜3年」は一次資料で確認できず）。項目3の「多くの自治体では」の時期（一次資料なし）。地方公務員法は第23条の4まで読み周期の定めなしを確認し、第24条以降は未読。事務処理マニュアル2026年10月版の本文（文字化けで読めず、改訂通知で確認）。生活保護法別表第三の中身。項目2の村の例の時点（資料に記載なし）"},"md":"# 単元7 人と組織の実情\n\n## 1 一言で\n\n多くの自治体では担当者が数年で替わり、専門職は少なく、年度ごとに任用する職員も多く、前例と公平性を軸に動きます。医療側の「緊急」と行政側の「公平」はここでぶつかるので、急ぐ手段と説明の根拠を分けて話します（2026年11月時点）。\n\n## 2 仕組みの図\n\n| 誰が | 誰へ | 何を | 補足 |\n| --- | --- | --- | --- |\n| 町長など（任命権者） | 職員 | 異動 | 法律に周期の定めなし。定数は条例で決める（非常勤は除く） |\n| 任命権者 | 会計年度任用職員 | 年度単位の任用 | 任期は長くても年度末まで。続けるには再度の任用（改めて選考） |\n| 国の各省 | 自治体 | 通知（技術的助言） | 命令でなく助言。従わなくても不利益に扱えない |\n| 国・県 | 自治体 | 処理基準 | 生活保護など法定受託事務（国や県の代わりに行う事務）の「よるべき基準」 |\n| 議員 | 町長・課長 | 質問・審議 | 町長らは議長の求めで議場で説明。単元1で扱う |\n| 町 | 住民 | 対応・サービス | 住民の「ひとしく受ける権利」が公平の根拠の一つ |\n\n会計年度任用職員は全国68万6,636人、町村8万5,601人です（2025年4月。週19時間25分以上かつ任期6か月以上）。町村の常勤職員13万7,719人（別調査）の6割強にあたる数です。人口約千人の村の例は職員45人、保健師1人です（資料の数値は主に2015年、例の時点は要確認）。\n\n2024年4月からパートにも勤勉手当を支給できます。2026年10月以降は、任期が相当長期の職員に扶養・住居手当の支給が必要と総務省が助言しています。公募なしの再度の任用を「連続2回まで」とする国の職員の扱いは2024年6月に廃止され、基準は自治体ごとです。\n\n在任年数の全国調査は確認できません。参考：生活保護の担当職員（常勤、2016年10月）は経験3年未満が61.6%です（福祉事務所は市に設置義務、町村は任意）。\n\n## 3 時間軸\n\n| 時期 | 起きること | 区分 |\n| --- | --- | --- |\n| 1〜3月 | 会計年度任用職員の翌年度の選考 | 多くの自治体では |\n| 3月31日 | 会計年度任用職員の任期の上限 | 制度上は |\n| 3月下旬〜4月1日 | 内示と定期異動で担当が替わる | 多くの自治体では |\n| 4〜6月 | 引継ぎと前年度どおりの運用 | 多くの自治体では |\n| 定例会の前 | 質問の通告と答弁の準備 | 多くの自治体では（回数は条例で決める） |\n\n## 4 現場の実情と限界\n\n状態：仮（現場の確認前）\n\n- 異動すると、経緯は引継ぎ書に残る分しか伝わらないことがあります。\n- 小さな町村では兼務が多く、専門職が1人だと退職で業務が止まりかねません。\n- 前例のない案件は、根拠探しと決裁に時間がかかります。\n- 病院の事務職員も町の異動で替わることがあります。\n- 通知は助言でも、補助の要件と結びつくと事実上の決まりになりがちです。\n- 定例会の前後は答弁準備で、相談の返事が遅れることがあります。\n- 特定の人や施設の優遇と見られないか、先に確かめます。\n\n## 5 立場で見え方が違うところ\n\n状態：仮（現場の確認前）\n\n- **医療側**：患者の不利益は待てないので、「緊急」は今日から今週の話です。担当が替わるたびに同じ説明をするのが負担です。\n- **行政側**：一人に認めた例外は、同じ事情の全員に説明が要ります。議会と住民に示せる根拠がないと動きにくいです。\n- **福祉側**：利用者の生活は年度で区切れず、担当の交代で関係を作り直します。委託の条件が年度で変わっても、支援は止められません。\n\n## 6 よくある誤解\n\n1. 「通知には従う義務がある」→多くは技術的助言で、命令ではありません。ただし法令の義務、処理基準、補助の要件は別です。\n2. 「異動は2〜3年と決まっている」→法律に周期の定めはなく、町ごとの運用です。\n3. 「行政は緊急でも動けない」→専決処分（議会に代わり町長が決める）や予備費があります。専決処分は「特に緊急を要する」場合などに限られ、次の議会で承認を求めます。\n\n## 7 用語\n\n| 医療側の言い方 | 行政側の言い方 | 意味 |\n| --- | --- | --- |\n| パート・非常勤 | 会計年度任用職員 | 任期が年度内に限られる一般職の職員 |\n| 来年も続ける | 再度の任用 | 翌年度に改めて選考して任用すること |\n| 厚労省の通知 | 技術的助言 | 国の助言。命令ではない |\n| 至急 | 専決処分・予備費の充用 | 議会を待てないときや、予算外の支出の手段 |\n| 町長の了解 | 決裁 | 文書で上司と長の承認を得る手続き |\n\n## 8 深掘りの一次資料\n\n- 法令：地方自治法第179条・第217条・第245条の4・第245条の9・第247条、地方公務員法第22条の2\n- [総務省「会計年度任用職員制度の適正な運用等について」（2025年12月25日）](https://www.soumu.go.jp/main_content/001048563.pdf)\n- [総務省通知「扶養手当及び住居手当の取扱い」（2026年9月28日）](https://www.soumu.go.jp/main_content/001093476.pdf)\n- [厚生労働省「平成28年 福祉事務所人員体制調査について」](https://www.mhlw.go.jp/toukei/list/dl/125-1-01.pdf)\n\n## 9 自分の町で確認すること\n\n1. 担当者の在任年数：人事担当に課ごとの異動記録を聞く\n2. 専門職の人数：町の給与・定員管理の公表資料と人事担当\n3. 4月の異動の影響：各課の引継ぎ書の有無と、前年4〜6月に止まった相談\n\n## 10 自己チェック\n\n1. 技術的助言に従わなかった町は、それを理由に不利益を受けますか？　→いいえ。不利益な扱いは法で禁じられています。\n2. 会計年度任用職員の任期はいつまでですか？　→長くても採用した年度の末日までです。\n3. 議会を待てない支出で確かめる手段は何ですか？　→予備費と専決処分です。予備費は議会が否決した使途には使えません。\n\n## 版と生成の記録\n\n- 版：v0\n- 基準日：2026年11月3日\n- 生成：設計書のP1で下書き（一次資料を確認）\n- 点検：独立レビュー1回を反映（2026年11月3日）。現場の確認は未了\n- 未照合：全国の在任年数（「2〜3年」は一次資料で確認できず）。項目3の「多くの自治体では」の時期（一次資料なし）。地方公務員法は第23条の4まで読み周期の定めなしを確認し、第24条以降は未読。事務処理マニュアル2026年10月版の本文（文字化けで読めず、改訂通知で確認）。生活保護法別表第三の中身。項目2の村の例の時点（資料に記載なし）\n"},{"unit":8,"title":"情報と個人情報","char_count":1982,"items":{"summary":{"text":"本人の同意が原則ですが法令や命の保護の例外があり、町立病院と町の担当課では条文も違います。共有が止まるのは法律の禁止とは限らず、判断者や様式の未整備のこともあります（2026年11月時点）。"},"mechanism":{"figure":null,"flows":[{"who":"病院・診療所","to":"他の医療機関・介護事業者","what":"診療に必要な情報","note":"個人情報保護法第27条。院内掲示で原則「黙示の同意」"},{"who":"病院・診療所","to":"市町村","what":"介護認定の主治医意見書","note":"法令に基づき同意不要"},{"who":"医療・介護の事業者","to":"市町村・ケアマネ（介護支援専門員）","what":"虐待事例の情報","note":"命や身体を守るのに必要で、同意を得にくければ可"},{"who":"ケアマネ","to":"サービス担当者会議（ケアプランの会議）","what":"利用者と家族の情報","note":"運営基準で事前に文書同意"},{"who":"町の担当課","to":"庁内・他の行政機関","what":"保有個人情報","note":"目的外は法第69条の例外。「相当の理由」が要る"},{"who":"町の担当課","to":"民間の病院等","what":"保有個人情報","note":"本人同意、明らかに本人の利益、より厳しい「特別の理由」など"},{"who":"国","to":"市区町村","what":"20業務のシステム標準","note":"国保・介護保険を含み、電子カルテは対象外。移行費は国費"}],"notes":["制度上は、町立の病院・診療所も民間と同じ法第4章で、開示請求などは行政機関と同様です。町の保健・福祉と町営の介護事業（病院の運営分を除く）は第69条です。守秘義務（刑法第134条、地方公務員法第34条など）は別です。","地域ケア会議は法に守秘義務があり、同意なしで出せるかは要確認です。"]},"timeline":{"rows":[{"when":"2023年4月","event":"地方公共団体に法を適用。以前は条例","basis":"制度上は"},{"when":"2025年度末","event":"システム標準化の原則の期限。34,366中10,013（29.1%）は期限後も国が支援","basis":"制度上は"},{"when":"2026年4月から","event":"介護情報基盤（介護情報を共有する国の仕組み）を市町村ごとに開始。2028年4月1日までに全市町村","basis":"制度上は"},{"when":"2026年度冬頃","event":"電子カルテ情報共有サービスの全国運用開始（2026年8月末で33医療機関）","basis":"制度上は国の目標"},{"when":"2028年7月まで","event":"2026年7月公布の改正法の原則の施行期限","basis":"制度上は"}],"notes":["改正法は第27条の命の保護と公衆衛生の例外に「相当の理由」がある場合を加えます。"]},"field_limits":{"status":{"state":"仮"},"points":["法の判断者は「行政機関の長等」ですが、多くの自治体では決裁と記録の手順が未定のことがあります。","担当は少人数で兼務のことがあり、急ぎの照会に答えにくい場合があります。","条例時代の様式や審議会に諮る前例が残ることがあります。","院内掲示と同意様式が施設ごとに違うことがあります。","急変は夜間・休日にも起き、同意や課の判断を待てないことがあります。","漏えいは議会で問われますが、共有しない不利益は見えにくく、止める側に傾きがちです。"]},"perspectives":{"status":{"state":"仮"},"medical":"急変や退院で情報が要るのに「同意がない」と断られると感じます。掲示でどこまで出せるか説明できないこともあります。","admin":"目的外の提供は例外なので、根拠を文書に残せないと動きにくいです。漏えいが起きれば町が説明を求められます。","welfare":"担当者会議には文書同意が要り、同意書のない情報は扱いにくいと感じます。認知症や独居の人では、誰から同意を取るかで止まります。"},"misconceptions":[{"myth":"「同意がなければ一切出せない」","fact":"法令に基づく場合や、命や身体を守るのに必要で同意を得にくい場合は例外です。"},{"myth":"「町立病院は役場と同じルール」","fact":"診療情報は民間病院と同じ第27条で、町の担当課は第69条です。"},{"myth":"「同意は必ず書面」","fact":"医療機関は口頭も認められます。ケアマネの担当者会議は文書です。"}],"terms":[{"medical":"病歴・健診結果","admin":"要配慮個人情報","meaning":"差別につながりやすい情報。取得と第三者提供は原則同意"},{"medical":"掲示で足りる","admin":"黙示の同意","meaning":"掲示に反対がなければ同意と考える。医療に必要な範囲のみ"},{"medical":"他へ渡す","admin":"第三者提供／目的外提供","meaning":"民間側と行政側の言葉。見る条文が違う"},{"medical":"町が持つ情報","admin":"保有個人情報","meaning":"職務で作成・取得し組織で使う個人情報"},{"medical":"法律で出せる","admin":"法令に基づく場合","meaning":"法令の定めによる提供。同意不要"}],"sources":[{"text":"法令：個人情報保護法第27条・第58条・第69条、介護保険法第115条の48、指定居宅介護支援基準第23条"},{"text":"個人情報保護委員会 行政機関等編ガイドライン（2026年7月）","url":"https://www.ppc.go.jp/files/pdf/260731_koutekibumon_guidelines.pdf"},{"text":"同 行政機関等編Q&A（2026年11月）","url":"https://www.ppc.go.jp/files/pdf/261102_koutekibumon_qa.pdf"},{"text":"同 医療・介護ガイダンス（2026年4月）","url":"https://www.ppc.go.jp/files/pdf/260401_iryoukaigo_guidance.pdf"},{"text":"同Q&A（2025年6月）","url":"https://www.ppc.go.jp/files/pdf/02_iryoukaigo_guidance_QA6.pdf"},{"text":"同 令和8年改正法","url":"https://www.ppc.go.jp/personalinfo/legal/r8kaiseihogohou"},{"text":"デジタル庁 自治体システム標準化","url":"https://www.digital.go.jp/policies/local_governments"},{"text":"厚労省 電子カルテ普及計画（2026年9月）","url":"https://www.mhlw.go.jp/content/10808000/001748251.pdf"}],"local_checks":[{"what":"第69条の提供の判断者と記録","where":"個人情報の担当課、施行条例"},{"what":"院内掲示の文言と同意様式","where":"病院の連携室、地域包括支援センター"},{"what":"国保・介護保険の移行状況","where":"情報担当課、総務省の進捗一覧"}],"self_check":[{"question":"町が求める主治医意見書に、患者の同意は要りますか？","answer":"不要です。法令に基づく場合です。"},{"question":"町立病院の紹介状と福祉担当の提供は同じ条文ですか？","answer":"違います。前者は第27条、後者は第69条です。"},{"question":"虐待で同意を得にくいとき、情報を出せますか？","answer":"命や身体、財産の保護に必要なら出せます。虐待の市町村への通報は法で求められ、守秘義務は妨げません。"}]},"record":{"version":"v0","baseline":"2026年11月3日","generated":"設計書のP1で下書き（一次資料を確認）","reviewed":"独立レビュー1回を反映（2026年11月3日）。現場の確認は未了","unverified":"改正法の施行日（2026年11月3日に委員会のページで記載なし）。現行ガイダンスの第三者提供の節と別表2の本文（途中で切れ、Q&Aと2021年の事務連絡で確認）。改正法の附則と第69条の他の改正の有無（施行期限は概要で確認）。行政機関等編Q&AのQ3-3とQ7-1の回答。地域ケア会議で同意なしに出せるかの国の解釈。総務省の標準化の進捗の数値（Excelを読めず）"},"md":"# 単元8 情報と個人情報\n\n## 1 一言で\n\n本人の同意が原則ですが法令や命の保護の例外があり、町立病院と町の担当課では条文も違います。共有が止まるのは法律の禁止とは限らず、判断者や様式の未整備のこともあります（2026年11月時点）。\n\n## 2 仕組みの図\n\n| 誰が | 誰へ | 何を | 補足 |\n| --- | --- | --- | --- |\n| 病院・診療所 | 他の医療機関・介護事業者 | 診療に必要な情報 | 個人情報保護法第27条。院内掲示で原則「黙示の同意」 |\n| 病院・診療所 | 市町村 | 介護認定の主治医意見書 | 法令に基づき同意不要 |\n| 医療・介護の事業者 | 市町村・ケアマネ（介護支援専門員） | 虐待事例の情報 | 命や身体を守るのに必要で、同意を得にくければ可 |\n| ケアマネ | サービス担当者会議（ケアプランの会議） | 利用者と家族の情報 | 運営基準で事前に文書同意 |\n| 町の担当課 | 庁内・他の行政機関 | 保有個人情報 | 目的外は法第69条の例外。「相当の理由」が要る |\n| 町の担当課 | 民間の病院等 | 保有個人情報 | 本人同意、明らかに本人の利益、より厳しい「特別の理由」など |\n| 国 | 市区町村 | 20業務のシステム標準 | 国保・介護保険を含み、電子カルテは対象外。移行費は国費 |\n\n制度上は、町立の病院・診療所も民間と同じ法第4章で、開示請求などは行政機関と同様です。町の保健・福祉と町営の介護事業（病院の運営分を除く）は第69条です。守秘義務（刑法第134条、地方公務員法第34条など）は別です。\n\n地域ケア会議は法に守秘義務があり、同意なしで出せるかは要確認です。\n\n## 3 時間軸\n\n| 時期 | 起きること | 区分 |\n| --- | --- | --- |\n| 2023年4月 | 地方公共団体に法を適用。以前は条例 | 制度上は |\n| 2025年度末 | システム標準化の原則の期限。34,366中10,013（29.1%）は期限後も国が支援 | 制度上は |\n| 2026年4月から | 介護情報基盤（介護情報を共有する国の仕組み）を市町村ごとに開始。2028年4月1日までに全市町村 | 制度上は |\n| 2026年度冬頃 | 電子カルテ情報共有サービスの全国運用開始（2026年8月末で33医療機関） | 制度上は国の目標 |\n| 2028年7月まで | 2026年7月公布の改正法の原則の施行期限 | 制度上は |\n\n改正法は第27条の命の保護と公衆衛生の例外に「相当の理由」がある場合を加えます。\n\n## 4 現場の実情と限界\n\n状態：仮（現場の確認前）\n\n- 法の判断者は「行政機関の長等」ですが、多くの自治体では決裁と記録の手順が未定のことがあります。\n- 担当は少人数で兼務のことがあり、急ぎの照会に答えにくい場合があります。\n- 条例時代の様式や審議会に諮る前例が残ることがあります。\n- 院内掲示と同意様式が施設ごとに違うことがあります。\n- 急変は夜間・休日にも起き、同意や課の判断を待てないことがあります。\n- 漏えいは議会で問われますが、共有しない不利益は見えにくく、止める側に傾きがちです。\n\n## 5 立場で見え方が違うところ\n\n状態：仮（現場の確認前）\n\n- **医療側**：急変や退院で情報が要るのに「同意がない」と断られると感じます。掲示でどこまで出せるか説明できないこともあります。\n- **行政側**：目的外の提供は例外なので、根拠を文書に残せないと動きにくいです。漏えいが起きれば町が説明を求められます。\n- **福祉側**：担当者会議には文書同意が要り、同意書のない情報は扱いにくいと感じます。認知症や独居の人では、誰から同意を取るかで止まります。\n\n## 6 よくある誤解\n\n1. 「同意がなければ一切出せない」→法令に基づく場合や、命や身体を守るのに必要で同意を得にくい場合は例外です。\n2. 「町立病院は役場と同じルール」→診療情報は民間病院と同じ第27条で、町の担当課は第69条です。\n3. 「同意は必ず書面」→医療機関は口頭も認められます。ケアマネの担当者会議は文書です。\n\n## 7 用語\n\n| 医療側の言い方 | 行政側の言い方 | 意味 |\n| --- | --- | --- |\n| 病歴・健診結果 | 要配慮個人情報 | 差別につながりやすい情報。取得と第三者提供は原則同意 |\n| 掲示で足りる | 黙示の同意 | 掲示に反対がなければ同意と考える。医療に必要な範囲のみ |\n| 他へ渡す | 第三者提供／目的外提供 | 民間側と行政側の言葉。見る条文が違う |\n| 町が持つ情報 | 保有個人情報 | 職務で作成・取得し組織で使う個人情報 |\n| 法律で出せる | 法令に基づく場合 | 法令の定めによる提供。同意不要 |\n\n## 8 深掘りの一次資料\n\n- 法令：個人情報保護法第27条・第58条・第69条、介護保険法第115条の48、指定居宅介護支援基準第23条\n- [個人情報保護委員会 行政機関等編ガイドライン（2026年7月）](https://www.ppc.go.jp/files/pdf/260731_koutekibumon_guidelines.pdf)\n- [同 行政機関等編Q&A（2026年11月）](https://www.ppc.go.jp/files/pdf/261102_koutekibumon_qa.pdf)\n- [同 医療・介護ガイダンス（2026年4月）](https://www.ppc.go.jp/files/pdf/260401_iryoukaigo_guidance.pdf)\n- [同Q&A（2025年6月）](https://www.ppc.go.jp/files/pdf/02_iryoukaigo_guidance_QA6.pdf)\n- [同 令和8年改正法](https://www.ppc.go.jp/personalinfo/legal/r8kaiseihogohou)\n- [デジタル庁 自治体システム標準化](https://www.digital.go.jp/policies/local_governments)\n- [厚労省 電子カルテ普及計画（2026年9月）](https://www.mhlw.go.jp/content/10808000/001748251.pdf)\n\n## 9 自分の町で確認すること\n\n1. 第69条の提供の判断者と記録：個人情報の担当課、施行条例\n2. 院内掲示の文言と同意様式：病院の連携室、地域包括支援センター\n3. 国保・介護保険の移行状況：情報担当課、総務省の進捗一覧\n\n## 10 自己チェック\n\n1. 町が求める主治医意見書に、患者の同意は要りますか？　→不要です。法令に基づく場合です。\n2. 町立病院の紹介状と福祉担当の提供は同じ条文ですか？　→違います。前者は第27条、後者は第69条です。\n3. 虐待で同意を得にくいとき、情報を出せますか？　→命や身体、財産の保護に必要なら出せます。虐待の市町村への通報は法で求められ、守秘義務は妨げません。\n\n## 版と生成の記録\n\n- 版：v0\n- 基準日：2026年11月3日\n- 生成：設計書のP1で下書き（一次資料を確認）\n- 点検：独立レビュー1回を反映（2026年11月3日）。現場の確認は未了\n- 未照合：改正法の施行日（2026年11月3日に委員会のページで記載なし）。現行ガイダンスの第三者提供の節と別表2の本文（途中で切れ、Q&Aと2021年の事務連絡で確認）。改正法の附則と第69条の他の改正の有無（施行期限は概要で確認）。行政機関等編Q&AのQ3-3とQ7-1の回答。地域ケア会議で同意なしに出せるかの国の解釈。総務省の標準化の進捗の数値（Excelを読めず）\n"},{"unit":9,"title":"住民と地域","char_count":1968,"items":{"summary":{"text":"自治会は任意の団体、民生委員は無給の委嘱の委員、社協（社会福祉協議会）は民間の団体と立場は別々ですが、多くの自治体で行政と住民の間を担います。担い手は細り、民生委員の充足率は2025年12月の改選で91.7%でした（2026年11月時点）。"},"mechanism":{"figure":null,"flows":[{"who":"住民","to":"町長・議会","what":"選挙、直接請求","note":"正式な代表は選挙で決まる"},{"who":"町長","to":"自治会","what":"認可（法人格）","note":"行政組織の一部にはならない"},{"who":"町","to":"自治会","what":"補助金、広報や推薦の依頼","note":"多くの自治体で。運営費の補助は1,349市区町村（2020年度）"},{"who":"厚生労働大臣","to":"民生委員","what":"委嘱（町の推薦会と知事が推薦）","note":"任期3年、無給。活動費は県が負担し、県の交付税の算定に年60,200円（2024年度）"},{"who":"民生委員","to":"住民","what":"相談、つなぎ","note":"相談・支援は1人年21.6件（2022年度）"},{"who":"町、介護保険など","to":"社協","what":"委託料、補助金、報酬","note":"受託金25.7%、補助金17.6%（2019年度決算、全社協）"},{"who":"町","to":"分野別の窓口","what":"重層的支援体制整備事業","note":"町の任意。相談と地域づくりを束ねる"}],"notes":["民生委員の定数は240,971人、委嘱は220,880人です（2025年12月1日）。定数は県の条例で決まり、国の目安は町村が70〜200世帯に1人、人口10万人未満の市が120〜280世帯に1人です。","自治会等は295,838団体（2023年4月1日）、うち認可は56,078団体（2022年度末）です。加入率は600市区町村の単純平均で78.0%（2010年）から71.7%（2020年）に下がりました。","重層的支援は2026年度に585市町村の予定で、人口1万人未満の市
