w.go.jp/content/11907000/001738882.pdf"},{"text":"厚生労働省「社会福祉法等の一部を改正する法律の公布について」","url":"https://www.mhlw.go.jp/content/001715668.pdf"}],"local_checks":[{"what":"自治会の数と加入率","where":"自治会の担当課か連合会"},{"what":"民生委員の定数と充足","where":"福祉担当課"},{"what":"社協の事業と町の委託・補助の額","where":"社協の事業報告、町の予算書"}],"self_check":[{"question":"自治会が認可を受けると、町の組織の一部になりますか？","answer":"いいえ。行政組織の一部にはなりません。"},{"question":"民生委員を委嘱するのは誰で、任期は何年ですか？","answer":"厚生労働大臣で、任期は3年です。"},{"question":"重層的支援体制整備事業は全市町村の義務ですか？","answer":"いいえ。市町村の任意です。"}]},"record":{"version":"v0","baseline":"2026年11月3日","generated":"設計書のP1で下書き（一次資料を確認）","reviewed":"独立レビュー1回を反映（2026年11月3日）。現場の確認は未了","unverified":"町村と市に分けた最新の充足率と加入率。項目3の「多くの自治体では」の時期。民生委員の活動費の2025年度以降の額。住民自治の言い換えは一般的な説明で、総務省資料に定義なし。2026年度の重層的支援の実施数は資料で585と586に分かれ、新しい資料の585を採った。次回改選の2028年は任期からの計算"},"md":"# 単元9 住民と地域\n\n## 1 一言で\n\n自治会は任意の団体、民生委員は無給の委嘱の委員、社協（社会福祉協議会）は民間の団体と立場は別々ですが、多くの自治体で行政と住民の間を担います。担い手は細り、民生委員の充足率は2025年12月の改選で91.7%でした（2026年11月時点）。\n\n## 2 仕組みの図\n\n| 誰が | 誰へ | 何を | 補足 |\n| --- | --- | --- | --- |\n| 住民 | 町長・議会 | 選挙、直接請求 | 正式な代表は選挙で決まる |\n| 町長 | 自治会 | 認可（法人格） | 行政組織の一部にはならない |\n| 町 | 自治会 | 補助金、広報や推薦の依頼 | 多くの自治体で。運営費の補助は1,349市区町村（2020年度） |\n| 厚生労働大臣 | 民生委員 | 委嘱（町の推薦会と知事が推薦） | 任期3年、無給。活動費は県が負担し、県の交付税の算定に年60,200円（2024年度） |\n| 民生委員 | 住民 | 相談、つなぎ | 相談・支援は1人年21.6件（2022年度） |\n| 町、介護保険など | 社協 | 委託料、補助金、報酬 | 受託金25.7%、補助金17.6%（2019年度決算、全社協） |\n| 町 | 分野別の窓口 | 重層的支援体制整備事業 | 町の任意。相談と地域づくりを束ねる |\n\n民生委員の定数は240,971人、委嘱は220,880人です（2025年12月1日）。定数は県の条例で決まり、国の目安は町村が70〜200世帯に1人、人口10万人未満の市が120〜280世帯に1人です。\n\n自治会等は295,838団体（2023年4月1日）、うち認可は56,078団体（2022年度末）です。加入率は600市区町村の単純平均で78.0%（2010年）から71.7%（2020年）に下がりました。\n\n重層的支援は2026年度に585市町村の予定で、人口1万人未満の市町村では実施率10.7%です。\n\n## 3 時間軸\n\n| 時期 | 起きること | 区分 |\n| --- | --- | --- |\n| 毎月 | 広報紙の配布、民生委員の定例会 | 多くの自治体では（要確認） |\n| 秋〜3月 | 委託や補助が町の予算に載る | 多くの自治体では（単元2） |\n| 案ができた後 | 説明会と意見公募 | 多くの自治体では |\n| 改選の前 | 自治会などに候補の推薦を頼む | 多くの自治体では |\n| 3年ごとの12月1日 | 民生委員の一斉改選。次は2028年の見込み | 制度上は任期3年 |\n| 2027年4月1日 | 小規模市町村向けの新事業を実施できる | 制度上は（改正社会福祉法） |\n\n## 4 現場の実情と限界\n\n状態：仮（現場の確認前）\n\n- 民生委員の平均年齢は66歳、60歳以上が8割超です（2022年）。候補探しは自治会に頼むことが多く、他の委員の推薦も同じ役員に重なります。\n- 説明会は案が固まってから開かれやすく、住民は今の困りごとを持ってきます。「説明」と「相談」がすれ違います。\n- 自治会長の了解を住民の了解と見なすと、未加入世帯の声が抜けます。\n- 依頼や補助の見直しは反発を招きやすく、議会でも問われ、前例が続きがちです。\n- 社協は町の受託先でもあり、意見を言いにくい場面があります。\n\n## 5 立場で見え方が違うところ\n\n状態：仮（現場の確認前）\n\n- **医療側**：退院後の見守りを民生委員や自治会に頼めないかと考えます。誰に連絡し、どこまで頼めるかが見えにくいと感じます。\n- **行政側**：自治会と民生委員は地域を知る窓口で、広報や推薦を頼む先です。民間の活動には指示できず、特定の地区の優遇も避けたいと考えます。\n- **福祉側**：民生委員と社協は相談の入口で、見守りの土台だと考えます。無給の人に役割が集まり、なり手の減少を心配します。\n\n## 6 よくある誤解\n\n1. 「自治会は町の下部組織だ」→任意の団体です。町長の認可を受けても、行政組織の一部にはなりません。\n2. 「民生委員は町の職員だ」→県の特別職の地方公務員とされ、委嘱は大臣、指揮監督は知事です。\n3. 「社協は役所の一部だ」→社会福祉法に定めのある民間の団体です。\n\n## 7 用語\n\n| 医療側の言い方 | 行政側の言い方 | 意味 |\n| --- | --- | --- |\n| 住民の声 | 住民自治 | 地域のことを住民の意思で決める考え方 |\n| 町内会、区 | 地縁による団体 | 区域の住民の団体。認可で法人格を持つと認可地縁団体 |\n| 民生委員さん | 民生委員・児童委員 | 町ごとに置かれ、相談に応じる無給の委員 |\n| 社協 | 市町村社会福祉協議会 | 地域福祉を進める民間の団体 |\n| 意見を聞く会 | 住民説明会、意見公募 | 意見公募は行政手続法の対象外で、町の条例などによる |\n\n## 8 深掘りの一次資料\n\n- 法令：地方自治法第260条の2、民生委員法、社会福祉法第106条の4・第109条、行政手続法第3条第3項\n- [厚生労働省「民生委員・児童委員の一斉改選結果」（2026年1月）](https://www.mhlw.go.jp/stf/newpage_68263.html)\n- [厚生労働省「民生委員・児童委員制度の最近の動向」（2024年6月）](https://www.mhlw.go.jp/content/12000000/001268717.pdf)\n- [総務省「地域コミュニティに関する研究会 報告書」（2022年4月）](https://www.soumu.go.jp/main_content/000819371.pdf)\n- [厚生労働省「地域共生社会の実現に向けた包括的な支援体制の整備について」](https://www.mhlw.go.jp/content/11907000/001738882.pdf)\n- [厚生労働省「社会福祉法等の一部を改正する法律の公布について」](https://www.mhlw.go.jp/content/001715668.pdf)\n\n## 9 自分の町で確認すること\n\n1. 自治会の数と加入率：自治会の担当課か連合会\n2. 民生委員の定数と充足：福祉担当課\n3. 社協の事業と町の委託・補助の額：社協の事業報告、町の予算書\n\n## 10 自己チェック\n\n1. 自治会が認可を受けると、町の組織の一部になりますか？　→いいえ。行政組織の一部にはなりません。\n2. 民生委員を委嘱するのは誰で、任期は何年ですか？　→厚生労働大臣で、任期は3年です。\n3. 重層的支援体制整備事業は全市町村の義務ですか？　→いいえ。市町村の任意です。\n\n## 版と生成の記録\n\n- 版：v0\n- 基準日：2026年11月3日\n- 生成：設計書のP1で下書き（一次資料を確認）\n- 点検：独立レビュー1回を反映（2026年11月3日）。現場の確認は未了\n- 未照合：町村と市に分けた最新の充足率と加入率。項目3の「多くの自治体では」の時期。民生委員の活動費の2025年度以降の額。住民自治の言い換えは一般的な説明で、総務省資料に定義なし。2026年度の重層的支援の実施数は資料で585と586に分かれ、新しい資料の585を採った。次回改選の2028年は任期からの計算\n"},{"unit":10,"title":"地域経済","char_count":1983,"items":{"summary":{"text":"医療・福祉は全国の就業者の約14%を占める地域経済の一部で、小さな町では病院や介護事業所が大きな雇用の場になることがあります。ただし公立病院は法人税も固定資産税も負担せず、町の税収には主に町内に住む職員の個人住民税を通して効きます（2026年11月時点）。"},"mechanism":{"figure":null,"flows":[{"who":"保険者・国・患者","to":"病院・介護事業所","what":"診療報酬・介護報酬","note":"町の国保以外からも入る"},{"who":"病院・事業所","to":"職員・業者","what":"給与、薬や機器の代金","note":"町外の職員や業者の分は外へ出る"},{"who":"職員","to":"住所のある市町村","what":"個人住民税","note":"勤務先でなく1月1日の住所地へ"},{"who":"民間の病院・企業","to":"所在地の市町村","what":"固定資産税・法人住民税","note":"公立病院は負担しない（民間運営の指定管理は要確認）。農協系の厚生連などにも非課税の規定あり"},{"who":"国","to":"町","what":"地域おこし協力隊の特別交付税","note":"活動費は1人550万円が上限（2026年度）。活動はおおむね1〜3年、特例で最大5年"},{"who":"県・市町村","to":"移住者","what":"移住支援金","note":"東京23区からなど。世帯100万円以内、18歳未満の子1人につき最大100万円を加算（2026年11月）"},{"who":"事業所","to":"従業員","what":"職場の健康管理","note":"50人未満もストレスチェックが2028年4月から義務"}],"notes":["就業者6,828万人のうち医療・福祉は947万人で、産業別で3番目です（2025年平均）。","市町村税の内訳は固定資産税42.1%、個人住民税35.0%、法人分9.8%です（2024年度の全国計）。人口1万人未満の町村の歳入は地方税13.0%、交付税37.1%です（2018年度。最新値は要確認）。交付税の算定人口は2026年度に2025年国勢調査の速報値へ替わり、急減団体には緩和措置があります。人口5千人未満の市区町村は2050年に27.9%の見通しです（2020年16.4%、2023年推計）。","地域経済循環率（環境省のツール）は町で生んだ付加価値÷住民の所得で、1未満なら外からの所得に支えられています。2024年度までの5年間に任期を終えた協力隊の57.5%が同じ市町村に定住しました。"]},"timeline":{"rows":[{"when":"1月1日","event":"個人住民税の納め先と固定資産税の課税が決まる","basis":"制度上は"},{"when":"6月〜翌年5月","event":"給与から住民税を天引きし、住所地へ納める","basis":"制度上は"},{"when":"秋〜3月","event":"繰出や移住定住策の予算を組む（単元2で扱う）","basis":"多くの自治体では"},{"when":"5年ごと","event":"国勢調査で町の人口と産業別の就業者が更新される","basis":"制度上は"},{"when":"2027年3月・5月まで","event":"2025年国勢調査の就業の結果、次に働く場所別の結果が出る","basis":"制度上は公表予定"}],"notes":[]},"field_limits":{"status":{"state":"仮"},"points":["病院の議論は繰出と赤字に集まりやすく、雇用や所得の数字は載りにくいようです。経営強化プランの必須項目にも雇用や地域経済はありません。","職員の町内居住率や町内調達額は公表統計になく、病院が数えないと分かりません。","病院と産業・移住の担当課が別で、同じ資料を見る場が少ない町があります。","循環分析は読み解く人手が要り、使われないことがあります。","議会で雇用を理由にすると、赤字の先送りと受け取られることがあります。"]},"perspectives":{"status":{"state":"仮"},"medical":"病院は町の雇用の場だと考えます。ところが経営の話では、人件費は削る対象と語られると感じます。","admin":"雇用は大事ですが、繰出は他の事業と同じ財布から出ます。公立病院は法人税や固定資産税を負担せず、効果の説明には職員の住所や町内の購入額が要ります。","welfare":"介護事業所も雇用の場なのに、病院ほど語られないと感じます。少ない働き手を病院と取り合い、待遇の差が存続に響きます。"},"misconceptions":[{"myth":"「公立病院は町に多くの税を納めている」","fact":"法人税も固定資産税も負担しません。効くのは主に職員の個人住民税です。"},{"myth":"「病院は必ず町で最大の雇用主だ」","fact":"町ごとに違います。職員数と町で働く人の数で確かめます。"},{"myth":"「雇用があるから赤字でも町の得だ」","fact":"職員の住所や調達先で町に残る額は変わります。雇用の効果と繰出の負担は分けて数えます。"}],"terms":[{"medical":"人件費","admin":"雇用者所得","meaning":"同じ給与を費用と見るか、地域の所得と見るか"},{"medical":"町内在住の職員","admin":"個人住民税の納税義務者","meaning":"1月1日に町に住民票がある人"},{"medical":"診療報酬の収入","admin":"域外からの所得","meaning":"町の外から入るお金"},{"medical":"薬代・外注費","admin":"域外流出","meaning":"町の外へ出るお金"},{"medical":"働き手不足","admin":"生産年齢人口の減少","meaning":"15〜64歳の人口が減ること"}],"sources":[{"text":"法令：地方税法第294条・第296条・第348条、法人税法第4条"},{"text":"労働力調査 2025年平均","url":"https://www.stat.go.jp/data/roudou/sokuhou/nen/ft/pdf/gaiyou.pdf"},{"text":"令和8年版 地方財政白書","url":"https://www.soumu.go.jp/menu_seisaku/hakusyo/chihou/r08data/2026data/r08czb01-03.html"},{"text":"環境省 地域経済循環分析","url":"https://chiikijunkan.env.go.jp/assets/pdf/manabu/bunseki/kakunen-tebiki-kihon-Ver.9.0.pdf"},{"text":"総務省 地域おこし協力隊","url":"https://www.soumu.go.jp/main_content/001092493.pdf"}],"local_checks":[{"what":"病院の職員数と町内に住む割合","where":"事務長に聞く"},{"what":"町で働く人の数と産業別の内訳","where":"国勢調査の従業地（働く場所）別集計（e-Stat）"},{"what":"町税の推移と内訳","where":"決算カード、財政状況資料集（総務省）"}],"self_check":[{"question":"公立病院は町に固定資産税を納めますか？","answer":"いいえ。市町村や一部事務組合には課税できません。"},{"question":"隣町に住む病院職員の個人住民税はどこに入りますか？","answer":"1月1日に住所のある隣町です。"},{"question":"町で働く人の数は国勢調査のどの数字で見ますか？","answer":"働く場所で数える従業地の数字です。"}]},"record":{"version":"v0","baseline":"2026年11月3日","generated":"設計書のP1で下書き（一次資料を確認）","reviewed":"独立レビュー1回を反映（2026年11月3日）。現場の確認は未了","unverified":"地方税法第294条・第318条・第359条のe-Gov条文（税研の条文ページで確認。第348条・第296条と法人税法第4条はレビューでe-Govを確認済み）。指定管理の病院の課税。町村の規模別の歳入構成の最新値。小さな町で医療・福祉が占める割合"},"md":"# 単元10 地域経済\n\n## 1 一言で\n\n医療・福祉は全国の就業者の約14%を占める地域経済の一部で、小さな町では病院や介護事業所が大きな雇用の場になることがあります。ただし公立病院は法人税も固定資産税も負担せず、町の税収には主に町内に住む職員の個人住民税を通して効きます（2026年11月時点）。\n\n## 2 仕組みの図\n\n| 誰が | 誰へ | 何を | 補足 |\n| --- | --- | --- | --- |\n| 保険者・国・患者 | 病院・介護事業所 | 診療報酬・介護報酬 | 町の国保以外からも入る |\n| 病院・事業所 | 職員・業者 | 給与、薬や機器の代金 | 町外の職員や業者の分は外へ出る |\n| 職員 | 住所のある市町村 | 個人住民税 | 勤務先でなく1月1日の住所地へ |\n| 民間の病院・企業 | 所在地の市町村 | 固定資産税・法人住民税 | 公立病院は負担しない（民間運営の指定管理は要確認）。農協系の厚生連などにも非課税の規定あり |\n| 国 | 町 | 地域おこし協力隊の特別交付税 | 活動費は1人550万円が上限（2026年度）。活動はおおむね1〜3年、特例で最大5年 |\n| 県・市町村 | 移住者 | 移住支援金 | 東京23区からなど。世帯100万円以内、18歳未満の子1人につき最大100万円を加算（2026年11月） |\n| 事業所 | 従業員 | 職場の健康管理 | 50人未満もストレスチェックが2028年4月から義務 |\n\n就業者6,828万人のうち医療・福祉は947万人で、産業別で3番目です（2025年平均）。\n\n市町村税の内訳は固定資産税42.1%、個人住民税35.0%、法人分9.8%です（2024年度の全国計）。人口1万人未満の町村の歳入は地方税13.0%、交付税37.1%です（2018年度。最新値は要確認）。交付税の算定人口は2026年度に2025年国勢調査の速報値へ替わり、急減団体には緩和措置があります。人口5千人未満の市区町村は2050年に27.9%の見通しです（2020年16.4%、2023年推計）。\n\n地域経済循環率（環境省のツール）は町で生んだ付加価値÷住民の所得で、1未満なら外からの所得に支えられています。2024年度までの5年間に任期を終えた協力隊の57.5%が同じ市町村に定住しました。\n\n## 3 時間軸\n\n| 時期 | 起きること | 区分 |\n| --- | --- | --- |\n| 1月1日 | 個人住民税の納め先と固定資産税の課税が決まる | 制度上は |\n| 6月〜翌年5月 | 給与から住民税を天引きし、住所地へ納める | 制度上は |\n| 秋〜3月 | 繰出や移住定住策の予算を組む（単元2で扱う） | 多くの自治体では |\n| 5年ごと | 国勢調査で町の人口と産業別の就業者が更新される | 制度上は |\n| 2027年3月・5月まで | 2025年国勢調査の就業の結果、次に働く場所別の結果が出る | 制度上は公表予定 |\n\n## 4 現場の実情と限界\n\n状態：仮（現場の確認前）\n\n- 病院の議論は繰出と赤字に集まりやすく、雇用や所得の数字は載りにくいようです。経営強化プランの必須項目にも雇用や地域経済はありません。\n- 職員の町内居住率や町内調達額は公表統計になく、病院が数えないと分かりません。\n- 病院と産業・移住の担当課が別で、同じ資料を見る場が少ない町があります。\n- 循環分析は読み解く人手が要り、使われないことがあります。\n- 議会で雇用を理由にすると、赤字の先送りと受け取られることがあります。\n\n## 5 立場で見え方が違うところ\n\n状態：仮（現場の確認前）\n\n- **医療側**：病院は町の雇用の場だと考えます。ところが経営の話では、人件費は削る対象と語られると感じます。\n- **行政側**：雇用は大事ですが、繰出は他の事業と同じ財布から出ます。公立病院は法人税や固定資産税を負担せず、効果の説明には職員の住所や町内の購入額が要ります。\n- **福祉側**：介護事業所も雇用の場なのに、病院ほど語られないと感じます。少ない働き手を病院と取り合い、待遇の差が存続に響きます。\n\n## 6 よくある誤解\n\n1. 「公立病院は町に多くの税を納めている」→法人税も固定資産税も負担しません。効くのは主に職員の個人住民税です。\n2. 「病院は必ず町で最大の雇用主だ」→町ごとに違います。職員数と町で働く人の数で確かめます。\n3. 「雇用があるから赤字でも町の得だ」→職員の住所や調達先で町に残る額は変わります。雇用の効果と繰出の負担は分けて数えます。\n\n## 7 用語\n\n| 医療側の言い方 | 行政側の言い方 | 意味 |\n| --- | --- | --- |\n| 人件費 | 雇用者所得 | 同じ給与を費用と見るか、地域の所得と見るか |\n| 町内在住の職員 | 個人住民税の納税義務者 | 1月1日に町に住民票がある人 |\n| 診療報酬の収入 | 域外からの所得 | 町の外から入るお金 |\n| 薬代・外注費 | 域外流出 | 町の外へ出るお金 |\n| 働き手不足 | 生産年齢人口の減少 | 15〜64歳の人口が減ること |\n\n## 8 深掘りの一次資料\n\n- 法令：地方税法第294条・第296条・第348条、法人税法第4条\n- [労働力調査 2025年平均](https://www.stat.go.jp/data/roudou/sokuhou/nen/ft/pdf/gaiyou.pdf)\n- [令和8年版 地方財政白書](https://www.soumu.go.jp/menu_seisaku/hakusyo/chihou/r08data/2026data/r08czb01-03.html)\n- [環境省 地域経済循環分析](https://chiikijunkan.env.go.jp/assets/pdf/manabu/bunseki/kakunen-tebiki-kihon-Ver.9.0.pdf)\n- [総務省 地域おこし協力隊](https://www.soumu.go.jp/main_content/001092493.pdf)\n\n## 9 自分の町で確認すること\n\n1. 病院の職員数と町内に住む割合：事務長に聞く\n2. 町で働く人の数と産業別の内訳：国勢調査の従業地（働く場所）別集計（e-Stat）\n3. 町税の推移と内訳：決算カード、財政状況資料集（総務省）\n\n## 10 自己チェック\n\n1. 公立病院は町に固定資産税を納めますか？　→いいえ。市町村や一部事務組合には課税できません。\n2. 隣町に住む病院職員の個人住民税はどこに入りますか？　→1月1日に住所のある隣町です。\n3. 町で働く人の数は国勢調査のどの数字で見ますか？　→働く場所で数える従業地の数字です。\n\n## 版と生成の記録\n\n- 版：v0\n- 基準日：2026年11月3日\n- 生成：設計書のP1で下書き（一次資料を確認）\n- 点検：独立レビュー1回を反映（2026年11月3日）。現場の確認は未了\n- 未照合：地方税法第294条・第318条・第359条のe-Gov条文（税研の条文ページで確認。第348条・第296条と法人税法第4条はレビューでe-Govを確認済み）。指定管理の病院の課税。町村の規模別の歳入構成の最新値。小さな町で医療・福祉が占める割合\n"},{"unit":11,"title":"垣根：なぜ話せないか","char_count":1991,"items":{"summary":{"text":"医療・介護・福祉・保健・財政は、財源、法律、所管、言葉、時間軸、評価指標が別です。越境の場（分野をまたぐ会議）は既にありますが、予算の権限はなく、参加が薄い側も場で違います（2026年11月時点）。"},"mechanism":{"figure":null,"flows":[{"who":"医療","to":"患者","what":"診療報酬／医療法など／国と県","note":"病床、収支"},{"who":"介護","to":"要介護者など","what":"保険料と公費／介護保険法／市町村","note":"給付費、保険料"},{"who":"福祉","to":"障害者、生活困窮者","what":"公費／障害者総合支援法、生活保護法／市町村。福祉事務所は市は必ず置き、町村は任意（置かなければ県）","note":"利用者数、保護率"},{"who":"保健","to":"住民","what":"一般会計など／健康増進法、地域保健法／町の保健センター、県と一部の市の保健所","note":"健診受診率"},{"who":"国保","to":"加入者","what":"保険料と公費／国民健康保険法／県と市町村","note":"保険料の水準"},{"who":"財政","to":"町全体","what":"町税、交付税／地方自治法／財政担当","note":"収支、基金"}],"notes":["「何を」は財源／法律／所管の順です。「補足」は評価指標で、多くの自治体での例です。各制度は単元2〜5、場の使い方は単元12で扱います。","場は主に四つです（制度上は。障害分野は別に自立支援協議会）。地域ケア会議（介護保険法、市町村の努力義務）は、個別会議は主に地域包括支援センター（高齢者の相談窓口）、推進会議は市町村か地域包括が開きます。在宅医療・介護連携推進事業（同法）は市町村が会議などを開き、医師会への委託例があります。地域医療構想調整会議（医療法）は県が開きます。国保運営協議会（国民健康保険法）は市町村と県に置きます。","2023年度の調査に答えた外来施設で、かかりつけ機能の報酬（地域包括診療料・加算）の届出あり／なしの参加は、地域ケア会議45.5%／25.2%、在宅の連携事業43.3%／27.5%です。主治医意見書の作成は98.4%／96.1%でした。"]},"timeline":{"rows":[{"when":"秋","event":"翌年度の予算要求。予算は単年度","basis":"多くの自治体では"},{"when":"2年ごと","event":"診療報酬の改定。直近は2026年6月施行","basis":"制度上は国が決める（2年ごとは慣行）"},{"when":"3年ごと","event":"介護保険事業計画。第10期は2027年4月から","basis":"制度上は"},{"when":"6年ごと","event":"医療計画。第8次は2029年度まで","basis":"制度上は"},{"when":"2027年4月","event":"調整会議の関係者に市町村等を追加","basis":"制度上は"}],"notes":["二つの計画の始まりがそろうのは6年に1度で、今の周期なら次は2030年度です。"]},"field_limits":{"status":{"state":"仮"},"points":["地域ケア会議の開催は97.3%の市町村（2017年度）ですが、推進会議で政策形成に取り組めていない市町村が6割以上でした（2019年度、1,230市町村の調査）。前年どおりの報告で終わる場もありそうです。","開業医は平日昼の会議に出にくいことがあります。","小さな町村では、同じ担当者や医師がいくつもの場を兼ねがちです。","予算要求に遅れると実施は補正か翌年度以降で、議会への説明も要ります。","調整会議の区域は町より広く、町村の声は届きにくいかもしれません。"]},"perspectives":{"status":{"state":"仮"},"medical":"診療を止めて出ても、報告を聞いて終わると感じます。決められない場なら書類で足りると考えがちです。","admin":"場を用意しても医師が来ないと感じます。個別の要望は公平性と予算の手順を通さないと動かせません。","welfare":"医師には聞きにくく、退院の方針は間際に知らされると感じます。保険料や人手を思うと、新しい役割は受けにくいと考えます。"},"misconceptions":[{"myth":"「話せないのは相手の姿勢の問題」","fact":"財源、法律、所管が別で、同じ言葉でも前提が違います。"},{"myth":"「どの場でも医師が来ない」","fact":"場で違います。国保運営協議会には保険医などの代表が入ります。低さが数字で見えるのは地域ケア会議などです。"},{"myth":"「場で合意すれば実現する」","fact":"予算は首長が作り、議会が議決します。"}],"terms":[{"medical":"患者","admin":"被保険者、住民、利用者","meaning":"同じ人の制度ごとの呼び名"},{"medical":"地域","admin":"構想区域、日常生活圏域","meaning":"医療は県、介護は市町村が決める区域"},{"medical":"カンファレンス","admin":"地域ケア個別会議","meaning":"一人の事例を多職種で検討する会議"},{"medical":"地域の連携会議","admin":"地域ケア推進会議","meaning":"地域の課題を施策につなげる会議"},{"medical":"調整会議","admin":"協議の場","meaning":"医療の役割分担を話す県の会議"}],"sources":[{"text":"法令：介護保険法第115条の45・第115条の48、医療法第30条の14、国民健康保険法第11条、地方自治法第96条・第149条"},{"text":"厚労省 医療法等改正法の公布通知（2025年12月）","url":"https://www.mhlw.go.jp/web/t_doc?dataId=00tc9622&dataType=1&pageNo=1"},{"text":"厚労省「在宅医療・介護連携推進事業の手引き Ver.3」（2020年9月）","url":"https://www.mhlw.go.jp/content/001494546.pdf"},{"text":"介護保険部会「地域支援事業等の更なる推進」（2019年10月）","url":"https://www.mhlw.go.jp/content/12300000/000555623.pdf"},{"text":"中医協「個別事項（その3）」（2023年10月）","url":"https://www.mhlw.go.jp/content/12404000/001158841.pdf"},{"text":"厚労省「国民健康保険運営協議会について」（2016年1月）","url":"https://www.mhlw.go.jp/web/t_doc?dataId=00tc1877&dataType=1&pageNo=1"}],"local_checks":[{"what":"越境の場の一覧と開催回数","where":"介護保険、国保、県の医療の各担当"},{"what":"自分や自院が出ている場と代表者","where":"委員名簿と議事録"},{"what":"場の結論が予算や計画に載った例","where":"介護保険事業計画、予算書、財政担当"}],"self_check":[{"question":"地域医療構想調整会議を開くのは誰ですか？","answer":"県です。"},{"question":"調整会議の関係者に市町村等が法律で加わるのはいつですか？","answer":"2027年4月からです。"},{"question":"場の結論を実現するのに、秋までに何が要りますか？","answer":"翌年度の予算要求です。"}]},"record":{"version":"v0","baseline":"2026年11月3日","generated":"設計書のP1で下書き（一次資料を確認）","reviewed":"独立レビュー1回を反映（2026年11月3日）。現場の確認は未了","unverified":"調整会議と国保運営協議会の医療側の出席実態。保健の財源の内訳。項目2の評価指標は例で一次資料なし"},"md":"# 単元11 垣根：なぜ話せないか\n\n## 1 一言で\n\n医療・介護・福祉・保健・財政は、財源、法律、所管、言葉、時間軸、評価指標が別です。越境の場（分野をまたぐ会議）は既にありますが、予算の権限はなく、参加が薄い側も場で違います（2026年11月時点）。\n\n## 2 仕組みの図\n\n| 誰が | 誰へ | 何を | 補足 |\n| --- | --- | --- | --- |\n| 医療 | 患者 | 診療報酬／医療法など／国と県 | 病床、収支 |\n| 介護 | 要介護者など | 保険料と公費／介護保険法／市町村 | 給付費、保険料 |\n| 福祉 | 障害者、生活困窮者 | 公費／障害者総合支援法、生活保護法／市町村。福祉事務所は市は必ず置き、町村は任意（置かなければ県） | 利用者数、保護率 |\n| 保健 | 住民 | 一般会計など／健康増進法、地域保健法／町の保健センター、県と一部の市の保健所 | 健診受診率 |\n| 国保 | 加入者 | 保険料と公費／国民健康保険法／県と市町村 | 保険料の水準 |\n| 財政 | 町全体 | 町税、交付税／地方自治法／財政担当 | 収支、基金 |\n\n「何を」は財源／法律／所管の順です。「補足」は評価指標で、多くの自治体での例です。各制度は単元2〜5、場の使い方は単元12で扱います。\n\n場は主に四つです（制度上は。障害分野は別に自立支援協議会）。地域ケア会議（介護保険法、市町村の努力義務）は、個別会議は主に地域包括支援センター（高齢者の相談窓口）、推進会議は市町村か地域包括が開きます。在宅医療・介護連携推進事業（同法）は市町村が会議などを開き、医師会への委託例があります。地域医療構想調整会議（医療法）は県が開きます。国保運営協議会（国民健康保険法）は市町村と県に置きます。\n\n2023年度の調査に答えた外来施設で、かかりつけ機能の報酬（地域包括診療料・加算）の届出あり／なしの参加は、地域ケア会議45.5%／25.2%、在宅の連携事業43.3%／27.5%です。主治医意見書の作成は98.4%／96.1%でした。\n\n## 3 時間軸\n\n| 時期 | 起きること | 区分 |\n| --- | --- | --- |\n| 秋 | 翌年度の予算要求。予算は単年度 | 多くの自治体では |\n| 2年ごと | 診療報酬の改定。直近は2026年6月施行 | 制度上は国が決める（2年ごとは慣行） |\n| 3年ごと | 介護保険事業計画。第10期は2027年4月から | 制度上は |\n| 6年ごと | 医療計画。第8次は2029年度まで | 制度上は |\n| 2027年4月 | 調整会議の関係者に市町村等を追加 | 制度上は |\n\n二つの計画の始まりがそろうのは6年に1度で、今の周期なら次は2030年度です。\n\n## 4 現場の実情と限界\n\n状態：仮（現場の確認前）\n\n- 地域ケア会議の開催は97.3%の市町村（2017年度）ですが、推進会議で政策形成に取り組めていない市町村が6割以上でした（2019年度、1,230市町村の調査）。前年どおりの報告で終わる場もありそうです。\n- 開業医は平日昼の会議に出にくいことがあります。\n- 小さな町村では、同じ担当者や医師がいくつもの場を兼ねがちです。\n- 予算要求に遅れると実施は補正か翌年度以降で、議会への説明も要ります。\n- 調整会議の区域は町より広く、町村の声は届きにくいかもしれません。\n\n## 5 立場で見え方が違うところ\n\n状態：仮（現場の確認前）\n\n- **医療側**：診療を止めて出ても、報告を聞いて終わると感じます。決められない場なら書類で足りると考えがちです。\n- **行政側**：場を用意しても医師が来ないと感じます。個別の要望は公平性と予算の手順を通さないと動かせません。\n- **福祉側**：医師には聞きにくく、退院の方針は間際に知らされると感じます。保険料や人手を思うと、新しい役割は受けにくいと考えます。\n\n## 6 よくある誤解\n\n1. 「話せないのは相手の姿勢の問題」→財源、法律、所管が別で、同じ言葉でも前提が違います。\n2. 「どの場でも医師が来ない」→場で違います。国保運営協議会には保険医などの代表が入ります。低さが数字で見えるのは地域ケア会議などです。\n3. 「場で合意すれば実現する」→予算は首長が作り、議会が議決します。\n\n## 7 用語\n\n| 医療側の言い方 | 行政側の言い方 | 意味 |\n| --- | --- | --- |\n| 患者 | 被保険者、住民、利用者 | 同じ人の制度ごとの呼び名 |\n| 地域 | 構想区域、日常生活圏域 | 医療は県、介護は市町村が決める区域 |\n| カンファレンス | 地域ケア個別会議 | 一人の事例を多職種で検討する会議 |\n| 地域の連携会議 | 地域ケア推進会議 | 地域の課題を施策につなげる会議 |\n| 調整会議 | 協議の場 | 医療の役割分担を話す県の会議 |\n\n## 8 深掘りの一次資料\n\n- 法令：介護保険法第115条の45・第115条の48、医療法第30条の14、国民健康保険法第11条、地方自治法第96条・第149条\n- [厚労省 医療法等改正法の公布通知（2025年12月）](https://www.mhlw.go.jp/web/t_doc?dataId=00tc9622&dataType=1&pageNo=1)\n- [厚労省「在宅医療・介護連携推進事業の手引き Ver.3」（2020年9月）](https://www.mhlw.go.jp/content/001494546.pdf)\n- [介護保険部会「地域支援事業等の更なる推進」（2019年10月）](https://www.mhlw.go.jp/content/12300000/000555623.pdf)\n- [中医協「個別事項（その3）」（2023年10月）](https://www.mhlw.go.jp/content/12404000/001158841.pdf)\n- [厚労省「国民健康保険運営協議会について」（2016年1月）](https://www.mhlw.go.jp/web/t_doc?dataId=00tc1877&dataType=1&pageNo=1)\n\n## 9 自分の町で確認すること\n\n1. 越境の場の一覧と開催回数：介護保険、国保、県の医療の各担当\n2. 自分や自院が出ている場と代表者：委員名簿と議事録\n3. 場の結論が予算や計画に載った例：介護保険事業計画、予算書、財政担当\n\n## 10 自己チェック\n\n1. 地域医療構想調整会議を開くのは誰ですか？　→県です。\n2. 調整会議の関係者に市町村等が法律で加わるのはいつですか？　→2027年4月からです。\n3. 場の結論を実現するのに、秋までに何が要りますか？　→翌年度の予算要求です。\n\n## 版と生成の記録\n\n- 版：v0\n- 基準日：2026年11月3日\n- 生成：設計書のP1で下書き（一次資料を確認）\n- 点検：独立レビュー1回を反映（2026年11月3日）。現場の確認は未了\n- 未照合：調整会議と国保運営協議会の医療側の出席実態。保健の財源の内訳。項目2の評価指標は例で一次資料なし\n"},{"unit":12,"title":"同じテーブルに着く","char_count":1967,"items":{"summary":{"text":"医療・福祉・行政・住民が同じ机で話すには、共通の言葉、相手の制約、同じ資料、訳す人、小さな実例の5つを揃えます。話す場は制度にありますが、訳す役は法律上の役職ではありません（2026年11月時点）。"},"mechanism":{"figure":null,"flows":[{"who":"市町村","to":"医療・介護・民生委員など","what":"地域ケア会議を置く","note":"努力義務。事例と地域の課題を話す。主催は市町村か地域包括（高齢者の総合相談窓口）"},{"who":"市町村","to":"医療・介護関係者","what":"在宅医療・介護連携の相談窓口","note":"事業は全市町村が実施（2018年4月以降）。窓口は医師会等、役場、地域包括に置ける"},{"who":"市町村","to":"住民・事業者","what":"生活支援コーディネーター（支え合いのつなぎ役）","note":"市町村全域と生活圏域の2層"},{"who":"市町村","to":"分野をまたぐ機関","what":"支援会議（分野をまたぐ事例の検討の場）を置く","note":"2027年4月から全市町村で可"},{"who":"県","to":"市町村","what":"地域医療構想調整会議（単元11）に参画を求める","note":"2027年4月から構成員と明確化（原則）。在宅や介護が議題のとき"},{"who":"翻訳者","to":"全参加者","what":"用語集、制約カード、論点整理一枚を使う","note":"このツールの提案"}],"notes":["上の3つの主な財源は介護保険の地域支援事業（包括的支援事業）です（公費77%、65歳以上の保険料23%。2026年度概算要求）。","地域ケア会議に予算を決める力はなく、関係者の協力も努力義務です。守秘義務はあります（単元8）。","福祉事務所（生活保護などの窓口）は市は必置、町村は任意です。未設置の町村では県の事務所を呼びます（単元4）。","制約カードは財政担当、福祉課、地域包括、議員、院長、事務長、ケアマネごとに、できないことを書きます。論点整理一枚には、決めること、事実、各参加者の制約、選択肢、今日決めること、用語の注を書きます。","実例：国の資料（2016年）には、個別事例から通院手段の不足が分かり、市がバス経路を見直した例があります。"]},"timeline":{"rows":[{"when":"2026年度","event":"第10期介護保険事業計画（2027年度開始）を作る","basis":"制度上は"},{"when":"2027年4月","event":"全市町村が支援会議を置ける","basis":"制度上は（原則の施行日）"},{"when":"4月・秋","event":"異動（単元7）と予算要求（単元2）","basis":"多くの自治体では"},{"when":"会議の前","event":"論点と翻訳者を決め、論点整理一枚を配る","basis":"多くの自治体では定めなし"},{"when":"会議の後","event":"決定と次の担当を配る","basis":"多くの自治体では定めなし"}],"notes":["定めなしの2行はこのツールの提案です。小規模市町村向け事業も2027年4月に新設され、対象は人口や交通の便などから国が確認して決めます。"]},"field_limits":{"status":{"state":"仮"},"points":["人手：翻訳者は兼務になりがちで、異動や退職で止まると元の言葉に戻ることがあります。","時間：院長や開業医は平日昼の会議に出にくいことがあります。","前例：議題が毎年の報告で埋まりがちです。市町村調査（2019年度、1,230市町村）では、推進会議で政策形成に取り組めていない市町村が6割以上でした（単元11）。","議会：予算は議決まで確定せず、担当者はその場で約束しにくくなります。","実例が一つあっても他の論点に広がるとは限らず、効果を示す数字もありません。"]},"perspectives":{"status":{"state":"仮"},"medical":"診療の合間に出るので、決めることが先に分からないと足が遠のきます。「持ち帰ります」は断られたように聞こえます。","admin":"所管と予算の裏づけがない話は、その場で約束できません。特定の病院を優先すると、公平の説明に困ります。","welfare":"事例で見えた困りごとが、予算や計画まで届かないと感じます。福祉の言葉は訳されにくいと感じます。"},"misconceptions":[{"myth":"「連携には新しい協議会が要る」","fact":"法や事業に基づく場がすでにあります。まず一つ試せます。"},{"myth":"「地域ケア会議は介護の人の会議だ」","fact":"法は構成員に保健医療の専門家を含めています。"},{"myth":"「翻訳者は医師か保健師の仕事だ」","fact":"法律上の役職ではなく、職種を問いません。"}],"terms":[{"medical":"多職種カンファ","admin":"地域ケア個別会議","meaning":"事例を多職種で話す場"},{"medical":"地域の連携会議","admin":"地域ケア推進会議","meaning":"地域課題を施策につなげる場"},{"medical":"在宅連携の窓口","admin":"在宅医療・介護連携の相談窓口","meaning":"関係者の相談を受ける所"},{"medical":"地域のつなぎ役","admin":"生活支援コーディネーター（地域支え合い推進員）","meaning":"地域の担い手を探し、つなぐ人"},{"medical":"持ち帰り","admin":"決裁を経て回答","meaning":"担当者だけで決められないこと"}],"sources":[{"text":"法令：介護保険法第115条の45・第115条の48、社会福祉法第14条・第106条の6"},{"text":"厚生労働省「在宅医療・介護連携推進事業の概要について」","url":"https://zaitakupf.mhlw.go.jp/assets/pdf/gov1-outline.pdf"},{"text":"厚生労働省「地域ケア会議の役割について」（2016年10月28日）","url":"https://www.mhlw.go.jp/file/06-Seisakujouhou-12600000-Seisakutoukatsukan/0000114063_4.pdf"},{"text":"厚生労働省「包括的な支援体制の整備について」（令和8年度）","url":"https://www.mhlw.go.jp/content/11907000/001738882.pdf"}],"local_checks":[{"what":"最初の論点","where":"直近の地域ケア会議で繰り返し出た話を地域包括に聞く"},{"what":"翻訳者になれる人","where":"地域包括、保健師、社会福祉協議会、事務長から探す"},{"what":"使える会議と次の開催月","where":"介護保険担当か地域包括に聞く"}],"self_check":[{"question":"新しい連携の場を作る前に、何を確かめますか？","answer":"既存の会議です。"},{"question":"地域ケア会議の協力の求めに、関係者は必ず応じますか？","answer":"いいえ。努力義務です。"},{"question":"論点整理一枚の最初の項目は何ですか？","answer":"決めることです。"}]},"record":{"version":"v0","baseline":"2026年11月3日","generated":"設計書のP1で下書き（一次資料を確認）","reviewed":"独立レビュー1回を反映（2026年11月3日）。現場の確認は未了","unverified":"改正後の社会福祉法と医療法の条文（国の概要資料で確認）。地域支援事業の負担割合は2026年度概算要求の資料で確認。第10期（2027年度〜）の第1号保険料の率は未確認"},"md":"# 単元12 同じテーブルに着く\n\n## 1 一言で\n\n医療・福祉・行政・住民が同じ机で話すには、共通の言葉、相手の制約、同じ資料、訳す人、小さな実例の5つを揃えます。話す場は制度にありますが、訳す役は法律上の役職ではありません（2026年11月時点）。\n\n## 2 仕組みの図\n\n| 誰が | 誰へ | 何を | 補足 |\n| --- | --- | --- | --- |\n| 市町村 | 医療・介護・民生委員など | 地域ケア会議を置く | 努力義務。事例と地域の課題を話す。主催は市町村か地域包括（高齢者の総合相談窓口） |\n| 市町村 | 医療・介護関係者 | 在宅医療・介護連携の相談窓口 | 事業は全市町村が実施（2018年4月以降）。窓口は医師会等、役場、地域包括に置ける |\n| 市町村 | 住民・事業者 | 生活支援コーディネーター（支え合いのつなぎ役） | 市町村全域と生活圏域の2層 |\n| 市町村 | 分野をまたぐ機関 | 支援会議（分野をまたぐ事例の検討の場）を置く | 2027年4月から全市町村で可 |\n| 県 | 市町村 | 地域医療構想調整会議（単元11）に参画を求める | 2027年4月から構成員と明確化（原則）。在宅や介護が議題のとき |\n| 翻訳者 | 全参加者 | 用語集、制約カード、論点整理一枚を使う | このツールの提案 |\n\n上の3つの主な財源は介護保険の地域支援事業（包括的支援事業）です（公費77%、65歳以上の保険料23%。2026年度概算要求）。\n\n地域ケア会議に予算を決める力はなく、関係者の協力も努力義務です。守秘義務はあります（単元8）。\n\n福祉事務所（生活保護などの窓口）は市は必置、町村は任意です。未設置の町村では県の事務所を呼びます（単元4）。\n\n制約カードは財政担当、福祉課、地域包括、議員、院長、事務長、ケアマネごとに、できないことを書きます。論点整理一枚には、決めること、事実、各参加者の制約、選択肢、今日決めること、用語の注を書きます。\n\n実例：国の資料（2016年）には、個別事例から通院手段の不足が分かり、市がバス経路を見直した例があります。\n\n## 3 時間軸\n\n| 時期 | 起きること | 区分 |\n| --- | --- | --- |\n| 2026年度 | 第10期介護保険事業計画（2027年度開始）を作る | 制度上は |\n| 2027年4月 | 全市町村が支援会議を置ける | 制度上は（原則の施行日） |\n| 4月・秋 | 異動（単元7）と予算要求（単元2） | 多くの自治体では |\n| 会議の前 | 論点と翻訳者を決め、論点整理一枚を配る | 多くの自治体では定めなし |\n| 会議の後 | 決定と次の担当を配る | 多くの自治体では定めなし |\n\n定めなしの2行はこのツールの提案です。小規模市町村向け事業も2027年4月に新設され、対象は人口や交通の便などから国が確認して決めます。\n\n## 4 現場の実情と限界\n\n状態：仮（現場の確認前）\n\n- 人手：翻訳者は兼務になりがちで、異動や退職で止まると元の言葉に戻ることがあります。\n- 時間：院長や開業医は平日昼の会議に出にくいことがあります。\n- 前例：議題が毎年の報告で埋まりがちです。市町村調査（2019年度、1,230市町村）では、推進会議で政策形成に取り組めていない市町村が6割以上でした（単元11）。\n- 議会：予算は議決まで確定せず、担当者はその場で約束しにくくなります。\n- 実例が一つあっても他の論点に広がるとは限らず、効果を示す数字もありません。\n\n## 5 立場で見え方が違うところ\n\n状態：仮（現場の確認前）\n\n- **医療側**：診療の合間に出るので、決めることが先に分からないと足が遠のきます。「持ち帰ります」は断られたように聞こえます。\n- **行政側**：所管と予算の裏づけがない話は、その場で約束できません。特定の病院を優先すると、公平の説明に困ります。\n- **福祉側**：事例で見えた困りごとが、予算や計画まで届かないと感じます。福祉の言葉は訳されにくいと感じます。\n\n## 6 よくある誤解\n\n1. 「連携には新しい協議会が要る」→法や事業に基づく場がすでにあります。まず一つ試せます。\n2. 「地域ケア会議は介護の人の会議だ」→法は構成員に保健医療の専門家を含めています。\n3. 「翻訳者は医師か保健師の仕事だ」→法律上の役職ではなく、職種を問いません。\n\n## 7 用語\n\n| 医療側の言い方 | 行政側の言い方 | 意味 |\n| --- | --- | --- |\n| 多職種カンファ | 地域ケア個別会議 | 事例を多職種で話す場 |\n| 地域の連携会議 | 地域ケア推進会議 | 地域課題を施策につなげる場 |\n| 在宅連携の窓口 | 在宅医療・介護連携の相談窓口 | 関係者の相談を受ける所 |\n| 地域のつなぎ役 | 生活支援コーディネーター（地域支え合い推進員） | 地域の担い手を探し、つなぐ人 |\n| 持ち帰り | 決裁を経て回答 | 担当者だけで決められないこと |\n\n## 8 深掘りの一次資料\n\n- 法令：介護保険法第115条の45・第115条の48、社会福祉法第14条・第106条の6\n- [厚生労働省「在宅医療・介護連携推進事業の概要について」](https://zaitakupf.mhlw.go.jp/assets/pdf/gov1-outline.pdf)\n- [厚生労働省「地域ケア会議の役割について」（2016年10月28日）](https://www.mhlw.go.jp/file/06-Seisakujouhou-12600000-Seisakutoukatsukan/0000114063_4.pdf)\n- [厚生労働省「包括的な支援体制の整備について」（令和8年度）](https://www.mhlw.go.jp/content/11907000/001738882.pdf)\n\n## 9 自分の町で確認すること\n\n1. 最初の論点：直近の地域ケア会議で繰り返し出た話を地域包括に聞く\n2. 翻訳者になれる人：地域包括、保健師、社会福祉協議会、事務長から探す\n3. 使える会議と次の開催月：介護保険担当か地域包括に聞く\n\n## 10 自己チェック\n\n1. 新しい連携の場を作る前に、何を確かめますか？　→既存の会議です。\n2. 地域ケア会議の協力の求めに、関係者は必ず応じますか？　→いいえ。努力義務です。\n3. 論点整理一枚の最初の項目は何ですか？　→決めることです。\n\n## 版と生成の記録\n\n- 版：v0\n- 基準日：2026年11月3日\n- 生成：設計書のP1で下書き（一次資料を確認）\n- 点検：独立レビュー1回を反映（2026年11月3日）。現場の確認は未了\n- 未照合：改正後の社会福祉法と医療法の条文（国の概要資料で確認）。地域支援事業の負担割合は2026年度概算要求の資料で確認。第10期（2027年度〜）の第1号保険料の率は未確認\n"}],"roles":[{"id":"ishi","name":"医師・看護師","pain":"行政の時間軸・財源・手続きが分からず、提案が通らない","first":[2,7,6],"partners":["zaisei","jimuchou","houkatsu","caremane"]},{"id":"byoin","name":"病院事務","pain":"医療側の言葉と町の繰出基準の間で板挟み","first":[2,6,3],"partners":["zaisei","inchou","giin"]},{"id":"gyosei","name":"行政職員","pain":"医療の制度と現場の切迫が分からない","first":[3,4,11],"partners":["inchou","jimuchou","houkatsu","caremane"]},{"id":"care","name":"ケアマネ・地域包括・社協","pain":"医療にも行政にも頼みにくい","first":[3,8,12],"partners":["inchou","fukushi","houkatsu","caremane"]},{"id":"hokenshi","name":"保健師","pain":"医療と福祉と行政の三つの言葉を一人で訳している","first":[11,12,6],"partners":["fukushi","houkatsu","inchou","zaisei"]},{"id":"jumin","name":"住民・議員","pain":"制度全体が見えず、個別の不満に留まる","first":[1,9,2],"partners":["zaisei","jimuchou","fukushi","giin"]}],"cards":[{"id":"zaisei","role":"財政担当","one":"予算は秋の要求と3月の議決で動く。急ぐ分は説明の根拠が要る","can":["秋の予算要求を査定する","補正予算案を作る","繰出の額を予算に組む"],"cannot":["基準を超える繰出を説明なしに出す","交付税を病院専用の財源にする","議決の前に新規事業の支出を約束する"],"calendar":["秋：各課の要求","冬：査定と町長判断","3月：当初予算の議決","6・9・12・3月：補正"],"procedure":["新規事業は補正か翌年度の要求。所要期間は要確認"],"metrics":"町全体は収支と基金残高、病院は経常収支比率と修正医業収支比率で見て、繰出が基準内かを確かめます。","bad":["「赤字なので全額埋めてください」","「交付税が来ているので病院に回して」"],"good":["「繰出基準のどの項目か示します。来年度の要求に載せたい」","「秋の要求の前に、数字と根拠を持って相談したい」"],"basis":["地方公営企業法第17条の2・第17条の3","地方交付税法","地方自治法第96条"],"char_count":271},{"id":"fukushi","role":"福祉課","one":"介護・障害・生活保護は制度も窓口も別。次 らえますか」"],"basis":["地方公営企業法第8条・第9条・第17条の2","医療法第30条の4・第30条の14","公立病院経営強化ガイドライン"],"char_count":330},{"id":"jimuchou","role":"事務長","one":"町と病院の間で予算要求を出す人。基準と実績の差を先に見せる","can":["病院の予算要求を財政担当に出す","繰出の区分を予算書で説明する","補助金の申請と報告、プランの点検の事務を担う"],"cannot":["繰出の額を決める","補助金の使い道を変える","町の異動を止める"],"calendar":["秋：予算要求","12月・3月：特別交付税","3月：議決","4月：異動で担当が替わりうる"],"procedure":["補助金は申請と報告が要る。所要期間は要確認","新規事業は補正か翌年度"],"metrics":"修正医業収支比率（他会計負担金を除く医業収益÷医業費用）と経常収支比率で見ます。","bad":["「来月から新しい事業を始めたい。予算はつくだろう」","「補助金が余ったので、別のことに使って」"],"good":["「繰出の区分ごとに、基準と実績の差を出してもらえますか」","「秋の要求に間に合うよう、根拠と数字を一緒に作りたい」"],"basis":["地方公営企業法第17条の2・第17条の3","地方交付税法","公立病院経営強化ガイドライン"],"char_count":287},{"id":"caremane","role":"ケアマネ","one":"暮らしの事例を一番持つ。町の計画や予算は決められず、要望は地域包括を通す","can":["利用者の暮らしを事例で示す","介護の計画を作り調整する","地域ケア会議に事例を出す"],"cannot":["要介護度を決める（市町村の認定）","本人の文書同意なしに担当者会議で情報を使う","事業所に受け入れを命じる"],"calendar":["会議は平日日中が多い","2027年4月：第10期開始","2027年度：報酬改定（予定）"],"procedure":["要望は地域包括を通して推進会議へ。所要期間は要確認"],"metrics":"要介護状態区分と本人の希望、受けられる事業所があるかで見ます。","bad":["「先生の指示だからプランをそう変えて」","「ついでに町へ要望も出しておいて」"],"good":["「退院が決まる前に状況を共有したい。連絡の方法を決めませんか」","「事例を一つ、地域ケア会議に出せますか」"],"basis":["介護保険法第115条の45・第115条の48","指定居宅介護支援基準第23条","個人情報保護法第27条"],"char_count":268}],"glossary":[{"term":"連携","medical":"病院どうしや、病院と介護・在宅の間で、患者の情報と受け入れをつなぐことです。「連携室」のように、日々の個別のやり取りを指すことが多いです。","admin":"制度では、在宅医療・介護連携推進事業や地域ケア会議のように、法に基づく場と事業を指します。窓口や会議の運営は所管課の仕事です。","welfare":"介護、障害、生活困窮など、分かれた窓口を一人の暮らしでつなぐことです。会議や担当者会議に呼ばれるかどうかで測ることがあります。","gap":"「連携を強化しましょう」と言い、医療側は電話一本の話、行政側は新しい事業の話、福祉側は会議の出席の話だと受け取る。","common":"誰が、誰に、何を、いつまでに渡すか。既存の会議や窓口のどれを使うかも言います。"},{"term":"計画","medical":"病院の経営計画や、自院の方針のことが多いです。書いたことは町も約束したと受け取りがちです。","admin":"町の計画は予算の約束ではありません。予算は毎年の査定と議決で決まります。制度上は、計画に載らなくても予算は議決できます。","welfare":"介護保険事業計画のように、3年周期で保険料の根拠になる計画を思い浮かべます。地域福祉計画は努力義務で、財源の裏づけが見えにくいと感じます。","gap":"「プランに載っているので予算をお願いします」と医療側が言い、行政側は「載っていても約束ではありません」と返す。","common":"どの計画か（名前と所管課）、いつ改定か、載ると使える財源の条件があるか、の三点を言います。"},{"term":"予算","medical":"病院の運営や新しい取り組みに使えるお金の枠です。必要な時期に合わせて付くものと考えがちです。","admin":"首長が案を出し、議会が議決して決まります。制度上は年度開始前に当初予算を議決します。多くの自治体では、秋に各課が要求し、補正は年に数回です。","welfare":"介護保険は別会計で、保険料と給付の均衡が先に立ちます。一般会計の予算とは別の枠だと考えます。","gap":"「来月から始めたいので予算をつけてください」と言われ、行政側は、秋の要求に間に合わなければ補正か翌年度だと考える。","common":"どの会計か、今年度の補正で間に合うか、来年度の要求に出すか、を先に確かめます。"},{"term":"繰出","medical":"救急やへき地など、採算の取れない役割を担う対価だと考えます。町からの補填という言い方もします。","admin":"一般会計から病院など別の会計へお金を移すことです。病院側では繰入金と呼びます。基準内の分も額は町の予算と議決で決まり、基準を超える分は住民への説明が要ります。","welfare":"介護保険の会計にも、給付費の12.5%の町の負担分が一般会計から入り、これも繰出です。病院への繰出に比べ、地域の支え手に回るお金は見えにくいと感じます。","gap":"「繰出を増やしてほしい」と言い、行政側は「町全体の財源なので他の事業が減ります」と答える。","common":"「一般会計から病院の会計へ移すお金」と言い、基準内の分と基準を超える分を分けて話します。"},{"term":"在宅","medical":"自宅で受ける診療や訪問のことです。退院後の暮らしの場として、病院の外の受け皿を指します。","admin":"在宅医療・介護連携推進事業のように、市町村が行う事業の名前で出てきます。全市町村が実施し、関係者の会議や相談窓口を置く事業で、個々の患者の診療の話ではありません。","welfare":"自宅での生活そのものを指し、介護保険では施設入所でないサービスを「居宅」と呼びます。介護、障害、生活保護で窓口と制度が分かれ、一人の暮らしを別々に扱いがちです。","gap":"「在宅を増やしたい」と医療側が言い、行政側は連携事業の実績の話、福祉側は家族と事業所の負担の話だと受け取る。","common":"誰が、どの場所で、どの支援を、何日の頻度で受けるかを具体的に言います。"},{"term":"要支援","medical":"患者の状態を見て「軽い」「重い」と言うことがあります。介護の区分は、診療の見立てとは別に市町村の認定で決まります。","admin":"要介護状態区分は要支援1から要介護5までで、市町村の認定で決まります。要支援の人は予防給付と、市町村が行う総合事業の訪問型・通所型サービスの対象です。","welfare":"要支援の人の計画（介護予防支援）は地域包括支援センターか、指定を受けた居宅介護支援事業所が作ります。要介護になると居宅介護支援に切り替わり、ケアマネが計画を作ります。","gap":"「この方は軽いから要支援ですよね」と医療側が言い、福祉側は認定が市町村で決まるので、医療側の見立てとは別だと考える。","common":"「市町村の認定で決まる介護の必要度」と言い、区分は認定結果で確かめます。"},{"term":"緊急","medical":"患者の不利益は待てないので、今日から今週の話です。至急の依頼のことです。","admin":"制度上の緊急は限られます。専決処分は「特に緊急を要する」場合などに限られ、次の議会で承認を求めます。予備費で予算外の支出をする手段もあります。","welfare":"利用者の生活は年度で区切れないので、担当が替わっても支援は止められないという意味で使います。","gap":"「緊急なので今週中に対応してください」と言い、行政側は「根拠がないと動けません」と返す。","common":"いつまでに、何が起きるのか。急ぐ手段（専決処分、予備費など）と、説明の根拠を分けて言います。"},{"term":"公平","medical":"患者ごとに事情が違うのだから、困っている人を先に助けるのが当然だと考えます。","admin":"一人に認めた例外は、同じ事情の全員に説明が要ります。住民が等しく受ける権利が根拠の一つです。特定の病院や地区を優先すると、説明に困ります。","welfare":"制度ごとに窓口が分かれ、公平に扱うほど、一人の暮らしが切り分けられると感じる場面があります。","gap":"「うちの病院だけでも先に認めてもらえませんか」と言い、行政側は「他の事業者にも同じ説明が要ります」と返す。","common":"同じ事情の人なら誰にでも開く条件を、先に言います。例外ではなく、基準として頼みます。"},{"term":"所管","medical":"担当課という言い方で、困ったら誰に言えばよいかの目印です。","admin":"その事務を受け持つ課です。所管課と根拠が決まらないと、予算も議会説明も作れません。","welfare":"介護、障害、生活困窮で担当が分かれ、一人の相談が複数の課にまたがります。県や組合が絡むと町の窓口では答えが出ません。","gap":"「この件はどこの課ですか」と医療側が聞き、窓口が「うちではなく別の課です」と答えて回される。","common":"「この事務を受け持つ課」と言い、根拠の法令と、病院の設置条例や組織図で確かめます。"},{"term":"要綱","medical":"内規と同じで、決まりとして守るものだと受け取ります。変えられないと感じることがあります。","admin":"役所内部の基準で法的拘束力はなく、町の要綱は議決なしに改められます。住民に義務を課すには原則として条例が要り、国や県の補助要綱は町では変えられません。","welfare":"窓口の運用が要綱に書かれていても、本人には見えないことがあります。要綱は例規集に載らず、担当課に聞くまで見えない場合があります。","gap":"「要綱に書いてあるのでできません」と言われ、医療側は法律だと受け取る。実際は町の要綱なら改められる。","common":"町の要綱か、国・県の補助要綱かを聞き、いつ改められるかと、改める人は誰かを確かめます。"}],"questions":[{"id":1,"q":"病院の赤字は最終的に誰が負担するのか","units":[2,3],"answer":"全額を町が埋める決まりはなく、独立採算が原則です。法が一般会計の負担とする分（繰出基準）は町が負担し国が交付税の算定で一部を支えますが、額は毎年の予算と議決で決まり、基準を超える分は町の判断と住民への説明が要ります。赤字が積み上がった後の扱いは教材外です。","checks":["今年度の繰出額と区分（病院事業会計の予算書と補正予算の「他会計負担金・補助金・出資金」）","基準を超える繰出があるか（決算書、経営比較分析表、財政担当）"],"ask":["繰出のうち、基準内と基準を超える分はそれぞれいくらですか","基準を超える分は、誰がいつ、どの場で決めますか"]},{"id":2,"q":"なぜ4月に担当者が替わり、話が戻るのか","units":[7,2],"answer":"異動の周期は法律に定めがなく、町ごとの運用です。多くの自治体では3月下旬から4月1日に内示と定期異動があり、4〜6月は引継ぎと前年度どおりの運用になります。引継ぎ書に残らない経緯は伝わらないことがあります。","checks":["4月の異動の影響（各課の引継ぎ書の有無と、前年4〜6月に止まった相談。人事担当に聞く）","担当者の在任年数（人事担当に課ごとの異動記録を聞く）"],"ask":["この件の経緯と決まっていることは、引継ぎ書に載っていますか","来年度の予算要求に載せるなら、誰が担当で、何をいつまでに出せばよいですか"]},{"id":3,"q":"介護と医療で患者の情報を共有してよいのか、誰が決めるのか","units":[8,4],"answer":"本人の同意が原則で、法令に基づく場合や、命や身体を守るのに必要で同意を得にくい場合が例外です。病院と民間の介護事業者は個人情報保護法第27条で、医療機関は院内掲示による黙示の同意も認められ、ケアマネの担当者会議は事前の文書同意が要ります。町の担当課は第69条で判断者は「行政機関の長等」ですが、多くの自治体では決裁と記録の手順が未定のことがあります。","checks":["第69条の提供の判断者と記録（個人情報の担当課、施行条例）","院内掲示の文言と同意様式（病院の連携室、地域包括支援センター）"],"ask":["この情報提供は第27条と第69条のどちらで、誰が判断しますか","判断と記録の手順は、文書になっていますか"]},{"id":4,"q":"補助金はどうやって取り、何が大変なのか","units":[2,6],"answer":"補助金は使い道が決まったお金で、国や県から入ります。申請と報告の手間が大きく、少人数の事務では取りに行けないことがあります。計画への記載が条件の財源もあり、予算要求は秋なので、間に合わないと補正か翌年度を待ちます。","checks":["予算要求の締切（財政担当か事務長に聞く）","記載が条件の財源と、実施計画にない事業の扱い（財政担当に聞く）"],"ask":["この補助金は計画への記載が条件ですか。申請の締切はいつですか","申請と報告は誰が担当しますか。人手は足りますか"]},{"id":5,"q":"議会で何が決まり、何は決まらないのか","units":[1,2],"answer":"議会は条例、予算、決算などを議決します。予算案を出せるのは首長だけで、首長が定める規則や課の要綱は議決が要りません。町が独自に議決の対象に加えたもの（総合計画など）があるかは、要確認です。","checks":["定例会の月と回数、通年の会期か（議会事務局と、回数を定める条例）","課の一覧と分担（組織図と例規集の事務分掌）"],"ask":["この件は、条例・予算・規則・要綱のどれで決まりますか","次の定例会の何月に出せば間に合いますか"]},{"id":6,"q":"計画に載せるとは何をすることか、いつまでに言えばよいか","units":[2,6],"answer":"計画は予算の約束ではなく、毎年の査定と議決で決まります。ただ、過疎債や交付金など、計画への記載が条件の財源があります。多くの自治体では、改定の前年度に中身が固まり始め、予算要求は秋なので、改定年から逆算して伝えます。","checks":["各計画の改定年と担当課（企画担当に一覧を聞く）","点検・評価の時期と会議体（各審議会の要綱と議事録）"],"ask":["この計画の次の改定年と、中身が固まる時期はいつですか","載せると条件を満たす財源は何ですか"]},{"id":7,"q":"町は介護事業所に指示できるのか","units":[4,1],"answer":"民間の事業所の開設や撤退を、町は命じられません。居宅サービスと施設の指定は県（指定都市・中核市は市）、地域密着型と居宅介護支援は市町村で、市町村の指定の一部は計画の見込量で制限できます。事業者が少ない地域で市町村がサービスを行える事業が、改正法で2027年4月から設けられます。","checks":["事業所の指定権者と福祉事務所の有無（福祉と介護保険の担当課）","介護保険事業計画の期と策定年（介護保険担当課か計画書）"],"ask":["この事業所の指定権者は、県と町のどちらですか","撤退の相談があったとき、町は何を頼めて、何はできませんか"]},{"id":8,"q":"地域ケア会議に医師が出ると何が変わるのか","units":[4,11,12],"answer":"法は地域ケア会議の構成員に保健医療の専門家を含め、個別の事例から地域の課題につなげる場としています。会議に予算を決める力はなく、結論の実現には秋の予算要求と議決が要ります。医師が出ることでの変化を示す数字は教材外で、事例から通院手段の不足が分かり市がバス経路を見直した国の資料の例があります。","checks":["地域ケア会議の頻度と医療側の参加（地域包括の開催記録）","場の結論が予算や計画に載った例（介護保険事業計画、予算書、財政担当）"],"ask":["この会議で決めることは何ですか。結論はどの計画か予算要求に回りますか","医師が出られる曜日と時間帯に、会議を移せますか"]},{"id":9,"q":"保健所と町の保健センターは何が違うのか","units":[5,1],"answer":"保健所は主に都道府県や中核市などが置き、感染症や精神保健を扱います。町村は置けません。保健センターは市町村の身近な相談・保健指導の拠点で、設置は任意です。","checks":["管轄の保健所と普段の接点（厚労省の所管区域案内と保健所）","保健師の人数と担当の分け方（保健担当課か統括保健師に聞く）"],"ask":["この件の入口は、保健所と町の保健師のどちらですか","感染症の相談や届出は、どの順で誰に連絡しますか"]},{"id":10,"q":"病院が一つ減ると町の経済に何が起きるのか","units":[10,2],"answer":"医療・福祉は全国の就業者の約14%で、小さな町では病院や介護事業所が大きな雇用の場になることがあります。公立病院は法人税も固定資産税も負担せず、町の税収には主に町内に住む職員の個人住民税を通して効きます。減った場合の町ごとの影響額は教材外で、職員の住所や町内の購入額は病院が数えないと分かりません。","checks":["病院の職員数と町内に住む割合（事務長に聞く）","町で働く人の数と産業別の内訳（国勢調査の従業地別集計、e-Stat）"],"ask":["職員のうち町内に住む人は何人で、町内からの購入額はいくらですか","雇用の効果と繰出の負担を、分けて数えた資料はありますか"]},{"id":11,"q":"診療報酬が上がったのに、病院の赤字が続くのはなぜか","units":[3,2],"answer":"診療報酬の単価は国が決め、2026年6月の改定は本体が2年度平均で+3.09%ですが、自院では変えられません。改定は2月答申、6月施行で、多くの自治体では予算要求が前年の秋のため当初予算に入れにくくなります。個々の病院の赤字の原因は教材外で、決算の収益と費用で確かめます。","checks":["経常収支比率と修正医業収支比率（決算書、経営比較分析表）","今年度の繰出額と区分（病院事業会計の予算書と補正予算）"],"ask":["改定の影響額を、補正予算でいつ反映できますか","赤字の主因を、収益と費用のどこで見ていますか"]},{"id":12,"q":"経営強化プランの数値目標は誰がどう決め、届かないとどうなるのか","units":[3,6],"answer":"プランは病院を持つ自治体が作り、議会と住民に示します。総務省の指針で、経常収支比率と修正医業収支比率に必ず目標を置き、点検は概ね年1回以上です。標準の期間は2027年度まででその次は検討中、届かないときの扱いは教材外です。","checks":["自院のプランの期間と数値目標（プラン本文と毎年の点検結果）","点検・評価の時期と会議体（審議会の要綱と議事録）"],"ask":["次期プランの期間と数値目標は、いつ誰が決めますか","目標に届かないとき、繰出や計画をどう見直しますか"]},{"id":13,"q":"地域医療構想の調整会議に、町や自院は出られるのか","units":[3,11],"answer":"調整会議は県が区域ごとに設け、医療関係者や保険者が参加します。市町村は2025年3月末で330区域中、医療担当259、介護担当139が参加し、2027年4月から法律上の関係者になります。多くの自治体では議題は県が用意し報告で終わることもあるので、自院と町の出席者と発言の場は要確認です。","checks":["調整会議の構成と町の出席者（県の担当課か保健所、公表名簿）","町が入る二次医療圏と構想区域（県の医療計画）"],"ask":["町の出席者は誰で、どの議題で意見を言えますか","在宅や介護が議題になるのは、いつの会議ですか"]},{"id":14,"q":"認知症で独居の人の情報を、誰の同意で病院・ケアマネ・包括が共有するのか","units":[8,4],"answer":"同意は本人が原則で、法令に基づく場合や、命や身体を守るのに必要で同意を得にくい場合は例外です。ケアマネの担当者会議には事前の文書同意が要り、認知症や独居では誰から取るかで止まりがちです。誰の同意を取れるかは教材外で、要確認です。","checks":["院内掲示の文言と同意様式（病院の連携室、地域包括支援センター）","第69条の提供の判断者と記録（個人情報の担当課）"],"ask":["この人の同意は誰から、どの様式で取りますか","同意が取れないとき、命や身体を守る例外に当たるかを、誰が判断しますか"]},{"id":15,"q":"退院後の見守りを、民生委員や自治会に頼んでよいのか","units":[9,8],"answer":"民生委員は無給の委嘱の委員、自治会は任意の団体で、町は指示でなく依頼しかできません。患者の情報を渡してよいかは別に、同意か例外の確認が要ります。どこまで頼めるかは町ごとに要確認で、民生委員の充足率は91.7%、平均年齢は66歳と負担が重くなりがちです。","checks":["民生委員の定数と充足（福祉担当課）","自治会の数と加入率（自治会の担当課か連合会）"],"ask":["見守りで頼みたい内容を、民生委員や自治会は受けられますか","本人の情報はどこまで、誰の判断で伝えてよいですか"]},{"id":16,"q":"社協への委託や補助はどう決まり、なぜ意見が言いにくいのか","units":[9,2],"answer":"社協は社会福祉法に定めのある民間の団体で、町や介護保険から委託料、補助金、報酬を受けます。全国の2019年度決算では受託金25.7%、補助金17.6%です。多くの自治体では秋〜3月に町の予算へ載り、町の受託先なので意見を言いにくい場面があります。","checks":["社協の事業と町の委託・補助の額（社協の事業報告、町の予算書）","予算要求の締切（財政担当に聞く）"],"ask":["委託料と補助金の根拠と、見直しの時期はいつですか","委託の条件に意見があるとき、誰にどの場で言えばよいですか"]},{"id":17,"q":"保健師が少なく兼務の町で、健診の受診率と予算をどう説明するか","units":[5,7],"answer":"少人数の町では保健師が健診、母子、介護予防を兼ね、急な対応で他が止まることがあります。保健師の定数は町全体の人事で決まり、受診率と予算は一緒に説明します。職場や人間ドックの受診は町に届かないので、町の受診率が低くても未受診とは限りません。","checks":["特定健診とがん検診の受診率（国保の実施計画と保健担当課の実績）","保健師の人数と担当の分け方（保健担当課か統括保健師に聞く）"],"ask":["受診率の分母は何ですか。職場や人間ドックの受診は入っていますか","兼務の多い事業のうち、何を優先し、何を後にしますか"]},{"id":18,"q":"経常収支が黒字なら、病院は健全と言えるのか","units":[2,3],"answer":"経常黒字だけでは言えません。経常収支には収益的収支への繰入が含まれるため、他会計負担金を除く医業収益÷医業費用（修正医業収支比率）も併せて見ます。経営強化プランは、この二つの指標に必ず目標を置きます。","checks":["今年度の繰出額と区分（病院事業会計の予算書と補正予算）","自院のプランの数値目標（プラン本文と毎年の点検結果）"],"ask":["経常収支の黒字のうち、繰入を除くといくらですか","修正医業収支比率は、プランの目標と比べてどうですか"]},{"id":19,"q":"町が要綱で決めたことに、住民や事業所は従う義務があるのか","units":[1],"answer":"要綱は役所内部の基準で法的拘束力がなく、住民に義務を課すには原則として条例が要ります。町の要綱は議決なしに改められますが、国や県の補助要綱は町では変えられません。要綱は例規集に載らないことがあり、担当課に聞くまで見えない場合があります。","checks":["要綱の公開の有無と所管課（担当課と例規集）","課の一覧と分担（組織図と例規集の事務分掌）"],"ask":["この基準は条例・規則・要綱のどれで、改められるのは誰ですか","要綱は公開されていますか。例規集に載っていますか"]},{"id":20,"q":"会議で「持ち帰ります」と言われたきり、話が決まらない。どう進めるか","units":[12,7,11],"answer":"「持ち帰ります」は、担当者だけで決められず、決裁を経て回答する意味のことが多いです。会議の前に決めることを配り、会議の後に決定と次の担当を配るのは、このツールの提案です。予算が絡む件は、議決まで確定しません。","checks":["使える会議と次の開催月（介護保険担当か地域包括に聞く）","翻訳者になれる人（地域包括、保健師、社会福祉協議会、事務長から探す）"],"ask":["持ち帰った件は、誰がいつまでに、誰へ回答しますか","予算に関わるなら、秋の要求に間に合う日程はいつですか"]}],"quiz":{"1":[{"q":"医療側が「課長が了解したのに、なぜ数か月待つのか」と戸惑います。行政側から見た理由はどれですか。","choices":["課長の了解は内部の手続きで、最終の決定は県の承認で行われるから","首長が予算案を議会に出せるのは年度の始めの1回だけと法で決まっているから","予算には議会の議決が要り、所管と根拠が決まらないと議会に説明できないから","要綱を議決で定めてからでないと、条例も予算も動かせないから"],"answer":2,"why":"予算案を出せるのは首長だけで、成立には議会の議決が要るため、所管と根拠を固めて説明する時間がかかります。県は町の上の組織ではなく、予算案は年に1回に限られず、要綱は議決の要らない内部の基準なので、他の選択肢は違います。","related":[2]},{"q":"自分の町の定例会が年に何回開かれるかを知りたいとき、正しい扱いはどれですか。","choices":["回数は各自治体の条例で決まるので、議会事務局か条例で確かめる","全国どこでも年4回と地方自治法で決まっているので、確認は要らない","回数は県が市町村ごとに決めるので、県の担当課に問い合わせる","回数は首長が毎年の規則で決めるので、町長に直接聞く"],"answer":0,"why":"法の改正で定例会の回数の上限はなくなり、回数は各自治体の条例で定めるので、自分の町は要確認です。年4回は「多くの自治体では」の話で、県や首長の規則で決まるものではありません。","related":[]},{"q":"会議で「要綱に書いてあるから変えられない」と言われました。最初に確かめることはどれですか。","choices":["要綱は法律と同じなので、変えられないと受け入れる","要綱を変えるには必ず議会の議決が要るかを確かめる","要綱が例規集に載っているかだけを確かめる","町が作った要綱か、国や県の補助要綱かを確かめる"],"answer":3,"why":"町の要綱は内部の基準で、議決なしに改められます。国や県の補助要綱は町では変えられないので、どちらかで答えが変わります。","related":[2]},{"q":"県が町に「この事業をやめなさい」と指示してきました。考え方として正しいものはどれですか。","choices":["県は町の上の組織なので、指示には従うしかない","県の関与には法律か政令の根拠が要るので、まず根拠を確かめる","県の指示は助言なので、いつでも無視してよい","町の議会が賛成すれば、県の指示は無効になる"],"answer":1,"why":"県と町は別の団体で役割分担の関係なので、関与には法律か政令の根拠が要り、まず根拠を聞きます。上下関係と考えて従うのも一律に無視するのも違い、町の議会の賛成で県の関与が無効になるという定めも本文にありません。","related":[]},{"q":"病院の新しい取り組みに、議会の定例会を待たずに手を付けたい場合、制度上の手段として正しいものはどれですか。","choices":["課長の判断で既存の予算を組み替えれば、議決なしに始められる","要綱を作って基準を示せば、予算がなくても始められる","臨時会の招集か、要件を満たす専決処分","病院の事業は地方公営企業なので、議会の議決は不要とされている"],"answer":2,"why":"臨時会は議長か定数の4分の1以上の議員の請求で首長が20日以内に招集し、専決処分は時間がないなどの要件のもとで行い、次の会議で承認を求めます。課長の判断や要綱で予算は動かず、直営の病院でも予算・議案・決算は首長と議会が担うので、他の選択肢は違います。","related":[2,7]}],"2":[{"q":"交付税の算定に病院の病床数が入っています。この額は病院に渡りますか。","choices":["算定に入った額が、そのまま全額病院事業会計に渡る","渡らない。使い道が自由な町の財源で、使い道は町が決める","算定の分だけ、国から病院事業会計に直接振り込まれる","県を通して、算定の半分が病院事業会計に渡る"],"answer":1,"why":"交付税は町の一般会計に入る使途の自由な財源で、病床数は算定の根拠に入るだけなので、病院に届くかは町の予算と議会で決まります。全額や半分が病院に渡る、国から直接振り込まれるという仕組みはありません。","related":[1]},{"q":"病院への繰出を増やす話で、財政担当が慎重になる理由として、行政側の見方に合うものはどれですか。","choices":["繰出基準は総務省の通知で額まで決まっており、町が増やす余地がないから","病院は独立採算が原則で、法は赤字の全額を病院が負うと定めているから","交付税で措置された分は病院に直接届くので、町が重ねて出す必要はないから","病院に回せば他の事業が減り、基準を超える分は議会と住民への説明が要るから"],"answer":3,"why":"行政側は交付税を町全体の財源と見るので、病院に回せば他が減り、基準を超える分の説明を先に考えます。繰出の額は基準をもとに町が予算で決め、法は一定の経費を一般会計の負担としており、交付税は病院に直接届かないので、他の選択肢は違います。","related":[1]},{"q":"自分の病院に今年度いくら繰出が入っているかを知りたいとき、確かめる場所はどれですか。","choices":["病院事業会計の予算書と補正予算の「他会計負担金・補助金・出資金」","総務省が公表する全国の公立病院の決算の統計（繰入金の割合）","介護保険事業計画に載る3年分の給付費の見込み","議会の一般質問の議事録に出た繰出の金額"],"answer":0,"why":"繰出の額は町が予算に組み、補正で動き、議会が議決するので、自分の町の額は予算書や決算書で確かめます。全国の統計や介護保険の計画に自分の病院の額は載らず、議事録では一部しか分かりません。","related":[]},{"q":"来年度に新しい事業を入れたいのに、秋の予算要求に間に合いませんでした。通常の道はどれですか。","choices":["当初予算の議決後でも、課長の判断で予算に加えられる","交付税が来るのを待てば、自動的に予算になる","補正予算を待つか、翌年度を待つ","要綱を作れば、予算は不要になる"],"answer":2,"why":"多くの自治体では秋に各課が要求し、冬に査定、3月に議決するので、間に合わない事業は補正か翌年度です。課長の判断で予算は加えられず、交付税や要綱で予算が自動に付くこともありません。","related":[1]},{"q":"経常収支比率が100%を超えていても安心できないのは、なぜですか。","choices":["診療報酬の収入が含まれず、収入が低く出るから","収益的収支への繰入が含まれ、病院自身の収支が見えないから","国庫補助金の分だけで黒字に見えるから","経常収支は決算では使われない数字だから"],"answer":1,"why":"経常収支には収益的収支への繰入が含まれるので、他会計負担金を除く医業収益÷医業費用（修正医業収支比率）も併せて見ます。診療報酬は収入の柱として含まれ、国庫補助金の割合は小さく、経常収支は決算で使う数字なので、他の選択肢は違います。","related":[3]}],"3":[{"q":"病院の経営が苦しいという話を、医療側と行政側は別の枠で受け止めがちです。本文に沿った組み合わせはどれですか。","choices":["医療側は町の財政と議会の問題と見て、行政側は報酬も病床の枠も外で決まると感じる","医療側は報酬の単価や病床の枠が外で決まり自院では変えられないと感じ、行政側は町の財政と議会の問題と見る","医療側も行政側も、病院の赤字は県の医療計画で解決すると考える","医療側は国保の保険料の徴収が原因と見て、行政側は診療報酬が原因と見る"],"answer":1,"why":"医療側は外で決まる単価や枠に縛られていると感じ、行政側は毎年の予算と議会で病院を問われると感じます。1つ目は立場が逆で、3つ目と4つ目は本文にない見方です。","related":[2,7]},{"q":"自分の町から調整会議（区域ごとの協議の場）に誰が出ているかを知りたいとき、本文から言えることはどれですか。","choices":["町の担当課長が必ず出ると法で決まっているので、確認は要らない","出席者は県が一律に指名するので、町では分からない","町ごとに違うので要確認。県の担当課か保健所、公表名簿で確かめる","国保の担当者が自動的に出ると決まっている"],"answer":2,"why":"本文は町の出席者が定まらないこともあるとし、県の担当課か保健所、公表名簿での確認を勧めています。必ず課長が出る、県が指名する、国保担当が出るという定めは本文になく、町ごとに違う点を一律に断定しています。","related":[11]},{"q":"国保について、県と市町村の役割として正しいものはどれですか。","choices":["県が保険料率を決めて徴収し、市町村は県に納める納付金を決める","県も市町村も、それぞれ保険料の決定と徴収をする","県が資格管理と保険料の徴収を行い、市町村は財政運営を担う","県は納付金を決めて財政運営を担い、市町村は資格管理と保険料の決定・徴収を行う"],"answer":3,"why":"2018年度から県が財政運営の責任主体になりましたが、資格管理と保険料の決定・徴収は市町村に残っています。1つ目は逆で、2つ目と3つ目は役割が混ざっています。","related":[2]},{"q":"2026年6月に診療報酬が改定されました。町の当初予算への入り方について、本文から言えることはどれですか。","choices":["多くの自治体では予算要求が前年の秋なので、当初予算に入れにくい","制度上、改定は必ず町の当初予算に自動で反映される","多くの自治体では、改定の後に予算要求が始まるので問題は起きない","報酬改定は県の計画に従うので、町の予算には関係しない"],"answer":0,"why":"2月に答申され6月に施行された改定は秋の予算要求の後に決まる形になり、当初予算に入れにくくなります。「制度上」必ず反映されるとは言えず、改定後に要求が始まるわけでも、町の予算に無関係でもありません。","related":[2,6]},{"q":"新たな地域医療構想について、福祉の担当者が会議に呼ばれるべき理由として本文から言えるものはどれですか。","choices":["構想が病床の削減だけを決める県の計画だから","2025年の改正で、外来・在宅と介護連携も含む構想になるから","構想を作るのが県ではなく市町村になるから","構想に必ず介護保険料の目標が入ると決まったから"],"answer":1,"why":"構想は病床の話だけではなくなり、介護連携を含みます。作るのは県で、介護保険料の目標が入るとは本文にありません。","related":[4,11]}],"4":[{"q":"患者の退院先や在宅の支援が足りないという場面で、行政側の見え方として本文に沿うものはどれですか。","choices":["足りなければ町がすぐに増やせると考える","民間の事業所にも町は指示できるので、数を決めればよいと考える","給付が増えれば保険料に跳ね返るので、3年間の収支と議会への説明を先に考える","介護、障害、生活保護を一つの窓口で扱うので調整は要らないと考える"],"answer":2,"why":"行政側は給付が増えれば保険料に跳ね返るので、3年間の均衡と議会への説明を先に考えます。町がすぐ増やせるというのは医療側が抱きがちな見方で、民間には頼むことしかできない場面があり、介護・障害・生活保護は窓口が分かれているので、他の選択肢は違います。","related":[2,6,7]},{"q":"町内の訪問介護や通所の事業所の指定を、町が行っているかどうか知りたいとき、正しい進め方はどれですか。","choices":["介護の事業所の指定はすべて県（指定都市・中核市は市）が行うので、町は関与しない","介護の事業所の指定はすべて市町村が行うので、町の担当課に一覧がある","指定は事業所が自分で行う届出なので、町にも県にも確認は要らない","サービスの種類で県と市町村に分かれるので、町内の事業所がどちらかは自分の町で確認が要る"],"answer":3,"why":"居宅サービスと施設は県（指定都市・中核市は市）、地域密着型と居宅介護支援は市町村が指定するので、町内の各事業所がどちらかは福祉と介護保険の担当課に確かめます。すべて県、すべて市町村、届出だけという選択肢は、分かれている指定権限を一律に断定しています。","related":[1]},{"q":"町内の民間の介護事業所が撤退すると聞きました。町について本文から言えることはどれですか。","choices":["町は開設や撤退を命じられず、代わりがないこともある","町は撤退を命じられないが、県に頼めば止められる","町が指定している事業所なら、撤退は禁止されている","撤退には町の議会の議決が要るので、議会で止められる"],"answer":0,"why":"民間事業所の開設や撤退を町は命じられず、小さな町では一つ撤退すると代わりがないことがあるので、早めに情報を得て代わりの手立てを探す頼み方が要ります。県に頼めば止められる、指定済みなら禁止、議決が要るという制度は本文にありません。","related":[7,12]},{"q":"福祉事務所を置かない町村に住む人が、生活保護を申請したいときの説明として正しいものはどれですか。","choices":["町村長が保護の可否を決め、費用も町が負担する","県の福祉事務所が決め、町村長は申請の送付などを担う","最寄りの市の福祉事務所が自動的に引き継ぐ","福祉事務所のない町村では生活保護は受けられない"],"answer":1,"why":"福祉事務所は市は必置、町村は任意で、置かない町村は県の事務所が決め、町村長は申請の送付や急迫時の応急保護を担います。町村長に決める権限はなく、市の事務所が引き継ぐ定めもなく、受けられないわけでもありません。","related":[]},{"q":"介護保険料の見直しと次の計画の時期について、本文から言えることはどれですか。","choices":["保険料の改定に議会の議決は要らず、町長が規則で決める","第10期は2026年4月に始まっており、保険料は国が全国一律の基準額で決める","保険料は毎年度、条例で見直して議会へ出す","第10期は2027年4月開始で、多くの自治体では2026年度末に保険料の条例改正を議会へ出す"],"answer":3,"why":"計画は3年1期で第10期は2027年4月に始まり、保険料は条例で定めるので議決が要ります。年度末の条例改正は「多くの自治体では」の運用で、毎年度の見直しや国の一律の決定ではなく、町長だけでは決められません。","related":[2,6]}],"5":[{"q":"健診のあとの流れについて、立場ごとの見え方として本文に沿う組み合わせはどれですか。","choices":["医療側は保健所が健診後の窓口と考え、福祉側は医療機関が窓口と考える","医療側はつなぎ先が分かりにくく、行政側は受診率と予算を一緒に説明し、福祉側は同じ世帯を別々に見がち","行政側は保健師の定数を病院が決めると考え、医療側は町全体の人事で決まると考える","医療側も行政側も福祉側も、健診は保険者がすべて行うと考える"],"answer":1,"why":"医療側は感染症は保健所、生活の相談は町の保健師と相手が分かれることに戸惑い、行政側は予算と受診率、福祉側は計画と会議が分かれることに悩みます。保健師の定数は町全体の人事で決まり、健診は実施者が分かれるので、他の選択肢は本文にない見方か逆です。","related":[7,11]},{"q":"町のがん検診の受診率が低く出ています。これだけで「住民は検診を受けていない」と言えますか。","choices":["言える。町の検診の受診率が住民全体の受診率にあたる","言える。職場の検診の結果も町に届いて集計されている","言えない。職場や人間ドックの受診が入らず、実際は自分の町で要確認","言えない。がん検診は努力義務なので受診率に意味はない"],"answer":2,"why":"町の受診率は町の検診の数字で、職場や人間ドックで受けた分は町に届きにくいので、実際の受診状況は保健担当課の実績で確かめます。職場の検診は町に届きにくく、受診率が意味を持たないわけでもありません。","related":[2]},{"q":"町の保健センターと、保健所の違いとして正しいものはどれですか。","choices":["保健所は都道府県などの機関で町村は置けず、保健センターは市町村が任意で置く","保健所は町が置き、保健センターは県が置く広域の施設である","どちらも町の機関で、扱う範囲と規模が違うだけである","保健所は県立の医療機関で、保健センターは役所の出先である"],"answer":0,"why":"保健所の設置主体は都道府県・保健所設置市・特別区で町村は置けず、町にあるのは保健センターなどで設置は任意です。保健所を町が置く、両方が町の機関、保健所が医療機関という説明は本文と合いません。","related":[1]},{"q":"診療所の医師が、感染症の患者を診断しました。法律に基づく届出の相手として正しいものはどれですか。","choices":["町の保健センター","役場の保健担当課","医師会","最寄りの保健所"],"answer":3,"why":"医師は感染症を最寄りの保健所に、直ちに、または7日以内に届け出ます。届出先は保健所で、町の保健センターや役場の保健担当課、医師会は法律上の相手ではありません。","related":[8]},{"q":"町の健診の日程や委託先を変えたいと考えたとき、本文から言える動き方はどれですか。","choices":["健診は保険者の義務なので、日程は医療機関が自由に決められる","健診の案内を送る春〜夏より前に、調整の時間を見込んで保健担当課に相談する","変更は議会の議決だけで決まるので、議員に頼む","前年と同じでなければ法律違反になる"],"answer":1,"why":"健診の日程や委託先は前年どおりになりやすく、変更には調整の時間が要るので、案内や集団健診が始まる春〜夏より前に相談します。日程を医療機関が自由に決められるわけではなく、議決だけで決まるものでも、前年と違えば違反になるものでもありません。","related":[2,6]}],"6":[{"q":"会議で「この事業は計画に載っていないので、予算は付けられません」と言われました。制度上の説明として正しいのはどれですか。","choices":["予算には計画への記載が要件なので、載っていない事業は議決できない","計画に載っていれば、毎年の査定を経ずに予算は必ず付く","計画の改定年にしか、新しい事業の予算は付けられない","予算の条文に計画の要件はなく、載っていなくても議決できる"],"answer":3,"why":"地方自治法の予算の条文に計画の要件はなく、記載が条件なのは過疎債や交付金など一部の財源です。載せても予算は約束されず毎年の査定と議決を経るので、必ず付く、改定年にしか付かないという説明も違います。","related":[2]},{"q":"医療側が「経営強化プランに書いたから、町も約束してくれたはず」と考えています。行政側はこれをどう見がちですか。","choices":["計画は予算の約束ではなく、毎年の査定と議決で決まると見る","計画に書いたことは、翌年度に必ず予算化すると見る","計画は法の義務なので、医療側が一方的に決められると見る","計画は議会が見ないので、中身は重要でないと見る"],"answer":0,"why":"行政側は計画と予算を別に考え、予算は毎年の査定と議決で決まると捉えます。他の選択肢は、計画を予算の約束と見る医療側の受け取り方か、本文にない話です。","related":[2]},{"q":"自分の町で、各計画の改定年と担当課を知りたいとき、本文の答え方として適切なのはどれですか。","choices":["介護保険事業計画と同じく、どの計画も3年一期なので、改定年は計算できる","全国共通の一覧があるので、それを見ればよい","自分の町では要確認。企画担当に改定年の一覧を聞く","総合計画は法の義務なので、改定年は法で決まっている"],"answer":2,"why":"計画ごとに担当課と審議会が別で、改定年の一覧がないことがあります。地域福祉計画は法に定めがなく、総合計画も義務ではないので、周期は町で違います。","related":[4,5]},{"q":"介護保険事業計画と地域福祉計画で、制度上の位置づけと待つ年数はどう違いますか。","choices":["どちらも努力義務で、5年ごとに改定する","介護は義務で3年一期、地域福祉は努力義務で法に周期の定めがない","介護は努力義務、地域福祉は義務で、どちらも3年一期","介護は任意、地域福祉は義務で、周期は町が決める"],"answer":1,"why":"介護保険事業計画は義務で3年一期、地域福祉計画は努力義務で周期の定めがなく、5年とする町が多い状況です。どちらも努力義務、介護が努力義務や任意という選択肢は法の強さが逆で、待つ年数が違うので改定年から逆算します。","related":[4,5]},{"q":"地域未来交付金（推進型）を使いたい町が、まず必要とするものはどれですか。","choices":["総合計画の実施計画への事業の記載","過疎計画の策定と過疎債の申請","地方版総合戦略の事業を載せた地域再生計画の認定","公立病院経営強化プランの議会の議決"],"answer":2,"why":"推進型は、地方版総合戦略（努力義務）の事業を載せた地域再生計画の認定が前提です。総合計画は法の義務がなく、過疎計画やプランは別の財源（過疎債、病院事業債）に関わります。","related":[2]}],"7":[{"q":"医療側の「緊急」と行政側の「公平」がぶつかったとき、話し方として本文に合うものはどれですか。","choices":["緊急だから公平は後回しにしてほしいと頼む","公平を守るため、急ぐ話はすべて断る","担当者が替わるまで、話を止めておく","急ぐ手段と、説明できる根拠を分けて話す"],"answer":3,"why":"医療側の緊急は今日から今週の話で、行政側は一人に認めた例外を全員に説明できる根拠を求めるので、急ぐ手段と説明の根拠を分けると噛み合います。公平を後回しにする頼み方や、急ぐ話を全て断る、担当交代まで止めるやり方は、どちらかの言い分を捨てています。","related":[11,12]},{"q":"「うちの町の担当者は2〜3年で替わる」と聞きました。この話を会議で使うとき、正しい扱いはどれですか。","choices":["全国調査も法の定めもないので、人事担当に自分の町の異動記録を聞く","法律で異動は2〜3年と決まっているので、そのまま会議で使う","全国の調査で2〜3年と確かめられているので、そのまま使う","異動の周期は人事の話なので、会議では出さないほうがよい"],"answer":0,"why":"法律に異動の周期の定めはなく町ごとの運用で、在任年数の全国調査も確認できないため、自分の町は要確認です。法や全国調査を根拠にそのまま使うことはできず、本文は在任年数の確認を勧めているので出さないという選択も違います。","related":[]},{"q":"国の通知に「従う義務がある」と言われました。まず考えることはどれですか。","choices":["通知はすべて国の命令なので、内容や種類を問わず必ず従う","多くは技術的助言だが、法令の義務、処理基準、補助の要件は別なので、どれかを確かめる","通知はすべて助言なので、補助の要件に関わるものでも従わなくてよい","従わなければ、それを理由に町が国から不利益に扱われる"],"answer":1,"why":"技術的助言は命令ではなく、従わなくても不利益に扱えませんが、法令の義務、処理基準、補助の要件は別です。すべて命令、すべて無視できる、不利益を受けるという選択肢は、この区別を見ていません。","related":[1,2]},{"q":"4月に担当者が替わり、話が戻りました。次の異動の前にしておくとよいことはどれですか。","choices":["異動は法で2〜3年と決まっているので、待つ","新しい担当に、前年度どおりにしてもらう","引継ぎ書があるかを確かめ、経緯が残る形にしておく","異動前に、専決処分で決めてしまう"],"answer":2,"why":"多くの自治体では3月下旬〜4月1日に異動があり、経緯は引継ぎ書に残る分しか伝わらないので、残る形にしておきます。異動の周期は法に定めがなく、前年度どおりでは話が進まず、専決処分は緊急時の手段で引継ぎの代わりにはなりません。","related":[1]},{"q":"「行政は緊急でも動けない」という声に、制度上で言えることはどれですか。","choices":["専決処分は、町長が緊急でなくてもいつでも自由に使える","予備費は、議会が否決した使途にも町長の判断で使える","緊急でも、議会の議決なしに支出する手段は一切ない","予備費や専決処分があるが、専決処分は要件があり次の議会で承認を求める"],"answer":3,"why":"予備費と専決処分という手段があり、専決処分は「特に緊急を要する」場合などに限られ、次の会議で承認を求めます。専決処分を自由には使えず、予備費は議会が否決した使途には使えず、手段が一切ないわけでもありません。","related":[1,2]}],"8":[{"q":"退院に必要な情報を福祉の担当に「同意がない」と断られました。行政側から見た理由として合うものはどれですか。","choices":["個人情報は、どんな場合も出してはいけないと法で決まっているから","町が持つ情報の目的外の提供は例外で、根拠を文書に残せないと動きにくいから","病院は民間なので、役場とは話せないから","同意書が口頭では、必ず無効になるから"],"answer":1,"why":"町の担当課は第69条で目的外提供が例外に当たるかを見るので、根拠を文書に残せないと動きにくく、判断者や記録の手順の未整備で止まることもあります。法はどんな場合も出せないとはしておらず、町立病院と役場が話せないわけではなく、「同意は必ず書面」は本文の誤解の例です。","related":[7]},{"q":"地域ケア会議で、本人の同意なしに情報を出せるかを聞かれました。本文から言える答えはどれですか。","choices":["同意なしで出せると法に明記されている","同意なしでは一切出せないと法に明記されている","法に守秘義務があり、同意なしで出せるかは要確認","町立病院が出す情報なら、同意なしで必ず出せる"],"answer":2,"why":"本文は地域ケア会議に法の守秘義務があるとし、同意なしで出せるかは国の解釈を含め要確認としています。出せる、出せないのどちらにも断定できず、町立病院だからという区別もありません。","related":[4]},{"q":"町立病院から他の病院への紹介状と、町の福祉担当が民間の病院に情報を出す場合で、正しいのはどれですか。","choices":["前者は個人情報保護法第27条、後者は第69条で見る条文が違う","どちらも町の機関なので、役場と同じ第69条で見る","どちらも診療情報なので、民間と同じ第27条で見る","どちらも定めた条文はなく、町の慣例で決める"],"answer":0,"why":"町立の病院・診療所は民間と同じ第4章で、町の保健・福祉の担当課は第69条なので、同じ町でも条文が違います。どちらも第69条、どちらも第27条、慣例で決めるという説明は本文と合いません。","related":[]},{"q":"介護認定のために、町が主治医意見書を求めています。患者の同意は要りますか。","choices":["本人の書面の同意が要る","本人の口頭の同意で足りる","要らない。命や身体を守る例外に当たるから","要らない。法令に基づく場合に当たるから"],"answer":3,"why":"病院から市町村への主治医意見書は法令に基づく場合なので、同意は不要です。書面や口頭の同意を取る場面ではなく、命や身体の保護の例外は虐待などで同意を得にくい場合の話です。","related":[4]},{"q":"院内の掲示だけで、他の医療機関や介護事業者に診療情報を出してよいと考える人がいます。本文に合う見方はどれですか。","choices":["掲示があれば、要配慮個人情報を含めどんな情報でも出せる","掲示は無意味で、医療機関でも必ず文書の同意を取り直す必要がある","原則は黙示の同意だが、医療に必要な範囲のみで、様式は施設ごとに違う","黙示の同意は民間のもので、町立病院では使えない"],"answer":2,"why":"黙示の同意は掲示に反対がなければ同意と考えるもので、医療に必要な範囲に限り、町立病院も民間と同じ第27条です。どんな情報でも出せるわけではなく、医療機関は口頭の同意も認められるので必ず文書というのも違います。","related":[]}],"9":[{"q":"退院した高齢者の見守りを民生委員や自治会に頼めないかと考えたとき、立場ごとの見え方として本文に沿うものはどれですか。","choices":["医療側は誰にどこまで頼めるかが見えにくく、行政側は民間の活動に指示できず特定の地区の優遇も避けたい","医療側は民生委員に直接指示できると考え、行政側は町の依頼先なので頼むのは自由だと考える","医療側も行政側も、自治会は町の下部組織なので町を通せば頼めると考える","福祉側は民生委員が町の有給の職員なので、役割を増やしても問題ないと考える"],"answer":0,"why":"医療側は連絡先と頼める範囲が見えにくく、行政側は任意の団体や無給の委員に指示できず公平も気にします。民生委員は無給の委嘱の委員、自治会は任意の団体で町が指示できる相手ではないので、他の選択肢は本文の誤解にあたります。","related":[7,12]},{"q":"自分の町の民生委員が足りているか知りたいとき、本文から言えることはどれですか。","choices":["全国の充足率がそのまま町の充足率なので、確認は要らない","定数は県の条例で決まり、自分の町の充足は福祉担当課に聞いて要確認","定数は町議会が条例で決めるので、議会事務局に聞く","民生委員の充足は社協が管理しているので、社協に聞く"],"answer":1,"why":"全国の充足率は2025年12月の改選で91.7%ですが、町ごとの数字は別で、確認先は福祉担当課です。定数を決めるのは県の条例で、町議会や社協が決めたり管理したりするものではありません。","related":[]},{"q":"自治会の位置づけについて正しいものはどれですか。","choices":["町の下部組織で、町長が指示できる","町長の認可を受けると町の組織の一部になる","任意の団体で、認可を受けても行政組織には入らない","住民の加入は法律で義務づけられている"],"answer":2,"why":"自治会は住民の任意の団体で、町長の認可は法人格を得るためのもので行政組織には入りません。下部組織や町の一部ではなく、加入の義務も本文にありません。","related":[1]},{"q":"住民説明会が「説明」と「相談」ですれ違いやすいのはなぜですか。","choices":["自治会長が出席しないから","説明会は法律で意見を聞く場と決まっていて、案は変えられないから","住民が行政の用語を知らないので、説明が通じないから","説明会は案が固まってから開かれやすく、住民は今の困りごとを持ってくるから"],"answer":3,"why":"案ができた後に説明会を開くことが多く、住民は今の困りごとを話したいので、場の目的がずれます。意見公募は行政手続法の対象外で、町の条例などによると本文にあり、2つ目は違います。","related":[6,12]},{"q":"住民への働きかけで、自治会長の了解を得れば住民の了解を得たと言えますか。","choices":["言える。自治会長は住民の代表だから","言える。自治会の加入率は全国でほぼ全世帯だから","言えない。未加入世帯の声が抜ける。正式な代表は選挙で決まる","言えない。自治会は民間の団体なので意見を聞いてはいけない"],"answer":2,"why":"自治会の加入率は下がっていて未加入の世帯があり、正式な住民の代表は選挙で決まります。自治会長の了解だけでは声が抜け、意見を聞くこと自体は禁じられていません。","related":[1,12]}],"10":[{"q":"病院の存続を話すときの見え方として、本文に沿うものはどれですか。","choices":["行政側は雇用の大切さを見ず繰出だけを見て、医療側は人件費を削る対象と考える","医療側は人件費が削る対象と語られると感じ、行政側は雇用は大事でも繰出は同じ財布から出ると考える","福祉側は介護事業所の雇用は病院より小さいので、語られなくてよいと考える","医療側も行政側も、雇用があれば赤字でも町の得だと考えて繰出に賛成する"],"answer":1,"why":"医療側は病院を雇用の場と考えながら人件費が削る対象とされることに違和感を持ち、行政側は雇用も大事だが財布は同じと見ます。行政側も雇用を大事にし、福祉側は介護事業所が語られにくいと感じ、雇用があれば得というのは本文の誤解です。","related":[2,7]},{"q":"病院が町の経済に与える効果を数字で説明したいとき、自分の町で何を確かめますか。","choices":["全国平均の医療・福祉の就業者の割合を、そのまま町にあてはめる","病院に入る診療報酬の総額だけを町の収入として示す","公立病院が町に納める法人税と固定資産税の額","職員数と町内に住む割合、町内の調達額。公表統計にないので要確認"],"answer":3,"why":"職員の町内居住率や町内調達額は公表統計になく、病院が数えないと分からないので、事務長に確かめます。全国平均は町の実情と違い、診療報酬は町外にも出ていき、公立病院は法人税も固定資産税も負担しません。","related":[2]},{"q":"隣の町から通う病院職員の個人住民税は、どこに納められますか。","choices":["1月1日に住所のある隣の町","勤務先である病院のある町","病院のある町と隣の町に半分ずつ","住んでいる町と病院のある町のうち、本人が選んだ町"],"answer":0,"why":"個人住民税は勤務先でなく1月1日の住所地に納めるので、職員がどこに住むかで町に入る額が変わります。病院のある町や半分ずつ、本人が選ぶという仕組みはありません。","related":[2]},{"q":"「公立病院は町に多くの税を納めている」という言い方への返答として適切なものはどれですか。","choices":["その通り。町内で最も多くの固定資産税を納めている","法人税は納めるが、固定資産税は公立なので納めない","法人税も固定資産税も負担しない。効くのは主に町内に住む職員の個人住民税である","指定管理で民間が運営する場合も、すべて非課税と決まっている"],"answer":2,"why":"公立病院は市町村などに課税できず、法人税も固定資産税も負担しません。民間運営の指定管理の場合は要確認とされており、4つ目は断定しすぎです。","related":[1]},{"q":"町で働く人の数や産業別の内訳を確かめたいとき、どの数字で見ますか。","choices":["働く場所で数える従業地の数字（国勢調査）","住んでいる場所で数える常住地の数字","病院の職員名簿だけ","国の就業者数を人口で割った平均"],"answer":0,"why":"町で働く人の数は、働く場所で数える従業地の数字で見ます。住んでいる場所で数えた数字は町外で働く住民も含み、職員名簿や全国平均では町で働く人の全体は分かりません。","related":[]}],"11":[{"q":"医療・介護・福祉の担当が「話が噛み合わない」ときの見方として、本文に沿うのはどれですか。","choices":["相手の担当者に協力する気がないことが主な原因である","国の通知が分野ごとに矛盾していて、現場では従えないため","財源、法律、所管、言葉などが別で、同じ言葉でも前提が違うから","分野をまたぐ会議の回数が足りないことがほぼ唯一の原因である"],"answer":2,"why":"分野ごとに財源、法律、所管、言葉、時間軸、評価指標が別で、同じ言葉でも前提が違います。姿勢の問題と決めつけると前提の違いを見落とし、通知の矛盾や会議の回数が原因とは本文にありません。","related":[12]},{"q":"会議が前年どおりの報告で終わりました。医療側と行政側の見え方の組み合わせとして、本文に沿うのはどれですか。","choices":["医療側は「出ても聞いて終わり」、行政側は「場を用意しても医師が来ない」と感じがち","医療側も行政側も、報告で終わる会議の成果に満足している","医療側は公平性と予算の手順を重視し、行政側は書類で足りると考える","医療側は議会への説明に困り、行政側は診療を止めて出るのに困る"],"answer":0,"why":"医療側は診療を止めて出ても報告を聞いて終わると感じ、決められない場なら書類で足りると考えがちで、行政側は場を用意しても医師が来ないと感じます。満足しているとは本文になく、残り2つは医療側と行政側の立場が入れ替わっています。","related":[12]},{"q":"自分の町で、医療側の代表が出席している越境の場がどれか知りたいとき、適切なのはどれですか。","choices":["どの町でも、地域ケア会議には開業医が必ず委員として入っている","町ごとに違うので要確認。委員名簿と議事録、各担当に聞く","国保運営協議会には医療側の代表は入らないと法で決まっている","地域医療構想調整会議は町が開くので、役場の担当に聞けばよい"],"answer":1,"why":"参加が薄い側は場で違い、町ごとにも違うので、委員名簿と議事録、介護保険・国保・県の医療の各担当で確かめます。地域ケア会議の医師の参加は数字で低さが見え、国保運営協議会には保険医などの代表が入り、調整会議は県が開きます。","related":[12]},{"q":"地域医療構想調整会議を開くのは誰ですか。","choices":["市町村","地域包括支援センター","医師会","県"],"answer":3,"why":"医療法に基づき県が開きます。市町村や地域包括が開くのは地域ケア会議などで、2027年4月から調整会議の関係者に市町村等が加わります。","related":[12]},{"q":"越境の場で関係者が合意しました。実現するために必要なことはどれですか。","choices":["場で合意した時点で実現が確定し、手続きは要らない","首長が予算案を作り議会が議決するので、秋の予算要求に間に合わせる","会議の議事録を公開すれば、予算は自動的に付く","次の診療報酬の改定で手当されるのを待つ"],"answer":1,"why":"場に予算の権限はなく、予算は首長が作り議会が議決するので、要求に遅れると補正か翌年度以降になり議会への説明も要ります。合意や議事録の公開で予算が付くことはなく、診療報酬は国が決める別の話です。","related":[2,12]}],"12":[{"q":"連携を進めたいとき、新しい協議会を作る前に確かめることはどれですか。","choices":["既存の会議（地域ケア会議など）で試せないか","新しい協議会の設置を条例で義務づけられていないか","隣の町が同じ会議を作っていないか","国の補助金が出るか"],"answer":0,"why":"法や事業に基づく場がすでにあるので、新しい場を作る前に既存の場で一つ試せないかを確かめます。条例の義務づけや隣の町、補助金の有無から始めると、すでにある場を見落とします。","related":[11]},{"q":"会議で行政担当が「持ち帰ります」と答えました。立場による受け取りの違いとして、本文に沿うのはどれですか。","choices":["医療側は前向きな回答と聞き、行政側は断りの意味で使っている","医療側も行政側も、その場での決定を意味すると受け取る","医療側は断られたように聞こえ、行政側は所管と予算の裏づけなしに約束できない","福祉側だけが断りと受け取り、医療側と行政側は同じ意味で使う"],"answer":2,"why":"行政側は決裁を経て回答するための言い方ですが、医療側には断られたように聞こえがちで、会議の後に決定と次の担当を配るとズレが減ります。行政側が断りとして使うわけでも決定を意味するわけでもなく、福祉側だけの受け取りとも本文にありません。","related":[11]},{"q":"最初に取り上げる論点と、使える会議・次の開催月を知りたいとき、適切なのはどれですか。","choices":["全国共通の決まりなので、教材の表を見れば分かる","町ごとに違うので要確認。地域包括や介護保険担当に聞く","開催月は法で決まっているので、法令を調べれば分かる","県の担当に聞けば、町の会議の論点と開催月が分かる"],"answer":1,"why":"会議の使い方や開催月は町で違い、直近の地域ケア会議で繰り返し出た話と次の開催月を地域包括や介護保険担当に聞きます。全国共通の表や法令、県の担当では自分の町の論点と開催月は分かりません。","related":[11]},{"q":"「翻訳者」（分野の言葉を訳す人）について、本文に沿うのはどれですか。","choices":["法律上の役職で、医師か保健師が務める","地域包括支援センターに必ず置かれる","生活支援コーディネーターと同じ役職である","法律上の役職ではなく、職種を問わない"],"answer":3,"why":"翻訳者はこのツールの提案で、法律上の役職ではありません。地域包括、保健師、社会福祉協議会、事務長などから探します。","related":[11]},{"q":"地域ケア会議について、本文に沿うのはどれですか。","choices":["予算を決める力があり、関係者は必ず協力する","介護の人だけの会議で、医療の専門家は構成員に入らない","予算を決める力はなく、関係者の協力は努力義務。守秘義務はある","開催は住民の義務で、医師会が主催する"],"answer":2,"why":"地域ケア会議に予算を決める力はなく、関係者の協力は努力義務ですが、守秘義務はあります。法は構成員に保健医療の専門家を含め、主催は市町村か地域包括なので、他の選択肢は違います。","related":[8,11]}]},"prompts":[{"id":"P6","group":"use","title":"問いから経路を引く","body":"添付の学習教材を前提に、次の問いに答えるためにどの単元をどの順で読めばよいか、そして自分の町で何を確認すべきかを示してください。\n\n問い：【例：病院の赤字は最終的に誰が負担するのか】\n\n出力：\n1. 読む順（単元番号と、なぜその順か。3つまで）\n2. 短い答え（教材の範囲で言えること、3文以内）\n3. 自分の町で確認すること（どこで分かるか）\n4. 会議で確かめる質問（2つ）\n\n300字以内。教材にない内容は「教材外」と明記する。"},{"id":"P7","group":"use","title":"自分の町の宿題を出す","body":"単元【 】を自分の自治体に当てはめるために、埋めるべき事実の一覧を作ってください。\n\n自治体の前提：【 】\n\n出力（表）：確認項目｜どこで分かるか（文書名・課・サイトの種類）｜難しさ（易・中・難）｜言えるようになること｜答え（空欄のまま）\n\n10項目以内。公開資料で分かるものを先に並べる。"},{"id":"P8","group":"use","title":"更新チェック","body":"学習教材の単元【 】を見直します。基準日【 】以降に起きた、法改正・報酬改定・計画の改定・所管省庁の通知・自治体側の変化のうち、この単元の記述に影響するものを挙げてください。\n\n単元の本文：【貼り付け】\n\n出力（表）：変更点｜影響する記述（引用）｜直すべき内容｜根拠（資料名）｜確信度（高・中・低）\n\n知らないものは「不明」と書き、作らない。確信度が低いものは「要確認」として残す。"},{"id":"P9","group":"use","title":"会議用の一枚を作る","body":"次の会議のための「論点整理一枚」を作ってください。参加者全員が同じ事実を見て話すための資料で、意見は書きません。\n\n会議：【 】\n参加者：【役割で】\n決めたいこと：【 】\n手元の事実：【数字・日付・出典】\n関係する制約カード：【貼り付け、あれば】\n\n出力（A4一枚）：\n1. 決めること（1文）\n2. 事実（数字・日付・出典）\n3. 各参加者の制約（1行ずつ）\n4. 選択肢（2〜3。それぞれの費用・時期・誰が動くか）\n5. 今日決めること／持ち帰ること\n6. 用語の注（立場で言い方が違う言葉）\n\n600字以内。"},{"id":"P10","group":"use","title":"自己チェックを作る","body":"単元【 】の本文から、理解を確かめる問題を5問作ってください。\n\n各問：問い｜選択肢4つ｜正解｜解説（2文。なぜ他の選択肢が違うか）｜関連する単元\n\n条件：立場による見え方の違いを問う問題を1問、「自分の町では要確認」が正解になる問題を1問入れる。"},{"id":"P11","group":"use","title":"会議の振り返り","body":"会議の振り返りを3行にまとめます。\n\n噛み合わなかった場面：【一言で】\n相手の役割：【 】\n\n出力：\n1. 噛み合わなかった原因を、単元11の構造（財源・法律・所管・言葉・時間軸・評価指標）のどれかで一言\n2. 相手の制約で、こちらが知らなかったこと（制約カードに足す一文）\n3. 次に同じ場面で使う一言"},{"id":"P1","group":"make","title":"単元を生成する","body":"あなたは地方自治体の制度と現場の両方に通じた編集者です。医療従事者・行政職員・福祉職・住民が同じ土台で理解できる学習教材の一単元を書きます。\n\n# 単元\n単元名：【例：2 お金の流れ】\n主な読者：【例：病院勤務医と病院事務】\n自治体の前提：【例：人口1.2万人の町、町立病院（88床）と町立診療所あり】\n町名：【例：○○町】\n基準日：【2026年11月3日】\n\n# 本文の型\n見出し1は「単元【番号】 【単元名】」。次の見出し2をこの順で、一字も変えずに使う。番号と項目名の間は半角スペース。「（仮）」などの補足を足さない。\n\n1 一言で\n2文以内。\n\n2 仕組みの図\n表で書く。列は「誰が｜誰へ｜何を｜補足」。いつ・どの財源でかは補足に書く。\n\n3 時間軸\n表で書く。列は「時期｜起きること｜区分」。区分は「制度上は」か「多くの自治体では」で始める。\n\n4 現場の実情と限界\n1行目は「状態：仮（現場の確認前）」。続けて、制度どおりに動かない理由を箇条書きで（人手・時間・前例・議会）。\n\n5 立場で見え方が違うところ\n1行目は「状態：仮（現場の確認前）」。続けて箇条書き3つ。「**医療側**：」「**行政側**：」「**福祉側**：」で始め、各2文。\n\n6 よくある誤解\n番号付きで3つ。「誤解」→正しい理解。\n\n7 用語\n表で書く。列は「医療側の言い方｜行政側の言い方｜意味」。5〜8語。\n\n8 深掘りの一次資料\n箇条書き。法令名、所管省庁の資料名、自治体が持つ資料の種類。URLは確実なものだけ。\n\n9 自分の町で確認すること\n番号付きで3つ。「確認すること：どこで分かるか」。\n\n10 自己チェック\n番号付きで3問。「問い　→答え」。\n\n版と生成の記録\n箇条書きで5行。「版：」「基準日：」「生成：」「点検：」「未照合：」で始める。\n\n# 地域の層（本文とは別に出力する）\n見出し1は「単元【番号】 地域の層（【町名】）」。\n- 添付資料にある町の数字・課名・計画名のうち確認できたものを、時点と出典を添えて表にする。見出し2は内容に合わせて付ける\n- 最後の見出し2は「自分で埋める欄」。表の列は「確認項目｜どこで分かるか｜難しさ｜言えるようになること｜答え」。答えは空欄のまま\n\n# ルール\n- 本文には町名、町の数字・課名・計画名、町の資料へのリンクを書かない。他の町にそのまま渡せる形にする\n- 本文では「制度上は」「多くの自治体では」を書き分ける。町の事実は地域の層に書き、確認できないものは「要確認」とする\n- 制度の記述は添付の一次資料を優先する。資料にない内容は出典名を添えるか「要確認」とする\n- 数字と年度を書く。知らない数字は「要確認」と書き、作らない\n- 変わりうる記述には「基準日時点」と添える\n- 専門用語は初出で言い換える\n- 項目1〜10の本文は合計2,000字以内（見出し、版と生成の記録、地域の層は含めない）"},{"id":"P2","group":"make","title":"垣根を分析する","body":"次の論点について、関係者が同じテーブルで話せない理由を構造で説明してください。\n\n論点：【例：退院後の独居高齢者の見守りを誰が担うか】\n関係者：【例：病院医師、病院MSW、地域包括支援センター、町福祉課、民生委員】\n基準日：【 】\n\n出力：\n1. 関係者ごとの法律・財源・所管（表）\n2. 関係者ごとの時間軸（いつ決められるか、いつ予算がつくか）\n3. 関係者ごとの言葉と評価指標\n4. 情報を共有できない理由と、共有できる例外（根拠を添える）\n5. 既にある越境の場（会議・事業）と、使われていない理由\n6. 同じテーブルに着くために最小限必要なもの（3つ）\n7. 最初の一歩（小さく、誰が、いつ）\n\nルール：一般論と要確認を分ける。断定できない点は「要確認」。1,500字以内。"},{"id":"P3","group":"make","title":"制約カードを作る","body":"次の役割の「制約カード」を作ってください。会議の前に相手側が読む、A5一枚の想定です。\n\n役割：【例：町の財政担当】\n自治体の前提：【 】\n\n出力：\n- できること／できないこと（各3つ）\n- 動ける時期（年度のカレンダー）\n- 必要な手続きと所要時間\n- 判断に使う指標と言葉\n- 言われて困る頼み方／通る頼み方（各2つ）\n- 根拠になる法律・基準（名称のみ）\n\n400字以内。断定できない点は「要確認」。この役割の人に読んでもらい直す前提で、「仮」と明記。"},{"id":"P4","group":"make","title":"用語を三者で翻訳する","body":"次の用語について、医療・行政・福祉で意味と使い方がどう違うかを表にしてください。\n\n用語：【例：連携、計画、予算、在宅、要支援、緊急、公平】\n\n列：用語｜医療側の意味・言い方｜行政側｜福祉側｜ズレが起きる場面｜三者で共通に使える言い換え\n\n各セル1〜2文。ズレが起きる場面は実際の会議で起きそうな一言を例にする。"},{"id":"P5","group":"make","title":"批判的に読む（レビュー）","body":"次の教材を、行政職員・医師・ケアマネの三人の読者になりきって批判的に読んでください。甘い評価はしないでください。\n\n教材：【貼り付け】\n基準日：【 】\n\n出力（読者ごと）：\n- 誤り・言い過ぎ・古い可能性のある記述（根拠付き）\n- 分かりにくい用語と、その立場での言い換え\n- その立場から見て欠けている視点\n- 直し方（具体的な文で）\n\n最後に、三人に共通する指摘を3つにまとめる。"}],"local":{}}</script>

と議会がそれぞれ住民に選ばれる二元代表制で、予算は首長が作り議会が決める。実務は課ごとの縦割りで、法律・条例・規則・要綱と国の通知で動き、年度の暦に乗らないものは動かない。","figure":{"status":"未作成","svg":null,"claim":null,"plan":"首長・議会・課の関係と、年度の暦（予算要求、議会、執行）"},"overview":[{"title":"全体像","note":"","text":"","blocks":[{"kind":"table","columns":["主体","役割","医療の話での意味"],"rows":[["首長（町長）","予算の調製と執行（地方自治法149条）、職員の任免（172条）、規則の制定（15条）","町立病院の開設者は町で、町長はその代表。一部適用なら病院の経営の最終権限を町長が持つ"],["議会","条例・予算・決算の議決（96条1項）、一般質問（会議規則と慣行による）","病院の予算や料金、条例は議会を通る。議員は住民の声の窓口"],["課（病院所管、保健福祉、財政、総務、企画など）","所管ごとの事務","「誰の所管か」で話の行き先が決まる。課をまたぐ案件は誰も持たないことが多い（経験則）"],["病院（地方公営企業）","一部適用（財務規定等のみ）なら管理者の権限を町長が行う（地方公営企業法34条の2）。全部適用なら町長が任命する病院事業管理者が、職員の任免・給与・契約・予算原案の作成を担う","経営の権限がどこにあるかが、経営形態で変わる。全部適用でも予算の調製と議案の提出は町長に残る"],["都道府県","医療計画、地域医療構想、医師確保計画、自治医大卒の配置、市町村への助言。2026年4月からは医師確保の重点区域の設定も（棚4）","医療の計画と医師の配置は県が握る"],["国","法律、通知、財源（交付税・補助）","通知と交付税の算定が町の動きを縛る"],["一部事務組合・広域連合","後期高齢者医療広域連合（県ごとに全市町村が加入。高齢者医療確保法48条）、消防など","町単独では決められない分野がある"]]},{"kind":"para","text":"決まりの階層は、法律＞政令・省令＞条例・規則。条例（議会が決める）と規則（首長が決める）はどちらも法令に違反しない範囲で作る自主法で、所管が分かれる。両者がぶつかれば条例が優先すると解されている。その下に要綱・要領（行政内部の基準。議会は要らず、住民を法的に縛らない）がある。補助金の交付要綱など、実際には要綱で動く事業が多く、外からは見えにくい。"},{"kind":"para","text":"国の通知の多くは「技術的助言」（地方自治法245条の4）で法的拘束力はないが、実務はほぼ従う。ただし法定受託事務の「処理基準」（245条の9）は性格が違うので、通知がすべて助言というわけではない。"}]}],"numbers":{"columns":["項目","意味","町の値","出典の場所"],"rows":[["町の一般会計の予算規模","—","【要入力】","町の予算書・広報"],["財政力指数","基準財政収入額÷基準財政需要額の3年平均。高いほど自前の財源に余裕がある","【要入力】","[総務省 財政状況資料集](https://www.soumu.go.jp/iken/zaisei/jyoukyou_shiryou/h22/setumei.html)"],["経常収支比率","毎年決まって出ていく経費に一般財源が食われている割合。高いほど自由に使えるお金が少ない","【要入力】","同上"],["健全化判断比率（実質赤字比率、連結実質赤字比率、実質公債費比率、将来負担比率の4つ）","財政の健全度。基準を超えると健全化計画が要る","【要入力】","[総務省 健全化判断比率](https://www.soumu.go.jp/iken/zaisei/kenzenka/index2.html)、町の公表資料"],["病院事業の資金不足比率","公営企業ごとの資金の不足の度合い","【要入力】","同上"]],"after":[{"kind":"para","text":"全国の平均と比べるときは、財政状況資料集の「類似団体」の値を使う（町の規模と産業構造が近い団体どうしの比較）。"}]},"calendar":{"title":"暦","note":"（多くの自治体では）","columns":["時期","起きること"],"rows":[["4月","人事異動、新年度の執行開始"],["6月","定例議会"],["9月","定例議会（前年度の決算認定。決算は次の
