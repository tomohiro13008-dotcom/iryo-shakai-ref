],"misconceptions":["「介護は福祉課の話で病院は関係ない」→ 在宅医療・介護連携推進事業は市町村の事業だが、医療側の参加を前提にしている","「計画は形だけ」→ 計画に載らない事業には予算が付きにくく、載せ損ねると原則として次の期まで3〜6年待つ（中間見直しや毎年の予算で動く例もある）","「県と町の役割ははっきりしている」→ 医療は県、介護は町が主で、在宅医療と入退院はその境目にある。境目は誰も持たないことが多い","「介護報酬は3年に1度しか変わらない」→ 2026年6月に臨時改定があった"],"local_checks":[{"what":"第10期介護保険事業計画の策定の日程と、委員会に医療側の委員がいるか","where":"町の福祉担当"},{"what":"在宅医療・介護連携推進事業の担当と、4場面のうち何をしているか","where":"地域包括支援センター"},{"what":"地域ケア会議の頻度と、医師が出ているか","where":"地域包括支援センター"}],"topics":[{"title":"医療DX","summary":"保険証はマイナ保険証か資格確認書に一本化され、期限切れの保険証で受診できる暫定措置も2026年7月末で終わった。電子処方箋は薬局でほぼ行き渡ったが、診療所は3割ほど。電子カルテ情報共有サービスは2026年度冬頃の全国運用が目標。令和8年度改定で、DXの加算は「電子的診療情報連携体制整備加算」に作り直された。","blocks":[{"kind":"table","columns":["項目","今の状況","出典"],"rows":[["従来の保険証","2024年12月2日に新規発行を停止、2025年12月1日に有効期限切れ。暫定措置は2026年7月31日で終了。8月からは「保険証を忘れた」と同じ扱い","[厚労省](https://www.mhlw.go.jp/content/12400000/001623080.pdf)、[大臣会見 2026年3月19日](https://www.mhlw.go.jp/stf/kaiken/daijin/0000194708_00907.html)"],["マイナ保険証の利用率","68.15%（2026年4月。病院68.50%、医科診療所71.16%、薬局63.29%）","[厚労省](https://www.mhlw.go.jp/content/12401000/001712851.pdf)"],["電子処方箋","薬局91.8%、医科診療所32.2%（2026年9月、業界紙の集計）。義務ではない。医療機関向けの補助は2027年3月31日まで","[デジタル庁ダッシュボード](https://digital.go.jp/resources/govdashboard/electronic-prescription)、[日本医事新報](https://www.jmedj.co.jp/blogs/product/product_29438)"],["電子カルテ情報共有サービス","3文書（診療情報提供書、退院時サマリー、健診結果報告書）と6情報（傷病名、アレルギー、検査、処方など）を共有。全国の運用開始は2026年度冬頃が目標","[内閣府 資料 2026年4月](https://www8.cao.go.jp/iryou/studygloup/20260410/pdf/s-1.pdf)"],["電子カルテの普及","一般病院65.6%、一般診療所55.0%（令和5年医療施設調査）。2030年12月31日までに約100%が法定目標","同上"],["標準型電子カルテ","医科の無床診療所向けの導入版を2026年度中に完成させる目標","同上"],["診療報酬の加算","医療DX推進体制整備加算と医療情報取得加算は廃止。電子的診療情報連携体制整備加算（初診時15・9・4点の3区分、再診時2点、入院初日160・80点）。マイナ保険証の利用率30%以上などが施設基準","[岡山県 資料](https://www.pref.okayama.lg.jp/uploaded/attachment/410961.pdf)、[厚労省 令和8年度改定](https://www.mhlw.go.jp/stf/newpage_67729.html)"]]},{"kind":"bullets","items":["会議で使う：「新しいDX加算のどの区分が取れるか」「電子カルテの更新時期に、共有サービスと電子処方箋の導入を合わせられるか」「補助の期限（2027年3月）に間に合うか」","よくある誤解：「紙の保険証はまだ使える」→ 暫定措置も2026年7月末で終わった。「電子処方箋は義務」→ 義務ではない"]}]},{"title":"医師偏在対策","summary":"2024年12月の「医師偏在の是正に向けた総合的な対策パッケージ」を受けて、令和7年改正医療法（令和7年法律第87号、2025年12月12日公布）ができた。2026年4月から、県が医師確保の重点区域を定め、外来医師過多区域での新規開業には事前の届出と要請の仕組みが入った。","blocks":[{"kind":"table","columns":["仕組み","中身","始まり"],"rows":[["重点医師偏在対策支援区域","人口は残るのに医療機関が速く減る地域などを県が選ぶ。市町村や地区の単位でもよい。手当の増額（保険者の拠出）、診療所の承継・開業の支援、派遣元への支援が付く","2026年4月1日"],["外来医師過多区域の新規開業","無床診療所は開設の6か月前に届出。県は夜間休日の初期救急・在宅医療・公衆衛生などを担うよう要請できる。応じなければ医療審議会での説明、勧告、公表、保険医療機関の指定期間の短縮（6年→3年など）。禁止ではない","2026年4月1日"],["保険医療機関の管理者要件","一定の保険診療の経験を求める。地域医療支援病院などの管理者に求める医師少数区域等での勤務経験は6か月から1年に","施行日は未確認"],["医師確保計画の後期","2027〜2029年度分を県が2026年度に策定中。後期ガイドラインは2026年6月公表","2027年4月"]]},{"kind":"bullets","items":["会議で使う：「町は県の重点区域の候補に入っているか」「後期の医師確保計画に町の病院・診療所を支援の対象として載せられるか」「承継・開業の支援の対象になるか」","よくある誤解：「開業規制ができた」→ 禁止ではなく、届出・要請・勧告・公表の段階的な仕組み。「医師確保計画は6年」→ 3年ごと（医療計画の6年の中で前期と後期）"]}]}],"units":[3,4,5,6],"home_units":[3,4,5],"extra_links":[],"new_units":[],"app_links":[{"name":"主治医意見書","text":"主治医意見書"},{"name":"訪問診療・往診","text":"訪問診療・往診"}],"down_text":"共通学習ツール 単元3 医療の制度、4 介護・福祉、5 保健・予防、6 計画と財源の結び目。統合アプリ 主治医意見書、訪問診療・往診","sources_text":"[国保の都道府県化](https://www.mhlw.go.jp/content/000889632.pdf)、[令和8年度診療報酬改定率](https://www.mhlw.go.jp/content/12401000/001620952.pdf)、[令和8年度介護報酬臨時改定](https://www.mhlw.go.jp/content/12404000/001675936.pdf)、[第8期障害福祉計画 基本指針](https://www.mhlw.go.jp/content/12200000/kihonshishin8shinkyuu.pdf)、[医師偏在対策パッケージ](https://www.mhlw.go.jp/content/10800000/001364022.pdf)、[改正医療法の概要](https://www.mhlw.go.jp/content/10800000/001653901.pdf)、[外来医師過多区域の施行通知](https://www.city.machida.tokyo.jp/iryo/hokenjo/imuyakumu/tuchiichiraniryo/tuuchi_iyaku_2025.files/260319iseihatu0319dai20gou.pdf)、[かかりつけ医機能報告（兵庫県の解説）](https://web.pref.hyogo.lg.jp/kf15/kakaritukei.html)","status":"照合済み","status_text":"照合済み（2026年11月11日）。厚労省の資料で照合した。2026年に入った新しい動き（介護報酬の臨時改定、医師偏在対策、医療DX）を書き足した。","checked_at":"2026-11-11","file":"04_医療・介護・福祉の制度.md"},{"id":"s5","no":5,"band":"seido","name":"病院とクリニックの経営","summary":"収益は「患者数×単価」で、費用の大半は人件費を中心とした固定費。患者が少し減るだけで赤字に振れる。公立病院は公営企業会計で、本業の収支（医業収支）と繰入を含む収支（経常収支）を分けて見る。クリニックは固定費を院長が決められる分、損益分岐の患者数がすべてを決める。","figure":{"status":"未作成","svg":null,"claim":null,"plan":"収入（外来・入院・在宅）と費用（人件費・材料費・固定費）の構造と損益分岐。病院と診療所を左右に並べる"},"overview":[{"title":"全体像","note":"","text":"","blocks":[{"kind":"table","columns":["観点","公立病院","クリニック（無床診療所）"],"rows":[["収益の柱","入院（病床数×稼働率×1日単価）、外来、救急","外来（再診・管理料）、在宅、検査"],["主な費用","人件費、材料費（薬・診療材料）、委託費、減価償却","人件費、家賃・リース、薬（院内処方なら）、システム"],["単価を動かすもの","施設基準と加算（看護配置、地域包括ケア、入退院支援など）","管理料（生活習慣病管理料、地域包括診療料など）、在宅の点数"],["量を動かすもの","病床稼働率、紹介と救急、平均在院日数","患者数、再診の間隔"],["会計","地方公営企業会計（発生主義・複式簿記）。毎年の損益（収益的収支）と投資・借入の返済（資本的収支）を分ける","個人または医療法人の会計。院長の所得と経営が近い"],["外から入るお金","一般会計からの繰入、補助","原則なし"],["評価の物差し","経常収支比率、医業収支比率、修正医業収支比率（繰入を除いた本業）、病床利用率、人件費・材料費の比率","損益分岐の患者数、1日の患者数、単価、人件費率"],["決める人","町長と議会（全部適用なら事業管理者も）。経営強化プランが物差し","院長"]]},{"kind":"para","text":"押さえる考え方を三つ。"},{"kind":"numbered","items":["**損益分岐**：固定費 ÷（1 − 変動費の率）が損益分岐の収益。これを1人あたり単価で割ると、必要な患者数になる。「受診を減らしても黒字」の条件は、この式で確かめる","**利益と現金は別**：減価償却は現金が出ない費用、借入の返済は損益に出ない支出。赤字でも資金は回ることがあり、黒字でも資金が足りないことがある","**経営形態**：今の形は、地方公営企業法の一部適用、全部適用、地方独立行政法人、指定管理者の4つ。ガイドラインが挙げる見直しの選択肢は、全部適用、地方独立行政法人化、指定管理者制度、事業形態の見直し（民間譲渡、診療所・介護医療院などへの転換）の4つ。全部適用の自由度は独法より限られる。一部適用から離れるほど経営の裁量は大きくなる傾向があるが、一直線の序列ではない"]},{"kind":"para","text":"公立病院経営強化プランは、総務省の「持続可能な地域医療提供体制を確保するための公立病院経営強化ガイドライン」（2022年3月29日）に沿って各病院が作る。対象期間は策定年度か次の年度から2027年度までが標準。中身は、役割・機能と連携、医師・看護師の確保と働き方改革、経営形態の見直し、新興感染症への備え、施設・設備（デジタル化を含む）、経営の効率化の6つ。経常収支比率と修正医業収支比率の数値目標は必ず置き、期間中の経常黒字化を目指す（難しければ時期と道筋を書く）。概ね年1回以上点検・評価して公表し、有識者や住民が入る委員会に諮る方式が示されている。"}]}],"numbers":{"columns":["項目","全国の公立病院","町の病院・クリニックの値","出典の場所"],"rows":[["経常収支比率","94.5%（2025年度決算、841病院）","目標と実績：【要入力】","[総務省 公立病院の令和7年度決算の状況](https://www.soumu.go.jp/main_content/001034025.pdf)、町は経営強化プランの点検・評価"],["医業収支比率","87.0%（同上）","【要入力】","同上"],["修正医業収支比率","80.9%（同上）","【要入力】","同上"],["経常赤字の病院の割合","81.2%（683／841病院。2024年度は83.3%）","—","同上"],["経常損益の合計","▲3,399億円（2024年度は▲3,952億円）","—","同上"],["病床利用率（病棟ごと）","—","【要入力】","経営強化プラン、決算書"],["入院・外来の1日単価","—","【要入力】","同上"],["人件費・材料費の対医業収益比率","—","【要入力】","同上"],["同規模（50〜100床、100〜200床）の公立病院の類似平均","【原表で確認】（PDFの表が崩れていて列の対応を確かめられなかった）","—","[総務省 病院経営比較表](https://www.soumu.go.jp/main_sosiki/c-zaisei/hospital/kessan-bunseki/R06.html)の「類似平均」欄"],["継承クリニックの損益分岐の1日患者数","—","【要入力】（自分で計算）","決算書とレセプトの集計"]],"after":[]},"calendar":{"title":"暦","note":"","columns":["時期","起きること","区分"],"rows":[["3月末","公営企業の事業年度が終わる","制度上は"],["9月議会","決算の認定","多くの自治体では"],["概ね年1回以上","経営強化プランの点検・評価と公表","制度上は"],["毎年","病床機能報告","制度上は"],["2027年度","経営強化プランの多くが最終年度","制度上は"],["診療報酬改定の年","施設基準の届出の見直し","制度上は"]],"after":[]},"negotiation":["最初に「単価・量・費用のどれを動かす話か」を言うと、事務長と話が噛み合う","事務長・院長とは「修正医業収支比率」「病床利用率」「1日単価」「人件費比率」の4つで話す","町とは「経常黒字は繰入込みか」「本業の赤字をどこまで繰入で埋めているか」を共有する","AIや業務改善の話は、「人件費を減らす」ではなく「時間外、外注費、医師を確保する費用」で語る","避けること：「赤字＝経営が下手」と断じる（政策医療の不採算は構造）。民間病院と同じ物差しだけで比べる"],"misconceptions":["「経常黒字なら経営は健全」→ 繰入を含んだ数字。本業（修正医業収支）は赤字のことが多い。全国の公立病院の修正医業収支比率は80.9%（2025年度）","「患者が増えれば必ず黒字」→ 人員基準や施設基準で人が要り、費用も増える。稼働と人員の組み合わせで決まる","「赤字なら資金も尽きている」→ 利益と現金は別。資金繰りは内部留保と企業債の返済で見る"],"local_checks":[{"what":"経営強化プランの数値目標と最新の実績","where":"点検・評価の資料、事務長"},{"what":"届け出ている施設基準と、届け出ていない加算","where":"医事、厚生局の届出受理名簿"},{"what":"継承クリニックの月の固定費と1人あたり単価","where":"現在の決算書とレセプトの集計"}],"topics":[],"units":[2],"home_units":[],"extra_links":[],"new_units":[{"name":"病院経営の読み方","status":"未作成"}],"app_links":[{"name":"保険診療の基礎","text":"保険診療の基礎（外来の点数構造、在宅の点数構造、クリニック経営の数字）"}],"down_text":"統合アプリ 保険診療の基礎（外来の点数構造、在宅の点数構造、クリニック経営の数字）。共通学習ツール 単元2。新規単元「病院経営の読み方」（未作成）","sources_text":"[公立病院経営強化ガイドライン](https://www.soumu.go.jp/main_content/000803322.pdf)、[同 Q&A](https://www.soumu.go.jp/main_content/000866944.pdf)、[経営形態の資料](https://www.soumu.go.jp/main_content/000789588.pdf)、[公立病院の令和7年度決算の状況](https://www.soumu.go.jp/main_content/001034025.pdf)、[鳥取県 公営企業会計の用語解説](https://www.pref.tottori.lg.jp/secure/852660/yougokaisetsu.pdf)、[奈良県 経営指標の概要](https://www.pref.nara.jp/secure/289191/gaiyo_b.pdf)","status":"照合済み","status_text":"照合済み（2026年11月11日）。総務省の公立病院経営強化ガイドラインと決算の資料で照合し、全国の数字を入れた。会計用語の定義は県の用語解説で確かめた。","checked_at":"2026-11-11","file":"05_病院とクリニックの経営.md"},{"id":"s6","no":6,"band":"korekara","name":"2040年の地域医療構想","summary":"2015年からの地域医療構想は「病床の数と機能」の話だった。新しい構想は2040年を見据え、外来・在宅・介護との連携・人材まで含め、各病院が「2040年にどの役割（医療機関機能）を担うか」を2028年度までに決める。自治体病院にとっては、新病院の形と役割を県の協議の場で確定させる手続きになる。","figure":{"status":"未作成","svg":null,"claim":null,"plan":"2040年までの年表と、自院に関わる論点"},"overview":[{"title":"全体像：5つの医療機関機能","note":"","text":"","blocks":[{"kind":"table","columns":["機能","担うこと"],"rows":[["高齢者救急・地域急性期機能","救急搬送の受入、入院早期からのリハビリと退院調整で、早く家に帰す"],["在宅医療等連携機能","在宅医療の提供、24時間対応、在宅の患者の入院受入と後方支援"],["急性期拠点機能","手術や救急など医療資源を多く要する症例を集めて担う。災害医療や医師の教育も"],["専門等機能","上に当てはまらないもの（集中的リハビリ、中長期の入院、有床診療所、特定の診療科など）"],["医育及び広域診療機能","大学病院の本院が担う"]]},{"kind":"para","text":"従来から変わる点："},{"kind":"bullets","items":["病床機能の区分は、「回復期」と「高齢者などの急性期」をまとめて「包括期機能」にする。高度急性期・急性期・慢性期は残る","各医療機関は、今の機能、2040年に担う機能、診療実績を県に報告する（医療機関機能報告）。診療報酬の届出だけで機械的に決めない","構想区域は原則二次医療圏。ただし人口の少ない地域は、区域の中で入院を完結できなくなる前提で広域化を検討する","市町村は、自治体病院の開設者として病床と医療内容の見直しに協力し、介護保険の主体として介護保険事業計画との整合を図る。介護の課題を構想区域の協議で共有することが求められている","根拠は令和7年の医療法等の改正（令和7年法律第87号。2025年12月5日成立、12月12日公布。原則の施行は2027年4月1日）。医療機関機能報告は医療法30条の13に基づき、2026年10月から始まる"]}]}],"numbers":{"columns":["項目","出典の場所","値"],"rows":[["津山・英田区域の2040年の入院・外来・在宅の需要推計","県の構想策定資料（2026〜2027年度に出る）","【要入力】"],["区域内の病床数（機能ごと）","県の病床機能報告","【要入力】"],["新病院の病床計画","経営強化プラン、新病院基本計画","【要入力】"]],"after":[{"kind":"para","text":"この棚の数字は区域と病院の値だけで、全国の値は置かない。区域の推計は県が2026〜2027年度に出す。"}]},"calendar":{"title":"暦","note":"","columns":["時期","起きること"],"rows":[["2024年12月18日","「新たな地域医療構想に関するとりまとめ」（新たな地域医療構想等に関する検討会）"],["2025年12月","改正医療法の成立・公布"],["2026年3月","同じ名前の「新たな地域医療構想に関するとりまとめ」（地域医療構想及び医療計画等に関する検討会）を、同じ月に社会保障審議会 医療部会が承認。ガイドラインはこちらに基づく"],["2026年10月","医療機関機能報告が始まる（東京都の資料による。精神医療は2027年10月からの報告開始を見据えて検討中）"],["2026〜2027年度上半期","データ分析と構想区域の点検"],["2028年度まで","構想を策定。各病院の2040年の機能を決める"],["2029年度頃","第9次医療計画の策定"],["2030年、2036年","必要病床数の見直し（医療計画の見直しに合わせる）"],["2035年頃","成果の確保"]],"after":[]},"negotiation":["町と病院にとっての意味：「2040年にどの機能を担うか」を、新病院の設計と同じ言葉で語れる。地域包括ケア病床を増やし在宅を支える方向なら、「高齢者救急・地域急性期」と「在宅医療等連携」のどちらを主にするかが論点になる（私の整理。県の議論で確かめる）","県と話すときは「構想区域の協議に、在宅と介護の現場の実情を出せる」という立ち位置が効く。ガイドライン自体が市町村に介護の課題の共有を求めている","第10期介護保険事業計画（2026年度策定）との整合が、町側の入口（棚4）","避けること：「病床削減の話」とだけ言う。住民と議会には「役割を決めて残るための手続き」として話す"],"misconceptions":["「病床を減らすための構想」→ 病床数も扱うが、中心は2040年の役割分担。外来・在宅・介護連携・人材まで含む","「県が決めて病院は従うだけ」→ 各病院が2040年の機能を報告し、構想区域の協議で決める。報告の中身を自分たちで考える余地がある","「診療報酬の届出で機能が決まる」→ ガイドラインは届出だけで機械的に決めることを適切でないとしている"],"local_checks":[{"what":"岡山県の構想策定の日程と、津山・英田の調整会議の構成","where":"県の医療推進担当、調整会議の資料"},{"what":"病院は2040年にどの機能を報告するつもりか、誰が決めるか","where":"院長、事務長"},{"what":"鏡野町は構想区域の協議にどう関わるか","where":"町の病院所管課と福祉担当"}],"topics":[],"units":[3,6],"home_units":[],"extra_links":[],"new_units":[{"name":"2040年の地域医療構想","status":"未作成"}],"app_links":[],"down_text":"共通学習ツール 単元3 医療の制度、6 計画と財源の結び目。新規単元「2040年の地域医療構想」（未作成）","sources_text":"[地域医療構想策定ガイドライン](https://www.mhlw.go.jp/content/10800000/001718620.pdf)、[2024年12月のとりまとめ](https://www.mhlw.go.jp/content/10800000/001357306.pdf)、[改正医療法の概要](https://www.mhlw.go.jp/content/10800000/001674533.pdf)、[東京都 推進協議会資料（2026年度の流れ）](https://www.hokeniryo.metro.tokyo.lg.jp/documents/d/hokeniryo/r8-1-suisinnkyou-siryou4-1)","status":"照合済み","status_text":"照合済み（2026年11月11日）。厚労省「[地域医療構想策定ガイドライン](https://www.mhlw.go.jp/content/10800000/001718620.pdf)」（2026年3月のとりまとめを受けたもの。発行日の記載なし）を読んで書き、法律の成立・公布日と医療機関機能報告の開始時期を確かめた。「会議・交渉で使う」のうち「私の整理」と書いた論点は、県の議論で確かめる。","checked_at":"2026-11-11","file":"06_2040年の地域医療構想.md"},{"id":"s7","no":7,"band":"korekara","name":"攻めの予防医療","summary":"予防は「持ち場がばらばら」な分野で、健診は保険者、がん検診と予防接種は市町村、職場の健診は事業主、重症化予防は診療所が担う。「攻め」とは、本人の自主性だけに任せず、行政や保険者が能動的に介入して行動を変えるという意味。診療所と町は、その介入の最後の1メートルを担う。","figure":{"status":"未作成","svg":null,"claim":null,"plan":"国・保険者・自治体・診療所それぞれの持ち場と、予防の段階"},"overview":[{"title":"全体像：予防の段階と持ち場","note":"","text":"","blocks":[{"kind":"table","columns":["段階","中身","主な持ち場と根拠"],"rows":[["0次予防","環境や社会のしくみで、気づかないうちに健康になる","国・県・市町村の健康増進計画（健康日本21）、まちづくり"],["一次予防","発病を防ぐ（生活習慣、予防接種）","市町村（定期接種の実施主体、予防接種法）、診療所"],["二次予防","早く見つける（健診・検診）","保険者（特定健診、40〜74歳、高齢者医療確保法で義務）、市町村（がん検診、健康増進法の努力義務）、事業主（職場の健診、労働安全衛生法）"],["三次予防","重症化・再発を防ぐ、機能を保つ","診療所と病院、保険者の重症化予防（糖尿病性腎症など）、市町村の介護予防"]]},{"kind":"para","text":"境目にある仕組み：後期高齢者の保健事業は広域連合が持ち、介護予防は市町村が持つ。この二つを市町村でまとめて行う「保健事業と介護予防の一体的実施」が2020年4月からある（広域連合が市町村に委託する）。国保には、予防や健康づくりの取組を評価して交付金を配る「保険者努力支援制度」がある（市町村分と都道府県分。指標は特定健診・保健指導の実施率、がん検診受診率、重複・多剤投与への取組など）。"}]},{"title":"U.E.N.O.Plan（攻めの予防医療）の要点","note":"","text":"","blocks":[{"kind":"bullets","items":["目的は健康寿命の延伸と、社会保障を含む社会の支え手の拡大","名前は Understand・Exercise・Nourish・Optimize for Better Health の頭文字。今回は「第一弾」","重点は6領域：がん・循環器病等、歯科保健、リハビリテーション、栄養・食生活、認知症、性差に由来するヘルスケア","基盤は、データヘルスを土台にした「AI予防医療モデル」、個人インセンティブ、事業主と保険者の連携（コラボヘルス）","自治体と保険者への施策：歯周病検診を2027年度から10歳ごとから5歳ごとに広げる。簡易検査ツールを使う「簡易歯科健診」を2027年度から位置づける。職域を含めた受診状況の把握と受診勧奨を進める（本文の書きぶりは「要請」より「支援」「推進」が中心）","数値目標：5がん（肺・胃・大腸・乳・子宮頸）の検診受診率60%と精密検査受診率90%を令和10年度末までに（第4期がん対策推進基本計画の終期）、特定健診の実施率70%を令和11年度までに（概要資料にだけある）、歯科健診を過去1年に受けた人の割合95%を令和17年度までに"]}]}],"numbers":{"columns":["項目","全国の値","町の値","出典の場所"],"rows":[["特定健診の実施率","全体61.5%、市町村国保38.8%、協会けんぽ60.6%、健保組合83.8%（2024年度）。目標70%","【要入力】","[厚労省 2024年度の実施状況](https://www.mhlw.go.jp/content/12400000/001718877.pdf)、町のデータヘルス計画"],["特定保健指導の実施率","全体28.3%、市町村国保30.0%（2024年度）。目標45%","【要入力】","同上"],["がん検診の受診率（国民生活基礎調査。40〜69歳、子宮頸は20〜69歳）","過去1年：胃 男48.8%・女38.3%、肺 男55.2%・女49.5%、大腸 男50.9%・女46.2%。過去2年：子宮須46.1%、乳51.0%（2025年調査。男女計は公表なし）","【要入力】","[2025年国民生活基礎調査](https://www.mhlw.go.jp/toukei/saikin/hw/k-tyosa/k-tyosa25/dl/13.pdf)"],["市町村のがん検診の精密検査受診率","胃85.7%、肺82.7%、大腸71.1%、子宮須78.0%、乳90.6%（2023年度の検診分）。目標90%","【要入力】","[令和6年度地域保健・健康増進事業報告の概況](https://www.mhlw.go.jp/toukei/saikin/hw/c-hoken/24/dl/R06gaikyo.pdf)"],["保険者努力支援制度の得点と弱い項目","—","【要入力】","町の国保担当、県の公表"]],"after":[{"kind":"para","text":"国民生活基礎調査の受診率は職場や人間ドックでの受診も含む。市町村の検診だけを数える地域保健・健康増進事業報告の受診率（胃6.7%など）とは定義が違うので、比べるときは同じ物差しをそろえる。"}]},"calendar":{"title":"暦","note":"","columns":["時期","起きること","区分"],"rows":[["2024〜2035年度","健康日本21（第三次）","制度上は"],["2024〜2029年度","第3期データヘルス計画、第4期特定健診等実施計画","制度上は"],["2026年7月","U.E.N.O.Plan 公表","—"],["令和8年度内","食事ガイドの作成と周知","U.E.N.O.Plan"],["令和9年度","歯周病検診の拡大と簡易歯科健診が始まる。関連事業の予算は予算編成で検討","U.E.N.O.Plan"],["毎年","保険者努力支援制度の評価と交付金（指標は年度で変わる）","制度上は"]],"after":[]},"negotiation":["町の保健師や国保担当は、特定健診の受診率、重症化予防、がん検診などの指標を気にしている。保険者努力支援制度の評価と交付金に関わるから。「町の評価が上がる協力」は通りやすい","診療所が持ち込めるのは、「来院した人への健診・検診の勧め」と「精密検査の受診の後押し」。国の目標（精密検査90%）とつながる","「攻め」を言うときは「自己責任にしない、来ない人へ届ける」という意味で使う","避けること：予防で医療費が減ると断言する（短期の節約効果は分野により一様でない）。持ち場の違う相手にその場で結論を求める"],"misconceptions":["「健診も検診も町の仕事」→ 特定健診は保険者ごと、がん検診は市町村、職場の健診は事業主。町が直接持つのは国保の加入者分とがん検診","「予防すれば医療費は必ず減る」→ 分野による。予防の価値は健康寿命と生活の質で語る方が崩れない","「攻めの予防は新しい事業を作ること」→ 当面の中心は、既にある健診・検診の受診率と精密検査の受診率を上げること"],"local_checks":[{"what":"町の保険者努力支援制度で得点が低い項目と、診療所が手伝える項目","where":"町の国保担当"},{"what":"保健事業と介護予防の一体的実施を町がどう行っているか、医療側の役割はあるか","where":"町の保健師"},{"what":"糖尿病性腎症重症化予防プログラム（国の令和6年度版）の町での運用と、病院・診療所への紹介の流れ","where":"町の保健師"}],"topics":[],"units":[5],"home_units":[],"extra_links":[],"new_units":[],"app_links":[{"name":"予防医療","text":"予防医療（9章。「これからの予防医療：0次予防と攻めの予防医療」の節）"},{"name":"健診・検診・人間ドック","text":"健診・検診・人間ドック"},{"name":"一外来一おせっかい","text":"一外来一おせっかい"}],"down_text":"統合アプリ 予防医療（9章。「これからの予防医療：0次予防と攻めの予防医療」の節）、健診・検診・人間ドック、一外来一おせっかい。共通学習ツール 単元5 保健・予防","sources_text":"[厚労省 日本の健診（検診）制度の概要](https://www.mhlw.go.jp/content/10601000/000511508.pdf)、[予防接種](https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000022394.html)、[保険者努力支援制度](https://www.mhlw.go.jp/content/12401000/001241645.pdf)、[糖尿病性腎症重症化予防プログラム](https://www.mhlw.go.jp/stf/newpage_38699.html)、[U.E.N.O.Plan 掲載ページ](https://www.mhlw.go.jp/stf/index_00154.html)、[名古屋市 一体的実施](https://www.city.nagoya.jp/kenkofukushi/koureisha/1016414/1033647.html)","status":"照合済み","status_text":"照合済み（2026年11月11日）。U.E.N.O.Planは厚労省の[概要資料](https://www.mhlw.go.jp/content/10901000/001727087.pdf)と[本文](https://www.mhlw.go.jp/content/10901000/001727090.pdf)（2026年7月23日公表）で、予防の持ち場の表は厚労省の健診制度の資料で照合した。0次予防の定義は一次資料に当てていない。","checked_at":"2026-11-11","file":"07_攻めの予防医療.md"}]}</script>
<script>
"use strict";
/* 医療と社会のレファレンス v0
   データ：units-data（共通学習ツールWeb版のJSON、型はそのまま）と shelves-data（7棚）。
   単元・用語・問い・制約カードの表示は共通学習ツールWeb版（source/kyotsu-gakushu-web_v0.html）の関数を移して使う。
   外への通信はしない。保存は localStorage だけ。 */
const D = JSON.parse(document.getElementById("units-data").textContent);
const S = JSON.parse(document.getElementById("shelves-data").textContent);
const UNITS = Object.fromEntries(D.units.map(u => [u.unit, u]));
const CARDS = Object.fromEntries((D.cards || []).map(c => [c.id, c]));
const SHELVES = Object.fromEntries(S.shelves.map(s => [s.no, s]));
const SHELF_ORDER = S.shelves.map(s => s.no);
const BAND_OF = {};
S.bands.forEach(b => b.shelves.forEach(n => { BAND_OF[n] = b; }));
const HOME_SHELF = {};
S.shelves.forEach(s => (s.home_units || []).forEach(n => { HOME_SHELF[n] = s.no; }));
const DOWN_FROM = {};
S.shelves.forEach(s => (s.units || []).forEach(n => { (DOWN_FROM[n] = DOWN_FROM[n] || []).push(s.no); }));
const UNIT_ORDER = S.shelves.flatMap(s => s.home_units || []);
const main = document.getElementById("main");
const ST_CLASS = { "未作成": "st-none", "仮": "st-draft", "照合済み": "st-verified", "確認済み": "st-confirmed" };
const MK_TYPES = [["imp", "★ 重要"], ["save", "📌 保存"], ["weak", "🔁 苦手"], ["done", "✅ 復習した"]];

/* ---------- 端末内の保存。使えない環境でも画面は動く ---------- */
const PREFIX = "iryoshakai:";
const store = {
  get(k, d) { try { const v = localStorage.getItem(PREFIX + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(PREFIX + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  works() { try { localStorage.setItem(PREFIX + "_", "1"); localStorage.removeItem(PREFIX + "_"); return true; } catch (e) { return false; } },
};
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const jpDate = s => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ""); return m ? `${m[1]}年${+m[2]}月${+m[3]}日` : (s || ""); };
function noteOpen(id) {
  const o = store.get("opens", {});
  const a = o[id] || [];
  const t = today();
  if (a[a.length - 1] !== t) { a.push(t); o[id] = a; store.set("opens", o); }
}
const opensOf = id => (store.get("opens", {})[id] || []);

/* ---------- 文字の整形 ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const extLink = (u, t) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${t}<span class="sr">（新しいタブで開く）</span></a>`;
function marker(label) {
  if (label === "要入力") return '<span class="tag todo">要入力</span>';
  return `<span class="tag need">${label}</span>`;
}
function inline(s) {
  let o = esc(s);
  o = o.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  o = o.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, (m, t, u) => extLink(u, t));
  o = o.replace(/単元(\d{1,2})(?!\d)/g, (m, n) => UNITS[n] ? `<a href="#u${n}">単元${n}</a>` : m);
  o = o.replace(/棚([1-7])(?![\d０-９])/g, (m, n) => `<a href="#s${n}">棚${n}</a>`);
  o = o.replace(/【(.+?)】/g, (m, t) => marker(t));
  return o;
}
const plain = s => String(s ?? "").replace(/\*\*/g, "").replace(/\[([^\]]+)\]\([^)]*\)/g, "$1");
function tableHtml(cols, rows, opt) {
  opt = opt || {};
  const cell = opt.cell || ((c) => inline(c));
  return `<div class="tbl-wrap"${opt.label ? ` role="region" aria-label="${esc(opt.label)}"` : ""}><table${opt.cls ? ` class="${opt.cls}"` : ""}><thead><tr>${cols.map(c => `<th scope="col"${/出典/.test(c) ? ' class="src"' : ""}>${esc(c)}</th>`).join("")}</tr></thead><tbody>${rows.map((r, i) => `<tr${opt.rowCls ? opt.rowCls(r, i) : ""}>${r.map((c, j) => `<td${/^(時期|月|年度)$/.test(cols[j]) ? ' class="when"' : ""}${/出典/.test(cols[j]) ? ' class="src"' : ""}>${cell(c, i, j)}${j === 0 && opt.first ? opt.first(r, i) : ""}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function blocksHtml(blocks) {
  return (blocks || []).map(b => {
    if (b.kind === "para") return `<p class="para">${inline(b.text)}</p>`;
    if (b.kind === "bullets") return `<ul class="bul">${b.items.map(i => `<li>${inline(i)}</li>`).join("")}</ul>`;
    if (b.kind === "numbered") return `<ol class="bul">${b.items.map(i => `<li>${inline(i)}</li>`).join("")}</ol>`;
    if (b.kind === "table") return tableHtml(b.columns, b.rows);
    if (b.kind === "head") return `<h3 class="sub-h">${esc(b.text)}${b.note ? `<span class="muted small">${esc(b.note)}</span>` : ""}</h3>${b.inline ? `<p class="para">${inline(b.inline)}</p>` : ""}`;
    return "";
  }).join("");
}
const statusTag = (st, date) => `<span class="tag ${ST_CLASS[st] || "st-none"}">${esc(st)}${date ? " " + esc(jpDate(date)) : ""}</span>`;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast.timer); toast.timer = setTimeout(() => { t.hidden = true; }, 2600);
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("コピーしました"); }
  catch (e) { toast("自動でコピーできません。下の欄の文字を選んでコピーしてください"); }
}

/* ---------- 学習の印（統合アプリのマイノートと同じ4種。キーは「場所|番号」） ---------- */
const marks = () => store.get("marks", {});
function marksHtml(id, n, title) {
  const st = marks()[id + "|" + n] || {};
  return `<span class="marks" role="group" aria-label="${esc(title)}の印" data-mid="${esc(id)}" data-mn="${esc(n)}" data-mt="${esc(title)}">${MK_TYPES.map(([k, l]) => `<button type="button" class="mk ${k}" data-mk="${k}" aria-pressed="${!!st[k]}">${l}${k === "done" && st.done ? " " + esc(String(st.done).slice(5)) : ""}</button>`).join("")}</span>`;
}
function bindMarks(root) {
  root.querySelectorAll(".marks .mk").forEach(b => b.addEventListener("click", () => {
    const g = b.parentElement, key = g.dataset.mid + "|" + g.dataset.mn, k = b.dataset.mk;
    const all = marks();
    const st = all[key] || {};
    if (k === "done") st.done = st.done ? "" : today(); else st[k] = !st[k];
    st.h = g.dataset.mt; st.t = Date.now(); st.href = location.hash || "#home";
    if (!st.imp && !st.save && !st.weak && !st.done) delete all[key]; else all[key] = st;
    store.set("marks", all);
    b.setAttribute("aria-pressed", String(k === "done" ? !!st.done : !!st[k]));

/* ---------- 暦：今月・今年度の印 ---------- */
function monthHit(label, m) {
  const r = /(\d{1,2})月?(?:〜(\d{1,2}))?月/.exec(label);
  if (!r) return false;
  const a = +r[1], b = r[2] ? +r[2] : a;
  return a <= b ? (m >= a && m <= b) : (m >= a || m <= b);
}
const fiscalYear = () => { const d = new Date(); return d.getMonth() + 1 >= 4 ? d.getFullYear() : d.getFullYear() - 1; };
function yearCalHtml() {
  const y = S.guide.calendar.year, m = new Date().getMonth() + 1;
  return tableHtml(y.columns, y.rows, {
    label: y.title,
    rowCls: r => monthHit(r[0], m) ? ' class="is-now"' : "",
    first: r => monthHit(r[0], m) ? ' <span class="tag now">今月</span>' : "",
  });
}
function multiCalHtml() {
  const y = S.guide.calendar.multi, fy = fiscalYear();
  const hit = r => (r[0].match(/\d{4}/g) || []).map(Number).includes(fy);
  return tableHtml(y.columns, y.rows, {
    label: y.title,
    rowCls: r => hit(r) ? ' class="is-now"' : "",
    first: r => hit(r) ? ' <span class="tag now">今年度</span>' : "",
  });
}

/* ---------- 棚ページ ---------- */
function numCell(text, key, item, col) {
  const parts = String(text).split("【要入力】");
  if (parts.length === 1) return inline(text);
  const nums = store.get("nums", {});
  return parts.map((p, i) => {
    let h = inline(p);
    if (i < parts.length - 1) {
      const k = `${key}:${i}`;
      h += `<input class="num-in" data-num="${esc(k)}" value="${esc(nums[k] ? nums[k].v : "")}" placeholder="要入力" aria-label="${esc(plain(item))}の${esc(col)}（自分で入力。この端末にだけ残る）">`;
    }
    return h;
  }).join("");
}
function bindNums(root) {
  root.querySelectorAll("[data-num]").forEach(el => el.addEventListener("input", () => {
    const nums = store.get("nums", {});
    if (el.value.trim()) nums[el.dataset.num] = { v: el.value, d: today() }; else delete nums[el.dataset.num];
    store.set("nums", nums);
  }));
}
function localHtml(s) {

      <div class="sites">${S.sites.map(site => {
        const k = `${s.id}:${i}:${site.id}`, v = loc[k] || {};

function bindLocal(root) {
  root.querySelectorAll("[data-local]").forEach(t => t.addEventListener("input", () => {

function bindUChecks(root) {
  const save = key => {
    const box = root.querySelector(`[data-memo="${key}"]`), ta = root.querySelector(`[data-memo-text="${key}"]`);

    const blob = new Blob([dump()], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `iryo-shakai-ref_${today()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    msg.textContent = "ファイルに書き出しました（端末の中に保存。送信はしません）。";
  });
  let armed = false;
  const load = text => {
    let o;
    try { o = JSON.parse(text); } catch (e) { msg.textContent = "読み込めません。書き出した文字をそのまま貼ってください。"; return; }
    if (!o || o.schema !== "iryo-shakai-ref/1") { msg.textContent = "このページで書き出したJSONではありません（schema が違います）。"; return; }
    if (!armed) { armed = true; msg.textContent = "もう一度押すと、この端末の記録が読み込んだ中身に置き換わります。"; return; }
    armed = false;
    ["marks", "opens", "local", "nums"].forEach(k => store.set(k, o[k] || {}));
    try { Object.keys(localStorage).filter(k => k.startsWith(PREFIX + "memo:")).forEach(k => localStorage.removeItem(k)); } catch (e) { }
    Object.entries(o.memo || {}).forEach(([k, v]) => store.set(k, v));
    toast("読み込みました"); sideCount(); viewNote();
  };
  document.getElementById("io-load").addEventListener("click", () => load(area.value));
  document.getElementById("io-pick").addEventListener("change", e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    f.text().then(t => { area.value = t; armed = false; load(t); });
  });
}

/* ---------- 検索（棚・単元・用語・問い・制約カード・暦を横断）。当たりは1行ずつ出し、押すとその行まで飛んで光らせる ---------- */
function buildIndex() {
  const idx = [];
  const head = (kind, title, href) => idx.push({ kind, title, href, text: "", line: "", head: true });
  const line = (kind, title, href, t) => { if (t && String(t).trim()) idx.push({ kind, title, href, text: plain(t), line: String(t) }); };
  const blockLines = blocks => (blocks || []).flatMap(b => b.kind === "table" ? b.rows.map(r => r.join(" ")) : b.kind === "para" ? [b.text] : b.kind === "head" ? [b.text, b.inline || ""] : (b.items || []));
  S.shelves.forEach(s => {
    const t = `棚${s.no} ${s.name}`;
    const sec = (id, name, lines) => { const href = `#s${s.no}:${id}`; head("棚", `${t} › ${name}`, href); lines.forEach(x => line("棚", `${t} › ${name}`, href, x)); };
    head("棚", t, `#s${s.no}`);
    line("棚", `${t} › 状態`, `#s${s.no}`, s.status_text);
    sec("sum", "一言で", [s.summary]);
    sec("fig", "一枚図", [s.figure.plan]);
    sec("num", "押さえる数字", [...s.numbers.rows.map(r => r.join(" ")), ...blockLines(s.numbers.after)]);
    sec("ov", "全体像", s.overview.flatMap(x => [x.title.split("：")[1] || "", x.text, ...blockLines(x.blocks)]));
    sec("cal", "暦", [...s.calendar.rows.map(r => r.join(" ")), ...blockLines(s.calendar.after)]);
    sec("neg", "会議・交渉で使う", s.negotiation);
    sec("mis", "よくある誤解", s.misconceptions);
    sec("local", "自分の現場で確かめること", s.local_checks.flatMap(c => [c.what, c.where]));
    (s.topics || []).forEach((tp, i) => sec(`t${i}`, tp.title, [tp.summary, ...blockLines(tp.blocks)]));
    sec("down", "降り先", [s.down_text]);
    sec("src", "この棚の照合に使った資料", [s.sources_text]);
  });
  const c = S.guide.calendar;
  [["year", c.year], ["multi", c.multi]].forEach(([id, tb]) => { head("暦", `棚をまたぐ暦 › ${tb.title}`, "#cal:" + id); tb.rows.forEach(r => line("暦", `棚をまたぐ暦 › ${tb.title}`, "#cal:" + id, r.join(" "))); });
  S.guide.sections.filter(x => x.title !== "棚をまたぐ暦").forEach(x => { head("記録", `使い方と照合の記録 › ${x.title}`, "#about"); blockLines(x.blocks).forEach(t => line("記録", `使い方と照合の記録 › ${x.title}`, "#about", t)); });
  D.units.forEach(u => {
    const it = u.items, t = `単元${u.unit} ${u.title}`;
    const sec = (i, lines) => { const href = `#u${u.unit}:i${i}`; lines.forEach(x => line("単元", `${t} › ${ITEM_NAMES[i - 1]}`, href, x)); };
    head("単元", t, `#u${u.unit}`);
    sec(1, [it.summary.text]);
    sec(2, [...it.mechanism.flows.map(f => [f.who, f.what, f.to, f.note].filter(Boolean).join(" ")), ...it.mechanism.notes]);
    sec(3, [...it.timeline.rows.map(r => [r.when, r.event, r.basis].join(" ")), ...it.timeline.notes]);
    sec(4, it.field_limits.points);
    sec(5, [it.perspectives.medical, it.perspectives.admin, it.perspectives.welfare]);
    sec(6, it.misconceptions.map(m => m.myth + " " + m.fact));
    sec(7, it.terms.map(x => [x.medical, x.admin, x.meaning].join(" ")));
    sec(8, it.sources.map(x => x.text));
    sec(9, it.local_checks.flatMap(x => [x.what, x.where]));
    sec(10, it.self_check.flatMap(x => [x.question, x.answer]));
  });
  (D.questions || []).forEach(q => { head("問い", q.q, `#q-${q.id}`); [q.answer, ...q.checks, ...q.ask].forEach(x => line("問い", q.q, `#q-${q.id}`, x)); });
  (D.glossary || []).forEach(g => { head("用語", g.term, "#terms"); [g.medical, g.admin, g.welfare, g.gap, g.common].forEach(x => line("用語", g.term, "#terms", x)); });
  (D.cards || []).forEach(cd => { head("カード", cd.role, `#card-${cd.id}`); [...cd.can, ...cd.cannot, ...cd.calendar, ...cd.procedure, cd.metrics, ...cd.bad, ...cd.good, cd.basis.join("、")].forEach(x => line("カード", cd.role, `#card-${cd.id}`, x)); });
  return idx;
}
let INDEX = null;
const SEARCH_MAX = 80;
let lastHits = [], lastQ = "", pendingFind = null;
function excerpt(text, q) {
  const i = text.indexOf(q);
  if (i < 0) return esc(text.slice(0, 70)) + (text.length > 70 ? "…" : "");
  const a = Math.max(0, i - 24), b = Math.min(text.length, i + q.length + 50);
  return (a > 0 ? "…" : "") + esc(text.slice(a, i)) + "<mark>" + esc(q) + "</mark>" + esc(text.slice(i + q.length, b)) + (b < text.length ? "…" : "");
}
function viewSearch(q) {
  INDEX = INDEX || buildIndex();
  setNav("", `「${esc(q)}」の検索`);
  const heads = INDEX.filter(e => e.head && e.title.includes(q));
  const lines = INDEX.filter(e => !e.head && e.text.includes(q));
  const hits = heads.concat(lines);
  lastHits = hits.slice(0, SEARCH_MAX); lastQ = q;
  main.innerHTML = `<section class="sec"><h1 class="sec-h" style="border-top:0;padding-top:0">「${esc(q)}」の検索結果（${hits.length}件）</h1>
    <p class="small muted" aria-live="polite">${hits.length}件見つかりました。${hits.length > SEARCH_MAX ? `先頭の${SEARCH_MAX}件を出しています。言葉を足して絞ってください。` : ""}押すと、その行まで飛んで光らせます。</p>
    <div class="hits">${lastHits.map((e, i) => `<a class="hit" href="${e.href}" data-hit="${i}"><span><span class="tag basis">${e.kind}</span> <b>${esc(e.title)}</b></span>${e.head ? "" : `<small>${excerpt(e.text, q)}</small>`}</a>`).join("") || '<p class="hit muted">見つかりません。別の言い方を試すか、<a href="#terms">用語集</a>を見てください。</p>'}</div></section>`;
  main.querySelectorAll("[data-hit]").forEach(a => a.addEventListener("click", ev => {
    if (ev.button !== 0 || ev.ctrlKey || ev.metaKey || ev.shiftKey || ev.altKey) return;
    ev.preventDefault();
    const e = lastHits[+a.dataset.hit];
    pendingFind = e.head ? null : { q: lastQ, line: e.line };
    if (location.hash === e.href) { qg.value = ""; current = ""; route(); }
    else location.hash = e.href.slice(1);
  }));
}
/* 見えている文字だけを、比べやすい形にそろえる（読み上げ用の文字・今月の札・印のボタンは除く） */
const norm = s => plain(s).replace(/【要入力】/g, "").replace(/【(.+?)】/g, "$1").replace(/→/g, "").replace(/\s+/g, "");
function textOf(el) {
  let out = "";
  const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  for (let n = w.nextNode(); n; n = w.nextNode()) { if (!n.parentElement.closest(".sr, .tag.now, .marks")) out += n.nodeValue; }
  return out.replace(/\s+/g, "");
}
function markIn(el, q) {
  /* 太字やリンクの境目をまたぐ言葉にも印を付ける（文字の並びをつないで探し、またいだ部分ごとに包む） */
  const nodes = [];
  const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  for (let n = w.nextNode(); n; n = w.nextNode()) { if (!n.parentElement.closest(".sr, .marks")) nodes.push(n); }
  const all = nodes.map(n => n.nodeValue).join("");
  const hits = [];
  for (let i = all.indexOf(q); i >= 0; i = all.indexOf(q, i + q.length)) hits.push(i);
  if (!hits.length) return;
  const starts = []; let pos = 0;
  nodes.forEach(n => { starts.push(pos); pos += n.nodeValue.length; });
  for (let k = nodes.length - 1; k >= 0; k--) {
    const n = nodes[k], s0 = starts[k], s1 = s0 + n.nodeValue.length;
    const parts = hits.map(h => [Math.max(h, s0) - s0, Math.min(h + q.length, s1) - s0]).filter(([x, y]) => x < y).reverse();
    parts.forEach(([x, y]) => {
      const mid = n.splitText(x); mid.splitText(y - x);
      const m = document.createElement("mark"); m.className = "found";
      mid.parentNode.replaceChild(m, mid); m.appendChild(mid);
    });
  }
}
function findLine(q, lineText) {
  const nq = norm(q), nl = norm(lineText), pre = nl.slice(0, 12);
  const cands = [...main.querySelectorAll("p, li, tr, summary, h3, .flow, .three > div, .u-check label")]
    .map(el => ({ el, t: textOf(el) })).filter(x => x.t.includes(nq));
  if (!cands.length) return false;
  const best = (cands.filter(x => x.t.includes(pre)).length ? cands.filter(x => x.t.includes(pre)) : cands).sort((a, b) => a.t.length - b.t.length)[0].el;
  for (let d = best.closest("details"); d; d = d.parentElement && d.parentElement.closest("details")) d.open = true;
  markIn(best, q);
  best.classList.remove("flash"); void best.offsetWidth; best.classList.add("flash");
  best.scrollIntoView({ block: "center" });
  best.setAttribute("tabindex", "-1"); best.focus({ preventScroll: true });
  return true;
}
function runFind() {
  if (!pendingFind) return;
  const p = pendingFind; pendingFind = null;
  findLine(p.q, p.line);
}

/* ---------- 画面の切り替え ---------- */
function jump(id) {
  const t = document.getElementById(id);
  if (t) { t.scrollIntoView(); const h = t.querySelector("h2,h3,summary") || t; h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); }
}
let current = "";
function route(initial) {
  const h = decodeURIComponent(location.hash.slice(1)) || "home";
  const [base, sec] = h.split(":");
  if (base === current && sec) { jump("sec-" + sec); runFind(); return; }
  current = base;
  let m;
  if ((m = base.match(/^s(\d)$/))) viewShelf(+m[1], sec);
  else if ((m = base.match(/^u(\d+)$/))) viewUnit(+m[1], sec);
  else if ((m = base.match(/^q-(.+)$/))) { current = ""; viewQuestions(m[1]); markScrollTables(); runFind(); return; }
  else if ((m = base.match(/^card-(.+)$/))) viewCard(m[1]);
  else if (base === "cal") viewCal();
  else if (base === "about") viewAbout();
  else if (base === "units") viewUnits();
  else if (base === "terms") viewTerms();
  else if (base === "questions") viewQuestions();
  else if (base === "cards") viewCards();
  else if (base === "note") viewNote();
  else { current = "home"; viewHome(); }
  markScrollTables();
  if (base === "cal" && sec) jump("sec-" + sec);
  if (!sec && !pendingFind) { window.scrollTo(0, 0); if (!initial) main.focus({ preventScroll: true }); }
  runFind();
}
function markScrollTables() {
  main.querySelectorAll(".tbl-wrap").forEach(w => {
    if (w.scrollWidth > w.clientWidth + 1) { w.tabIndex = 0; if (!w.getAttribute("aria-label")) { w.setAttribute("role", "region"); w.setAttribute("aria-label", "横に動かせる表"); } }
    else w.removeAttribute("tabindex");
  });
}
window.addEventListener("resize", () => { clearTimeout(markScrollTables.t); markScrollTables.t = setTimeout(markScrollTables, 200); });
window.addEventListener("hashchange", () => {
  const g = document.getElementById("q");
  if (g.value) g.value = "";
  route();
});
const qg = document.getElementById("q");
qg.addEventListener("input", () => {
  const q = qg.value.trim();
  if (q) { current = ""; viewSearch(q); } else route();
});
document.getElementById("search-form").addEventListener("submit", e => e.preventDefault());
document.getElementById("side-nav").innerHTML = sideHtml();
document.getElementById("foot").innerHTML = `中身：${esc(S.meta.content_doc)}（照合 2026年11月11日。docs/shelves の書き出しから取り込み）／単元・用語・問い・制約カード：共通学習ツール 教材 v0（基準日 ${esc(D.meta.baseline)}。${esc(D.meta.status)}）<br>このページは外と通信しません。「自分の現場」の答えと学習の印は、この端末の中だけに残ります。会議で数字や条文を言う前に、各棚の資料で確かめてください。${store.works() ? "" : "<br><b>この環境では保存ができません。書いた内容は閉じると消えます。</b>"}`;
sideCount();
route(true);

</script>
